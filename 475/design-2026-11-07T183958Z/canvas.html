/* ---- trainm8 tokens, copied from app/styles/tailwind.css (ADR 0085) ---- */
:root{
  --radius:.375rem;
  --background:oklch(0.975 0.003 197);--foreground:oklch(0.148 0.004 228.8);
  --card:oklch(1 0 0);--card-foreground:oklch(0.148 0.004 228.8);
  --primary:#0d7a68;--primary-foreground:#fff;
  --secondary:oklch(0.955 0.004 197);--secondary-foreground:oklch(0.21 0.006 285.885);
  --muted:oklch(0.948 0.004 197);--muted-foreground:oklch(0.52 0.016 213.5);
  --border:oklch(0.915 0.005 214.3);
  --ring:color-mix(in oklab,var(--primary) 55%,transparent);
  --status-under:oklch(0.55 0.13 65);
  --track-run:oklch(0.63 0.16 32);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --font-sans:'Public Sans Variable',system-ui,sans-serif;
  /* canvas chrome only */
  --chrome:#f2f3f5;--chrome-ink:#1d2329;--chrome-mute:#5b6570;--chrome-line:#d9dde2;
  color-scheme:light;
}
.dark{
  --background:oklch(0.148 0.004 228.8);--foreground:oklch(0.987 0.002 197.1);
  --card:oklch(0.205 0.007 223.9);--card-foreground:oklch(0.987 0.002 197.1);
  --primary:#35b89c;--primary-foreground:#0c1512;
  --secondary:oklch(0.275 0.011 216.9);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.255 0.01 216.9);--muted-foreground:oklch(0.723 0.014 214.4);
  --border:oklch(1 0 0 / 10%);
  --ring:color-mix(in oklab,var(--primary) 60%,transparent);
  --status-under:oklch(0.82 0.12 65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);background:var(--chrome);color:var(--chrome-ink)}
button,a,[role=button]{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}

/* ---- type steps (design-system.md, Type) ---- */
.t-title{font-size:1.5rem;line-height:1.875rem;font-weight:650;letter-spacing:-.02em}
.t-heading{font-size:1.125rem;line-height:1.5rem;font-weight:600;letter-spacing:-.012em}
.t-callout{font-size:.9375rem;line-height:1.3125rem;font-weight:500;letter-spacing:-.004em}
.t-footnote{font-size:.8125rem;line-height:1.125rem;font-weight:400;letter-spacing:.002em}
.t-caption{font-size:.75rem;line-height:1rem;font-weight:500;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--muted-foreground)}
.fg{color:var(--foreground)}
.semi{font-weight:600}
.wrap{overflow-wrap:anywhere}
.nowrap{white-space:nowrap}

/* ---- the app surface ---- */
.app{background:var(--background);color:var(--foreground);font-size:.875rem;min-height:100%}
.page{max-width:42rem;margin:0 auto;padding:24px 16px 48px}
@media (min-width:768px){.solo .page{padding:32px 32px 64px}}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:16px;min-height:44px}
.phead .back{width:32px;height:32px;display:grid;place-items:center;border-radius:999px;position:relative;flex-shrink:0}
.phead .back::after{content:"";position:absolute;inset:-6px}
.phead h1{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);color:var(--card-foreground);border-radius:15.6px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1),0 0 0 1px color-mix(in oklab,var(--foreground) 5%,transparent);padding:16px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.dark .card{box-shadow:0 0 0 1px color-mix(in oklab,var(--foreground) 10%,transparent)}
.cpad{padding:0 16px}
@media (min-width:768px){.solo .card{padding:20px 0}.solo .cpad{padding:0 20px}}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:.75rem;font-weight:500;white-space:nowrap;background:var(--secondary);color:var(--secondary-foreground)}
.badge.primary{background:var(--primary);color:var(--primary-foreground)}
.well{background:color-mix(in oklab,var(--muted) 60%,transparent);border-radius:15.6px;padding:16px}
.stack>*+*{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:15.6px;font-size:.875rem;font-weight:500;white-space:nowrap}
.btn.outline{box-shadow:inset 0 0 0 1px var(--border);background:var(--card)}
.btn.ghost{background:transparent}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.secondary{background:var(--secondary)}
a.loc{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in oklab,currentColor 40%,transparent);text-underline-offset:2px}
@media (hover:hover) and (pointer:fine){a.loc:hover{text-decoration-color:currentColor}}
.placeholder{border:1px dashed var(--border);border-radius:15.6px;padding:12px 16px}

/* the session list in a week */
.weeks>li+li{margin-top:12px}
.rows{list-style:none;margin:0;padding:0 16px}
@media (min-width:768px){.solo .rows{padding:0 20px}}
.rows>li+li{border-top:1px solid color-mix(in oklab,var(--border) 60%,transparent)}
.rows>li{padding:4px 0}
.rows>li:first-child{padding-top:0}
.rows>li:last-child{padding-bottom:0}
.rows>li.static{padding:12px 0}
.rows>li.static:first-child{padding-top:4px}
.rows>li.static:last-child{padding-bottom:0}
.dayline{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}

/* THE ROW: one control, 44px or more, a hairline chevron its only mark */
.srow{display:flex;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:8px;min-height:44px;border-radius:10.8px;user-select:none;-webkit-touch-callout:none;transition:background-color 160ms var(--ease-out)}
.srow:active{background:var(--muted);transition:none}
@media (hover:hover) and (pointer:fine){.srow:hover{background:color-mix(in oklab,var(--muted) 50%,transparent)}}
.srow:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.srow .txt{flex:1;min-width:0;display:block}
.srow .txt>span{display:block}
.chev{flex-shrink:0;color:var(--muted-foreground);transition:transform 160ms var(--ease-out)}
.srow[aria-expanded=true] .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* the panel below the row */
.panel{overflow:hidden}
.panel[hidden]{display:none}
.panel .pin{padding:4px 0 8px}
.slot{display:block}
.slot p{margin:0}
.slot p+p{margin-top:2px}

/* today's row (before) */
.today-row{padding:8px 0}

/* session page */
.meta{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.dot::before{content:"·";color:var(--muted-foreground)}
.lead{font-size:1.5rem;line-height:1.875rem;font-weight:600;letter-spacing:-.02em}
.strip{display:flex;gap:2px;height:28px;align-items:flex-end}
.strip span{background:var(--track-run);opacity:.85;border-radius:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---- canvas chrome ---- */
.cv{max-width:1320px;margin:0 auto;padding:24px 20px 96px}
.cv h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.cv h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.cv p{margin:6px 0;line-height:1.5}
.cv .sub{color:var(--chrome-mute);font-size:14px}
.board{background:#fff;border:1px solid var(--chrome-line);border-radius:14px;padding:20px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:#e7eaee;font-size:13px;font-weight:600;color:var(--chrome-ink)}
.chip.rec{background:#0d7a68;color:#fff}
.chip.pend{background:#fff3d6;color:#6b4a00}
.status{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#e7eaee;color:#39424b;vertical-align:middle}
.status.chosen{background:#0d7a68;color:#fff}
.status.current{background:#dbe9ff;color:#173c78}
.frames{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin-top:12px}
.frame{width:390px;max-width:100%;flex-shrink:0}
.frame .lbl{font-size:13px;font-weight:600;color:var(--chrome-mute);margin:0 0 6px}
.phone{width:390px;max-width:100%;height:844px;overflow:auto;border-radius:28px;border:1px solid var(--chrome-line);box-shadow:0 10px 30px rgb(0 0 0/.08);background:var(--background);overscroll-behavior:contain;position:relative}
.phone.tall{height:auto;max-height:none;overflow:visible}
table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.cmp th,table.cmp td{border-top:1px solid var(--chrome-line);padding:8px 10px;text-align:left;vertical-align:top}
table.cmp th{width:200px;color:var(--chrome-mute);font-weight:600}
.cv ul,.cv ol{margin:6px 0;padding-left:20px;line-height:1.5}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.seg{display:inline-flex;background:#e7eaee;border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:#39424b}

<body>
<div id="root"></div>
<script>

const corpus = c => ({kind:'corpus',citation:c});
const CONV = {kind:'convention'}, HAND = {kind:'hand-written'};

/* ---- the slot's sentence: nbProvenanceSentence, verbatim logic ---- */
const formatCitation = c => `${c.author} — ${c.work}${c.year == null ? '' : ` (${c.year})`}`;
function sentence(p){
  switch(p.kind){
    case 'corpus': return L.source(formatCitation(p.citation));
    case 'convention': return L.convention;
    case 'hand-written': return L.handWritten;
    case 'community': return p.attribution ? L.publishedBy(p.attribution.displayName) : L.unnamedPublisher;
  }
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function locatorHtml(loc){
  if(!loc) return '';
  const href = loc.startsWith('doi:') ? `https://doi.org/${loc.slice(4)}` : loc;
  return `<a class="loc wrap" href="${esc(href)}" target="_blank" rel="noreferrer">${esc(loc)}</a>`;
}
/* ONE slot, used by the preview panel and the session page alike.
   Line 1: [Endret av deg · ] sentence [ · date] [ · locator] [ · Fjernet av en moderator]
   Line 2: the non-vouch, on a community row and nowhere else. */
function slotHtml(p, o = {}){
  const parts = [];
  if(o.adopted) parts.push(esc(L.adopted));
  parts.push(esc(sentence(p)));
  if(p.kind === 'community' && p.attribution && p.attribution.publishedAt) parts.push(`<span class="nowrap">${esc(p.attribution.publishedAt)}</span>`);
  if(p.kind === 'corpus' && p.citation.locator) parts.push(locatorHtml(p.citation.locator));
  if(p.kind === 'community' && p.takenDown) parts.push(esc(L.takenDown));
  const nv = p.kind === 'community' ? `<p data-non-vouch>${esc(L.nonVouch)}</p>` : '';
  return `<div class="slot t-footnote mute wrap" data-provenance><p>${parts.join(' · ')}</p>${nv}</div>`;
}

/* ===================================================================
   The generate preview
   =================================================================== */
const CHEV = `<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg>`;
const BACK = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg>`;
let uid = 0;
function dayline(r){
  const bits = [esc(r.sport)];
  if(!r.unfilled){ bits.push(esc(r.archetype)); if(r.zone != null) bits.push(esc(L.zone(r.zone))); }
  return `<span class="dayline t-footnote mute"><span class="fg semi">${WD[r.wd]}</span>${bits.map(b => ` <span aria-hidden="true">·</span> <span class="nowrap">${b}</span>`).join('')}</span>`;
}
function rowHtml(r, mode){
  if(r.unfilled){
    return `<li class="static" data-unfilled><div class="stack">${dayline(r)}<p class="t-footnote" style="margin:0">${esc(L.nothingToPlace(r.archetypes.length > 1 ? r.archetypes.slice(0,-1).join(', ') + ' eller ' + r.archetypes.at(-1) : r.archetypes[0], r.phase))}</p></div></li>`;
  }
  if(mode === 'today'){
    const nv = r.prov.kind === 'community' ? `<p class="t-footnote mute" style="margin:0">${esc(L.nonVouch)}</p>` : '';
    return `<li class="static"><div class="stack">${dayline(r)}<p class="t-callout wrap" style="margin:0;font-weight:400">${esc(r.title)}</p><p class="t-footnote mute wrap" style="margin:0" data-provenance>${esc(sentence(r.prov))}</p>${nv}</div></li>`;
  }
  const id = 'r' + (++uid);
  return `<li><button type="button" class="srow" id="${id}" aria-expanded="false" aria-controls="${id}-p" data-row>
      <span class="txt">${dayline(r)} <span class="t-callout wrap" style="font-weight:400">${esc(r.title)}</span></span>${CHEV}
    </button>
    <div class="panel" id="${id}-p" role="region" aria-labelledby="${id}" hidden><div class="pin"><div class="well" style="padding:12px;border-radius:13.2px">${slotHtml(r.prov)}</div></div></div></li>`;
}
function weekHtml(w, total, mode){
  const role = w.role === 'loading' ? '' : `<span class="badge">${w.role === 'recovery' ? 'lett uke' : 'nedtrapping'}</span>`;
  const fin = w.final ? `<span class="badge primary">${L.raceWeek}</span>` : '';
  const rows = [...w.rows].sort((a,b) => a.wd - b.wd);
  const sessions = rows.filter(r => !r.unfilled), unfilled = rows.filter(r => r.unfilled);
  return `<li><article class="card" aria-labelledby="w${w.n}${mode}">
    <div class="cpad stack">
      <div style="display:flex;align-items:baseline;gap:8px">
        <h3 id="w${w.n}${mode}" class="t-callout semi num" style="margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;flex:1;min-width:0">${L.week(w.n)}${role}${fin}</h3>
        <span class="t-footnote mute num nowrap">${w.date}</span>
      </div>
      <p class="t-footnote mute num" style="margin:0">${L.weekOf(w.idx,total)} · ${w.phase}</p>
      <p class="t-footnote num" style="margin:0;display:flex;flex-wrap:wrap;column-gap:6px">${w.targets.map((t,i) => (i ? '<span aria-hidden="true">·</span>' : '') + `<span class="nowrap">${t}</span>`).join('')}</p>
    </div>
    <ul class="rows">${[...sessions, ...unfilled].map(r => rowHtml(r, mode)).join('')}</ul>
  </article></li>`;
}
function previewHtml(d, mode){
  const sessions = d.weeks.reduce((n,w) => n + w.rows.filter(r => !r.unfilled).length, 0);
  const abs = [];
  if(d.absences.noTrack) abs.push(`<p class="t-footnote" style="margin:0"><span class="semi">${L.noTrack(d.absences.noTrack)}</span> ${L.noTrackBody}</p>`);
  if(d.absences.empty) abs.push(`<p class="t-footnote num" style="margin:0"><span class="semi">${L.emptyDays(d.absences.empty)}</span> ${L.emptyDaysBody}</p>`);
  const cap = d.capacity ? `<p class="t-footnote mute num" style="margin:0" data-capacity="lowered">${d.capacity}</p>`
    : d.capacityOver ? `<p class="t-footnote num" style="margin:0" data-capacity="over"><span class="semi">Sesongen passer fortsatt ikke timene dine.</span> ${d.capacityOver}</p>` : '';
  const more = d.total - d.weeks.length;
  return `<div class="app"><main class="page">
    <div class="phead"><span class="back mute" aria-label="${L.layOutMyself}">${BACK}</span><h1 class="t-heading">${L.title}</h1></div>
    <div class="stack" style="margin-bottom:24px">
      <p class="t-heading wrap" style="margin:0;font-weight:400">${esc(d.event)}</p>
      <p class="t-footnote mute num" style="margin:0">${d.date} · ${d.summary} · ${d.fit}</p>
      <p class="t-footnote mute" style="margin:0">${mode === 'today' ? L.introToday : L.introNew}</p>
    </div>
    ${abs.length ? `<section class="well" style="margin-bottom:24px;padding:16px"><h2 class="t-callout semi" style="margin:0 0 8px">${L.absencesTitle}</h2><div style="display:grid;gap:8px">${abs.join('')}</div></section>` : ''}
    <div class="placeholder t-footnote mute" style="margin-bottom:32px">${L.questions} <span class="nowrap">(uendret)</span></div>
    <section class="season" aria-labelledby="season-${mode}">
      <div class="stack" style="margin-bottom:12px">
        <h2 id="season-${mode}" class="t-heading" style="margin:0">${L.seasonTitle}</h2>
        <p class="t-footnote mute num" style="margin:0">${d.phases}</p>
        ${cap}
      </div>
      <ul style="list-style:none;margin:0;padding:0" class="weeks">${d.weeks.map(w => weekHtml(w, d.total, mode)).join('')}</ul>
      ${more > 0 ? `<div class="card" style="margin-top:12px;padding:12px 0"><div class="cpad" style="display:flex;align-items:center;gap:12px;min-height:44px"><span style="flex:1"><span class="t-callout semi" style="display:block">${L.remaining(more)}</span><span class="t-footnote mute" style="display:block">${L.remainingDetail}</span></span>${CHEV}</div></div>` : ''}
    </section>
    <div style="margin-top:32px;display:grid;gap:12px"><span class="btn primary" style="width:100%">${L.approve(sessions)}</span></div>
  </main></div>`;
}

/* ---- the interaction: one open at a time, Escape, re-tap, and the
        tapped row held still when a panel above it closes ---- */
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function scroller(el){ for(let n = el.parentElement; n; n = n.parentElement){ const s = getComputedStyle(n).overflowY; if((s === 'auto' || s === 'scroll') && n.scrollHeight > n.clientHeight) return n; } return document.scrollingElement; }
// A panel that opened past the fold is brought up just far enough to read.
function reveal(panel){ if(document.body.dataset.quiet) return; const r = panel.getBoundingClientRect(), sc = scroller(panel), bottom = sc === document.scrollingElement ? innerHeight : sc.getBoundingClientRect().bottom; if(r.bottom > bottom) panel.scrollIntoView({block:'nearest', behavior: reduce() ? 'auto' : 'smooth'}); }
function openPanel(panel){
  panel.hidden = false;
  const h = panel.scrollHeight;
  if(reduce()){
    panel.style.cssText = 'height:auto;opacity:0';
    panel.getBoundingClientRect();
    panel.style.transition = 'opacity 200ms var(--ease-out)'; panel.style.opacity = '1';
    reveal(panel);
    return;
  }
  panel.style.cssText = 'height:0px;opacity:0';
  panel.getBoundingClientRect();
  panel.style.transition = 'height 200ms var(--ease-out), opacity 200ms var(--ease-out)';
  panel.style.height = h + 'px'; panel.style.opacity = '1';
  const done = e => { if(e.propertyName !== 'height') return; panel.style.height = 'auto'; panel.removeEventListener('transitionend', done); reveal(panel); };
  panel.addEventListener('transitionend', done);
}
function closePanel(panel, instant){
  if(instant){ panel.style.cssText = ''; panel.hidden = true; return; }
  if(reduce()){
    panel.style.transition = 'opacity 150ms var(--ease-out)'; panel.style.opacity = '0';
    setTimeout(() => { if(panel.style.opacity === '0'){ panel.hidden = true; panel.style.cssText = ''; } }, 150);
    return;
  }
  panel.style.height = panel.scrollHeight + 'px'; panel.getBoundingClientRect();
  panel.style.transition = 'height 150ms var(--ease-out), opacity 150ms var(--ease-out)';
  panel.style.height = '0px'; panel.style.opacity = '0';
  setTimeout(() => { if(panel.style.height === '0px'){ panel.hidden = true; panel.style.cssText = ''; } }, 160);
}
function wire(root){
  let open = null;
  const close = (row, instant) => { row.setAttribute('aria-expanded','false'); closePanel(document.getElementById(row.getAttribute('aria-controls')), instant); };
  root.addEventListener('click', e => {
    const row = e.target.closest('[data-row]'); if(!row || !root.contains(row)) return;
    if(open === row){ close(row); open = null; return; }
    if(open){
      const above = open.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_FOLLOWING;
      if(above){
        // The open panel sits above the tapped row: closing it would pull the row
        // out from under the finger. Close it at once and hold the row still.
        const sc = scroller(row), before = row.getBoundingClientRect().top;
        close(open, true);
        const after = row.getBoundingClientRect().top;
        sc.scrollTop += (after - before);
      } else close(open);
    }
    row.setAttribute('aria-expanded','true'); openPanel(document.getElementById(row.getAttribute('aria-controls'))); open = row;
  });
  root.addEventListener('keydown', e => {
    if(e.key === 'Escape' && open){ const r = open; close(r); open = null; r.focus(); e.stopPropagation(); }
  });
  return { openIndex(i){ const rows = root.querySelectorAll('[data-row]'); if(rows[i]){ rows[i].click(); } } };
}

/* ===================================================================
   The session page
   =================================================================== */
const SESSION_KINDS = {
  corpus:     {label:'Korpus', title:'Classic long run (langtur)', sum:['24 km','2 t 10 min'], arche:'Langtur', target:'sone 1–2', desc:'Glycogen storage, capillarisation, musculoskeletal durability and mental duration. Cap it at 25–30 % of weekly volume — a coaching convention repeated across Daniels, Pfitzinger and Hansons with no controlled trial behind it, so treat the cap as heuristic.', prov:corpus(C.LYDIARD)},
  locator:    {label:'Korpus, URL', title:'Floating threshold (flytende terskel)', sum:['12 km','60 min'], arche:'Under terskel', target:'sone 3', desc:null, prov:corpus(C.BAKKEN)},
  convention: {label:'Konvensjon', title:'Long mountain run (fjelltur)', sum:['2 t'], arche:'Langtur', target:'sone 1–2', desc:'Widely-used coaching convention: the research names no controlled trial or published protocol for this session, so it carries no citation. The session is standard practice, not an evidenced one. Time on feet over terrain; walk the steep parts.', prov:CONV},
  hand:       {label:'Håndskrevet', title:'Shakeout (utrulling)', sum:['20 min'], arche:'Rolig', target:'sone 1', desc:'Written by trainm8, not transcribed from a published source. … The day before, or the morning of: twenty easy minutes and four strides, to move without accumulating anything.', prov:HAND},
  community:  {label:'Fellesskap', title:'Bakkeintervaller 8 × 45 s', sum:['9 km','55 min'], arche:'VO₂maks (korte drag)', target:'sone 5', desc:'Varm opp 20 min, 8 × 45 s hardt i motbakke, jogg ned. Kjør rolig hjem.', prov:{kind:'community',attribution:{displayName:'Kari Nordmann',publishedAt:'3. mars 2026'}}},
  unnamed:    {label:'Fellesskap, uten navn', title:'Bakkeintervaller 8 × 45 s', sum:['9 km','55 min'], arche:'VO₂maks (korte drag)', target:'sone 5', desc:null, prov:{kind:'community',attribution:null}},
  takendown:  {label:'Fellesskap, fjernet', title:'Bakkeintervaller 8 × 45 s', sum:['9 km','55 min'], arche:'VO₂maks (korte drag)', target:'sone 5', desc:null, prov:{kind:'community',attribution:{displayName:'Kari Nordmann',publishedAt:'3. mars 2026'},takenDown:true}},
  adopted:    {label:'Endret av deg', title:'Classic long run (langtur)', sum:['21 km','1 t 55 min'], arche:'Langtur', target:'sone 1–2', desc:'Glycogen storage, capillarisation, musculoskeletal durability and mental duration.', prov:corpus(C.LYDIARD), adopted:true},
  retired:    {label:'Utgått rad', title:'Cruise intervals (terskeldrag)', sum:['14 km','70 min'], arche:'Terskel', target:'sone 3', desc:null, prov:corpus(C.DANIELS), note:'The Catalogue row is retired (retiredAt set): it still reads its Citation.'},
  none:       {label:'Ingen kilde', title:'Rolig tur', sum:['8 km','45 min'], arche:'Rolig', target:'sone 2', desc:null, prov:null, note:'Written by the athlete, copied from a Workout outside the Catalogue, or the source Workout is gone: no line, no placeholder.'},
};
const SESSION_WORST = {
  corpus:   {label:'Lengste sitat + URL, endret', title:'Long run with marathon finish (langtur med marsjfart)', sum:['32 km','2 t 45 min'], arche:'Konkurransesimulering', target:'sone 2–4', desc:null, prov:{kind:'corpus',citation:Object.assign({}, C.DENADAI_2017, {locator:'https://runningwritings.com/2023/12/percentage-based-training.html'})}, adopted:true},
  community:{label:'Langt navn, fjernet', title:'Terskel på tredemølla – 5 × 6 min m/ 1 min pause (husk å drikke!) 🏃‍♀️', sum:['14 km','1 t 10 min'], arche:'Under terskel', target:'sone 3', desc:null, prov:{kind:'community',attribution:{displayName:'Aleksandra Wiśniewska-Kowalczyk',publishedAt:'28. februar 2026'},takenDown:true}},
  unnamed:  {label:'Uten navn, endret', title:'Jo', sum:['5 km'], arche:'Rolig', target:'sone 1', desc:null, prov:{kind:'community',attribution:null}, adopted:true},
};
function sessionHtml(k){
  const s = k;
  const slot = s.prov ? slotHtml(s.prov, {adopted:s.adopted}) : '';
  const prose = (s.desc || slot) ? `<div class="cpad" style="display:flex;flex-direction:column;gap:8px">${s.desc ? `<p class="t-footnote mute" style="margin:0">${esc(s.desc)}</p>` : ''}${slot}</div>` : '';
  return `<div class="app"><main class="page">
    <div class="phead"><span class="back mute">${BACK}</span><h1 class="t-heading">${L.pageTitle}</h1></div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="actions"><span class="btn outline">${L.markMissed}</span><span class="btn ghost" style="margin-left:auto">${L.more}</span></div>
      <article class="card">
        <div class="cpad" style="display:grid;gap:8px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><h2 class="t-title wrap" style="margin:0;min-width:0">${esc(s.title)}</h2><span class="badge" style="margin-top:4px">${L.planned}</span></div>
          <p class="num" style="margin:0"><span class="lead">${s.sum[0]}</span>${s.sum.slice(1).map(x => ` <span class="t-callout mute">· ${x}</span>`).join('')}</p>
          <p class="meta t-footnote mute" style="margin:0"><span class="fg" style="font-weight:500">Løping</span><span class="dot"></span><span class="fg" style="font-weight:500">${esc(s.arche)}</span><span class="dot"></span><span class="num">lør. 22. mai, 09:00</span><span class="dot"></span><span class="num">${L.target(s.target)}</span></p>
        </div>
        <div class="cpad" style="display:grid;gap:10px">
          <p class="t-callout" style="margin:0;font-weight:400">${esc(s.sum.join(' · '))} rolig, jevnt, i ${esc(s.target)}.</p>
          <div class="strip" aria-hidden="true">${Array.from({length:24},(_,i) => `<span style="flex:1;height:${10 + ((i*7)%9)}px"></span>`).join('')}</div>
        </div>
        ${prose}
      </article>
    </div>
  </main></div>`;
}

/* ===================================================================
   Solo mode: one surface, full page, for screenshots and for driving
   ?solo=preview|today|session  &data=worst  &open=<row index>  &kind=<key>  &theme=dark
   =================================================================== */
function boot(){
const Q = new URLSearchParams(location.search);
const root = document.getElementById('root');
if(Q.get('theme') === 'dark') document.documentElement.classList.add('dark');
if(Q.get('solo')){
  document.body.className = 'solo';
  const worst = Q.get('data') === 'worst';
  const solo = Q.get('solo');
  if(solo === 'session'){
    const table = worst ? SESSION_WORST : SESSION_KINDS;
    root.innerHTML = sessionHtml(table[Q.get('kind') || 'corpus'] || SESSION_KINDS.corpus);
  } else {
    root.innerHTML = previewHtml(worst ? WORST : DEMO, solo === 'today' ? 'today' : 'new');
    const w = wire(root);
    if(Q.get('open') != null){ const i = +Q.get('open'); const rows = root.querySelectorAll('[data-row]'); if(rows[i]){ rows[i].setAttribute('aria-expanded','true'); const p = document.getElementById(rows[i].getAttribute('aria-controls')); p.hidden = false; } }
  }
} else {
  root.innerHTML = document.getElementById('canvas-tpl').innerHTML;
  buildCanvas();
}

}
document.addEventListener('DOMContentLoaded', boot);
function frame(html, label, cls){ return `<div class="frame"><p class="lbl">${label}</p><div class="phone ${cls || ''}">${html}</div></div>`; }
function buildCanvas(){
  // The canvas opens panels itself on load; those must not scroll the canvas.
  document.body.dataset.quiet = '1'; setTimeout(() => { delete document.body.dataset.quiet; }, 1500);
  // Overview picture: today against the chosen row, both at 390 px.
  const pic = document.getElementById('picture');
  pic.innerHTML = frame(previewHtml(DEMO,'today'),'I dag: kildelinjen på hver rad') + frame(previewHtml(DEMO,'new'),'Quiet row: raden bærer planen, kilden ett trykk unna');
  const [a,b] = pic.querySelectorAll('.phone');
  wire(b); b.querySelectorAll('[data-row]')[1].click();
  requestAnimationFrame(() => setTimeout(() => {
    const ha = a.querySelector('.weeks').offsetHeight, hb = b.querySelector('.weeks').offsetHeight;
    b.querySelectorAll('[data-row]')[1].click();
    setTimeout(() => {
      const hc = b.querySelector('.weeks').offsetHeight;
      document.getElementById('measure').textContent = `Measured here, four weeks at 390 px: today ${ha} px; Quiet row ${hc} px closed (${Math.round(100 - hc/ha*100)} % shorter), ${hb} px with one panel open.`;
      b.querySelectorAll('[data-row]')[1].click();
    }, 400);
  }, 300));

  // Variant board: the preview, live, and the session page per kind.
  const vb = document.getElementById('variant');
  vb.innerHTML = frame(previewHtml(DEMO,'new'),'Generate preview: tap a row, tap it again, Esc, or tap another') + `<div class="frame"><p class="lbl">Session page: <span id="kind-lbl"></span></p><div class="phone" id="sess"></div><p class="cap" id="kind-note"></p></div>`;
  wire(vb.querySelector('.phone'));
  const kinds = document.getElementById('kinds');
  const show = key => { document.getElementById('sess').innerHTML = sessionHtml(SESSION_KINDS[key]); document.getElementById('kind-lbl').textContent = SESSION_KINDS[key].label; document.getElementById('kind-note').textContent = SESSION_KINDS[key].note || ''; kinds.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === key))); };
  kinds.innerHTML = Object.entries(SESSION_KINDS).map(([k,v]) => `<button type="button" data-k="${k}" aria-pressed="false">${v.label}</button>`).join('');
  kinds.addEventListener('click', e => { const t = e.target.closest('button'); if(t) show(t.dataset.k); });
  show('corpus');

  // Worst case board.
  const wc = document.getElementById('worst'), seg = document.getElementById('worst-seg');
  const render = mode => {
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === mode)));
    if(mode === 'demo'){
      wc.innerHTML = frame(previewHtml(DEMO,'new'),'Preview, demo') + frame(sessionHtml(SESSION_KINDS.corpus),'Session page, demo');
    } else {
      wc.innerHTML = frame(previewHtml(WORST,'new'),'Preview, worst case (first row open)') + frame(sessionHtml(SESSION_WORST.corpus),'Session page: longest work + URL, changed by you') + frame(sessionHtml(SESSION_WORST.community),'Session page: long name, taken down') + frame(sessionHtml(SESSION_WORST.unnamed),'Session page: no name, one-letter title, changed');
      const p = wc.querySelector('.phone'); wire(p); p.querySelector('[data-row]').click();
    }
  };
  seg.addEventListener('click', e => { const t = e.target.closest('button'); if(t) render(t.dataset.m); });
  render('worst');

  document.getElementById('theme').addEventListener('click', e => {
    const t = e.target.closest('button'); if(!t) return;
    document.querySelectorAll('.phone').forEach(p => p.classList.toggle('dark', t.dataset.t === 'dark'));
    e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === t)));
  });
}
</script>

    <h2 style="margin-top:24px">Decisions</h2>

      <li><b>Which row does the session page read the source from?</b> The Workout the machine placed: the session's own Workout, or, if the session was adopted, the Workout it was forked from. Read one hop from there. A swap that copies a Catalogue row is read directly.</li>
      <li><b>Where does the source line sit on the session page?</b> Last in the card's prose block, after the numbers, the sentence and the description, as one quiet footnote. Not in the header beside the figures.</li>
      <li><b>How does a changed session say so?</b> <i>Endret av deg</i> leads the same line: <i>Endret av deg · Kilde: …</i>. The sentence after it stays the Catalogue's.</li>
      <li><b>Does a community session that was taken down say so?</b> Yes. <i>· Fjernet av en moderator</i> goes on its line, beside the byline and the non-vouch.</li>
      <li><b>Does hovering a row open its panel on desktop?</b> No. Hover tints the row and a click opens the panel, because a hover panel would push the list around under the pointer.</li>

    <details>
      <summary>Appendix: critique, method, rejected directions</summary>
      <div id="appendix">
<h3>Critique (critic pass)</h3>
<p><b>Recommendation: Quiet row.</b> It holds all ten criteria, with two conditions: criterion 6 needs decision 1, and criterion 10 needs the two e2e cases. It fits the parts the preview already uses (<code>Collapsible</code>, <code>motion-collapse</code>, the shape row's chevron). The build must also carry the three fixes listed under the worst case.</p>
<table class="cmp findings"><tr><th>Criterion</th><th>Verdict</th><th>What was seen</th></tr><tr><td>1 Row is one control, no source line</td><td><b>holds</b></td><td>Day, sport, kind, zone and title. The smallest row measured 55 px. It is a <code>button</code> named <i>Tirsdag Løping Rolig Easy run with strides …</i>, and its only extra mark is a 1.25-stroke chevron.</td></tr><tr><td>2 Tap / Enter / Space opens the panel below</td><td><b>holds</b></td><td>Probed: a tap opens it, a second tap closes it, Escape closes it and puts focus back on the row, and another row moves it. One panel is open at most. Bakken's panel shows the sentence and the URL locator, and a convention row shows its own slot line.</td></tr><tr><td>3 Nothing that warns moves behind a tap</td><td><b>holds</b></td><td>The empty slot stays a row with no chevron. Absences and the capacity line stay above the season, with ≈ still in it, and each week keeps its numbers. The zone stays on the row.</td></tr><tr><td>4 Session page line after the numbers</td><td><b>holds</b></td><td>One quiet footnote at the end of the card for all four kinds. A community row shows its byline, then the non-vouch.</td></tr><tr><td>5 Slots stay apart; taken-down</td><td><b>holds</b></td><td>The slot switches on the kind, so a community row cannot show Citation fields and a corpus row cannot show a byline or the non-vouch. A taken-down row keeps its byline and non-vouch and adds <i>Fjernet av en moderator</i>.</td></tr><tr><td>6 Adopted keeps its source</td><td><b>holds, with decision 1</b></td><td><i>Endret av deg · Kilde: …</i>. Only true if the build reads through the adoption fork. One hop from the session's own Workout lands on the placed copy, which has no Catalogue entry, and would show nothing (probe below).</td></tr><tr><td>7 Retired row keeps its Citation</td><td><b>holds</b></td><td>The read does not filter on <code>retiredAt</code>, as <code>resolveCatalogueOrigin</code> already does.</td></tr><tr><td>8 No source, no line</td><td><b>holds</b></td><td>No slot and no placeholder.</td></tr><tr><td>9 Same Norwegian sentence on three surfaces</td><td><b>holds</b></td><td><code>nbProvenanceSentence</code> and <code>NB_PROVENANCE_LABELS</code> on all three. The locator follows the sentence and does not replace it.</td></tr><tr><td>10 No overflow at 390, inside the e2e guard</td><td><b>holds in the prototype</b></td><td>Overflow was 0 px at 390 and at 320 with the longest work, a URL locator and a row open. The build adds both cases to <code>tests/e2e/mobile-overflow.test.ts</code>.</td></tr></table>
<h3>Craft</h3>
<ul>
<li>Press is an instant <code>:active</code> tint and hover sits behind <code>(hover: hover) and (pointer: fine)</code>. Focus shows a <code>ring</code>, and nothing scales.</li>
<li>When a panel above the tapped row closes, the tapped row stays where the finger is (probed: it moved 0 px). Without this, a panel closing above would drag the row up by its own height.</li>
<li>A panel opened at the fold now scrolls just far enough into view. Before the fix, the panel opened unseen and only the chevron moved.</li>
<li>The panel is a tinted well inside the white card, separated by tone, as luma separates surfaces. The source never competes with the title.</li>
<li>The weak point is discoverability: the chevron and the intro sentence are the only hints. That is the price of the rule #437 chose, and it is acceptable because nothing a source says changes what the athlete runs.</li>
</ul>
<h3>Fit</h3>
<p>One slot component for the Catalogue, the preview panel and the session page means a wording or kind change is made in one place. The row is now a button, which matters for #457: per-session controls belong in the panel or in a trailing action, and the panel has to stay free of warnings (#429).</p>
<h3>Designer's pick</h3>
<p>Sealed before scoring (<code>designer-pick.sealed.txt</code>): Quiet row. It matches the recommendation, so there is no disagreement.</p>
<h3>Settled by probe</h3>
<ul>
<li>Where the source of an adopted session lives. Read in <code>workout.server.ts</code> (fork-on-write) and <code>juster.server.ts</code> (<code>swapSession</code>). An adopting edit forks a new Workout whose <code>copiedFromId</code> is the machine's placed copy, and that copy's <code>copiedFromId</code> is the Catalogue row: two hops. A Catalogue swap points straight at the row: one hop.</li>
<li>Row height, measured with Playwright at 390 × 844, four weeks of a real run season: today 1746 px, Quiet row 1303 px closed, so 25 % shorter.</li>
<li>Copies keep the description (<code>copyWorkout</code> copies <code>description</code>). The English notice on a convention copy already shows on the session page, and the Norwegian slot line now follows it.</li>
</ul></div>
      <h3>Method</h3>
      <p>Emil's <span class="mono">prototype-ui</span> skill is not installed here (no <span class="mono">bredvid-design-engineering</span> plugin, no <span class="mono">.claude/skills/prototype-ui</span>), so its standalone branch was built by hand: this one file, in the tokens of <span class="mono">app/styles/tailwind.css</span>, with Public Sans embedded. It follows <span class="mono">emil-design-eng</span>, <span class="mono">apple-design</span>, <span class="mono">mobile-native</span> and <span class="mono">animate</span>. All copy is from <span class="mono">labels.ts</span> except <i>Endret av deg</i> and the new intro sentence, and every Citation is verbatim from <span class="mono">catalogue-corpus.citations.ts</span>. Solo URLs for driving it: <span class="mono">?solo=preview|today|session&amp;data=worst&amp;open=1&amp;kind=adopted&amp;theme=dark</span>.</p>
      <h3>Motion</h3>
      <p>The panel opens a few times per review, and the motion is there so the rows below don't jump. It is the app's <span class="mono">motion-collapse</span>: height and opacity, 200 ms in and 150 ms out, on <span class="mono">--ease-out</span>. The chevron turns 180° in 160 ms, as in the shape row. With reduced motion only the fade stays. Rows press with an instant <span class="mono">:active</span> tint and hover only behind <span class="mono">(hover: hover) and (pointer: fine)</span>. A full-width row is not scaled on press.</p>
      <h3>Rejected directions</h3>

        <li>A bottom drawer (#437's "drawer") for the preview's source. It covers the season the athlete is reading, and ADR 0030 rule 3 asks for a fixed panel below the thing tapped.</li>

      </ul>
    </details>
