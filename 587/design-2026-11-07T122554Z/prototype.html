:root {
  --background: oklch(0.975 0.003 197); --foreground: oklch(0.148 0.004 228.8);
  --card: oklch(1 0 0); --primary: #0d7a68; --primary-foreground: #fff;
  --secondary: oklch(0.955 0.004 197); --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.948 0.004 197); --muted-foreground: oklch(0.52 0.016 213.5);
  --border: oklch(0.915 0.005 214.3); --input: oklch(0.915 0.005 214.3);
  --foreground-destructive: oklch(51.46% 0.1979 16.57);
  --ring: color-mix(in oklab, var(--primary) 55%, transparent);
  --track-run: oklch(0.63 0.16 32); --track-bike: oklch(0.72 0.13 78); --track-swim: oklch(0.62 0.1 225); --track-strength: oklch(0.55 0.11 300);
  --status-under: oklch(0.55 0.13 65);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not(.light) {
  --background: oklch(0.148 0.004 228.8); --foreground: oklch(0.987 0.002 197.1);
  --card: oklch(0.205 0.007 223.9); --primary: #35b89c; --primary-foreground: #0c1512;
  --secondary: oklch(0.275 0.011 216.9); --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.255 0.01 216.9); --muted-foreground: oklch(0.723 0.014 214.4);
  --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%);
  --foreground-destructive: oklch(63.72% 0.2071 21.89);
  --ring: color-mix(in oklab, var(--primary) 60%, transparent);
  --track-run: oklch(0.7 0.14 32); --track-bike: oklch(0.78 0.12 78); --track-swim: oklch(0.72 0.09 225); --track-strength: oklch(0.7 0.1 300);
  --status-under: oklch(0.82 0.12 65);
}}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: 'Public Sans Variable', system-ui, sans-serif; font-size: 16px; line-height: 24px; letter-spacing: -0.004em; -webkit-font-smoothing: antialiased; }
button, a, label, [role=button] { touch-action: manipulation; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4, p, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* Type steps (design-system.md) */
.t-title { font-size: 24px; line-height: 30px; font-weight: 650; letter-spacing: -0.02em; }
.t-heading { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.012em; }
.t-callout { font-size: 15px; line-height: 21px; font-weight: 500; letter-spacing: -0.004em; }
.t-footnote { font-size: 13px; line-height: 18px; font-weight: 400; letter-spacing: 0.002em; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; }
.t-overline { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.muted { color: var(--muted-foreground); }
.num { font-variant-numeric: tabular-nums; }
.wrap-any { overflow-wrap: anywhere; }

/* App chrome */
.topbar { padding-top: env(safe-area-inset-top); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; max-width: 72rem; margin: 0 auto; }
.wordmark { font-weight: 700; letter-spacing: -0.02em; font-size: 17px; }
.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 40; background: color-mix(in oklab, var(--background) 95%, transparent); border-top: 1px solid color-mix(in oklab, var(--border) 60%, transparent); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
.tabs ul { display: grid; grid-template-columns: repeat(3, 1fr); height: 56px; max-width: 28rem; margin: 0 auto; }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 1.1; font-weight: 600; color: var(--muted-foreground); text-decoration: none; height: 100%; user-select: none; -webkit-touch-callout: none; }
.tabs a[aria-current] { color: var(--primary); }
.tabs a:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.tabs svg { width: 24px; height: 24px; }
@media (min-width: 768px) {
  .topbar-inner { padding: 0 32px; height: 64px; }
  .tabs { position: static; background: transparent; border: 0; backdrop-filter: none; padding: 0; }
  .tabs ul { display: flex; gap: 4px; height: auto; max-width: none; }
  .tabs a { flex-direction: row; gap: 6px; height: 44px; padding: 0 14px; border-radius: 999px; font-size: 14px; }
  .tabs a[aria-current] { background: color-mix(in oklab, var(--primary) 10%, transparent); }
  .tabs svg { width: 16px; height: 16px; }
}
.page { max-width: 42rem; margin: 0 auto; padding: 24px 16px calc(56px + 32px + env(safe-area-inset-bottom)); }
@media (min-width: 768px) { .page { padding: 32px 32px 64px; } }
.page-header { display: flex; align-items: center; gap: 4px; min-height: 44px; }
.icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; border: 0; background: transparent; color: var(--foreground); cursor: pointer; margin-left: -6px; }
.icon-btn::after { content: ''; position: absolute; inset: -6px; }
.icon-btn svg { width: 20px; height: 20px; }
.page-header h1 { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
main { margin-top: 24px; display: grid; gap: 32px; }
.section-head { margin-bottom: 8px; color: var(--muted-foreground); }
.stack-2 > * + * { margin-top: 8px; }
.stack-3 > * + * { margin-top: 12px; }
.stack-4 > * + * { margin-top: 16px; }

/* Controls */
.pressable { transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out); }
.pressable:active { transform: scale(0.97); }
@media (prefers-reduced-motion: reduce) { .pressable:active { transform: none; } }
:focus-visible { outline: none; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 16px; border: 1px solid transparent; font-size: 15px; line-height: 21px; font-weight: 500; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; white-space: nowrap; text-decoration: none; }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .linkrow:focus-visible, .chip:focus-visible, .choice:focus-within, .icon-btn:focus-visible, .ghost-btn:focus-visible { box-shadow: 0 0 0 3px var(--ring); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-outline { background: var(--card); border-color: var(--border); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 0.04); }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: color-mix(in oklab, var(--primary) 88%, black); }
  .btn-outline:hover, .chip:not([aria-pressed=true]):hover { background: var(--muted); }
  .linkrow:hover { text-decoration: underline; }
}
.btn[disabled] { opacity: .6; cursor: default; }
.btn-block { width: 100%; }
@media (min-width: 640px) { .btn-block { width: auto; } }
.spin { width: 16px; height: 16px; animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 1.6s; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; max-width: 100%; padding: 0 16px; border-radius: 999px; border: 1px solid var(--input); background: transparent; cursor: pointer; font-size: 15px; line-height: 21px; font-weight: 500; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.chip[aria-pressed=true]:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary); }
.chip[aria-pressed=true] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.chip .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
.chip[aria-pressed=true] .dot { box-shadow: 0 0 0 2px var(--primary-foreground); }
.chip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark-run { background: var(--track-run); } .mark-bike { background: var(--track-bike); } .mark-swim { background: var(--track-swim); } .mark-strength { background: var(--track-strength); } .mark-other { background: var(--muted-foreground); }
.ghost-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; max-width: 100%; padding: 0 12px; margin: 0 -12px; border-radius: 16px; border: 0; background: transparent; cursor: pointer; font-size: 13px; line-height: 18px; text-align: left; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--muted); }
.seg button { flex: 1; height: 44px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.seg button[aria-checked=true] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 1px 3px rgb(0 0 0 / .06); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.linkrow { display: flex; align-items: center; min-height: 44px; color: var(--primary); text-decoration: none; underline-offset: 4px; }
.result { display: flex; gap: 8px; align-items: flex-start; }
.result svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; color: var(--primary); }
.alert { padding: 12px 14px; border-radius: 13px; background: color-mix(in oklab, var(--status-under) 12%, var(--card)); }

/* Preview surface */
.surface { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 0 0 1px color-mix(in oklab, var(--foreground) 5%, transparent); outline: none; scroll-margin-top: 16px; }

.blocks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.blocks li { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.well { position: relative; display: block; height: 64px; overflow: hidden; border-radius: 11px; background: color-mix(in oklab, var(--muted) 60%, transparent); }

.facts { display: flex; flex-wrap: wrap; column-gap: 12px; }
.days { border-top: 0; }

.sess .name { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.sess .name .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; align-self: center; transform: translateY(-1px); }
.sess .title { min-width: 0; overflow-wrap: anywhere; }
.lifts { display: block; padding-left: 14px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 13px; font-size: 12px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: var(--secondary); color: var(--secondary-foreground); box-shadow: inset 0 0 0 1px var(--border); }
.changes > li { padding: 12px 0; }
.changes > li + li { border-top: 1px solid color-mix(in oklab, var(--border) 70%, transparent); }
.hr { height: 1px; background: color-mix(in oklab, var(--border) 70%, transparent); border: 0; margin: 0; }

/* The level/preferences form below, as it stands today (#584) */
.choice { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--border); cursor: pointer; }
.choice + .choice { margin-top: 8px; }
.choice .radio { width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid var(--input); flex-shrink: 0; margin-top: 2px; }
.choice[data-on] { box-shadow: 0 0 0 1.5px var(--primary); }
.choice[data-on] .radio { border: 5px solid var(--primary); }

@media (min-width: 768px) { .harness { bottom: 24px; } }
.harness .track { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: #e5e5e5; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.harness .track button { border: 0; background: transparent; padding: 0 10px; height: 26px; border-radius: 999px; white-space: nowrap; color: #333; cursor: pointer; font: inherit; }

.harness label { background: #e5e5e5; color: #333; border-radius: 999px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: center; }

const params = new URLSearchParams(window.__q ?? location.search)
if (params.get('chrome') === '0') document.documentElement.classList.add('no-chrome')
if (params.get('theme') === 'dark') document.documentElement.classList.add('dark-force')

let S
function reset(key) {
  const d = DATASETS[key]
  S = {
    key, d,
    current: structuredClone(d.current),
    sports: [...d.current.sports],
    activities: [...d.current.activities],
    strength: d.current.strength,
    kept: structuredClone(d.kept || []),
    asked: null,       // the choices the preview was computed for
    preview: null,
    note: null,        // 'same' | 'none'
    pending: null,     // 'preview' | 'confirm'
    stale: false,
    done: null,
    level: d.level ?? 'recreational',
  }
}

const sig = (c) => JSON.stringify([c.sports, [...c.activities].sort(), c.strength])
const sameSet = (a, b) => JSON.stringify([[...a.sports].sort(), [...a.activities].sort(), a.strength]) === JSON.stringify([[...b.sports].sort(), [...b.activities].sort(), b.strength])
const choices = () => ({ sports: [...S.sports], activities: [...S.activities], strength: S.strength })

/* ---------- The preview: the start's engine for the plan's own family, laid around kept sessions ---------- */
function computePreview(c) {
  const d = S.d
  const main = c.sports[0] ?? null
  const draft = E.draftStart({
    level: d.level, hours: d.hours, days: d.days, startWeekKey: d.boundaryKey, preferences: d.preferences,
    discipline: main, otherSports: c.sports.slice(1), activities: c.activities,
    strength: c.strength ? { perWeek: c.strength, session: d.lifting } : null,
  })
  if (!draft) return null
  const option = (d.plan.family && draft.options.find((o) => o.family === d.plan.family)) || draft.options[0]
  const week = structuredClone(option.week)
  // The kept sessions of the boundary week sit on their days, marked as the
  // athlete's; a kept lift fills a lifting slot, so one laid lift goes.
  const keptIn = S.kept.filter((k) => k.inBoundary)
  for (const k of keptIn) {
    const day = week.days[k.weekday]
    if (k.discipline === 'strength') {
      const laid = week.days.filter((dd) => dd.lifting.length && dd.weekday !== k.weekday).at(-1)
      if (laid) { laid.lifting = []; week.strengthSessions -= 1 }
      day.lifting.push({ title: k.title, lifts: k.lifts, kept: true })
      week.strengthSessions += 1
    } else {
      day.sessions.push({ title: k.title, discipline: k.discipline, minutes: k.minutes, effort: k.effort, kept: true })
      week.sessionCount += 1; week.minutes += k.minutes; week.minutesByEffort[k.effort] += k.minutes
      if (k.effort === 'hard') week.hardSessions += 1
    }
  }
  const removedSports = S.current.sports.filter((s) => !c.sports.includes(s))
  const removedOther = S.current.activities.length > 0 && c.activities.length === 0
  const keptOnRemoved = S.kept.filter((k) => removedSports.includes(k.discipline) || (k.discipline === 'other' && removedOther) || (k.discipline === 'strength' && !c.strength))
  const removedNames = [...new Set(keptOnRemoved.map((k) => k.discipline === 'other' ? L.sa.track.toLowerCase() : sportName(k.discipline).toLowerCase()))]
  const strengthNotes = []
  if (c.strength) {
    strengthNotes.push(L.start.strengthChoice(c.strength))
    if (option.week.strengthSessions < c.strength) strengthNotes.push(L.start.strengthFewer(option.week.strengthSessions, c.strength))
    if (draft.strengthCapped != null) strengthNotes.push(L.start.strengthTakesDays(E.levelDefaults(d.level).sessionCap, draft.strengthCapped))
  }
  const notes = [...strengthNotes]
  if (draft.sportsLeftOut.length) notes.push(L.start.sportsLeftOut(option.draft.patternDays.length, draft.sportsLeftOut.map((s) => sportName(s).toLowerCase())))
  if (option.shortOfHours != null) notes.push((option.shortByPreference ? E.SESSION_PREFERENCE_LABELS.shortOfHours : L.start.shortOfHours)(dur(option.shortOfHours), E.nbHoursWords(d.hours)))
  if (option.notFitted) notes.push(L.sa.notFitted(option.notFitted.kinds, option.notFitted.room))
  return {
    family: option.family, week, notes,
    familyLine: d.plan.family ? W.family(E.PHILOSOPHY_LABELS[d.plan.family]) : W.familyNone(L.start.plain[option.family].name, E.PHILOSOPHY_LABELS[option.family]),
    keptCount: S.kept.length, keptOnRemoved: keptOnRemoved.length, removedNames,
    pinned: d.pinned, overrides: d.overrides,
  }
}

/* ---------- Render ---------- */
function weekBlocks(week) {
  const longest = Math.max(1, ...week.days.flatMap((d) => d.sessions.map((s) => s.minutes)))
  return `<ol class="blocks" aria-hidden="true">${week.days.map((day) => {
    const lifts = day.lifting.map((l) => ({ h: 18.75, cls: 'mark-strength', kept: l.kept }))
    const raw = day.sessions.map((s) => Math.max(14, (s.minutes / longest) * 100))
    const count = lifts.length + raw.length
    const room = 100 - lifts.length * 18.75 - Math.max(0, count - 1) * 3.125
    const sum = raw.reduce((a, b) => a + b, 0)
    const scale = sum > room && sum > 0 ? Math.max(0, room) / sum : 1
    const sess = day.sessions.map((s, i) => ({ h: raw[i] * scale, cls: `${MARK[s.discipline] ?? 'mark-other'} e-${s.effort}`, kept: s.kept }))
    const stack = [...lifts, ...sess]
    let bottom = 100
    const placed = stack.slice().reverse().map((b) => { const top = bottom - b.h; bottom = top - 3.125; return { ...b, top } })
    return `<li><span class="well">${placed.map((b) => `<span class="blk ${b.cls}${b.kept ? ' kept' : ''}" style="top:${b.top.toFixed(2)}%;height:${b.h.toFixed(2)}%"></span>`).join('')}</span><span class="d t-caption muted">${E.FIRST_RUN_LABELS.dayShort[day.weekday]}</span></li>`
  }).join('')}</ol>`
}

function weekView(week) {
  const pct = (p) => week.minutes === 0 ? 0 : Math.round((p / week.minutes) * 100)
  const m = week.minutesByEffort
  const fills = { rolig: 'color-mix(in oklab, var(--primary) 30%, transparent)', middels: 'color-mix(in oklab, var(--primary) 65%, transparent)', hard: 'var(--primary)' }
  const yours = `<span class="badge">${W.yours}</span><span class="sr-only">(${W.yoursSr})</span>`
  return `${weekBlocks(week)}
  <div class="stack-2">
    <div class="bar" role="img" aria-label="${esc(L.start.effortBar(pct(m.rolig), pct(m.middels), pct(m.hard)))}">${['rolig', 'middels', 'hard'].filter((e) => m[e] > 0).map((e) => `<span style="flex-grow:${m[e]};background:${fills[e]}"></span>`).join('')}</div>
    <p class="t-footnote muted facts num"><span style="color:var(--foreground);font-weight:600">${esc(L.start.total(dur(week.minutes)))}</span><span>${esc(L.start.sessions(week.sessionCount))}</span><span>${esc(L.start.hardSessions(week.hardSessions))}</span>${week.strengthSessions > 0 ? `<span>${esc(L.start.plusStrength(week.strengthSessions))}</span>` : ''}</p>
  </div>
  <ol class="days">${week.days.map((day) => `<li class="t-footnote"><span aria-hidden="true" class="t-caption muted">${E.FIRST_RUN_LABELS.dayShort[day.weekday]}</span><span class="sr-only">${E.NB_WEEKDAY_LABELS[day.weekday]}: </span>${
    day.sessions.length === 0 && day.lifting.length === 0 ? `<span class="muted">${L.start.free}</span>` :
    `<span>${day.sessions.map((s) => `<span class="sess"><span class="name"><span class="dot ${MARK[s.discipline] ?? 'mark-other'}" aria-hidden="true"></span><span class="title">${esc(s.title)}</span>${s.kept ? yours : ''}</span><span class="muted num">${esc(L.start.sessionFacts(dur(s.minutes), L.start.effort[s.effort]))}</span></span>`).join('')}${day.lifting.map((l) => `<span class="sess" style="display:block"><span class="name"><span class="dot mark-strength" aria-hidden="true"></span><span class="title">${esc(l.title)}</span>${l.kept ? yours : ''}</span>${l.lifts?.length ? `<span class="lifts muted">${esc(l.lifts.join(' · '))}</span>` : ''}</span>`).join('')}</span>`
  }</li>`).join('')}</ol>`
}

function trackName(t) { return t === 'other' ? L.sa.track : sportName(t) }
function dayList(days) { return join(days.map((d) => E.NB_WEEKDAY_LABELS[d])) }

function previewSection(p) {
  const d = S.d
  const day = E.nbLongDay(d.boundaryKey)
  const items = []
  if (p.keptCount > 0) items.push(`<li><h4 class="t-callout">${W.keptTitle}</h4><p class="t-footnote muted">${esc(W.kept(p.keptCount, E.nbLongDay(d.boundaryKey).replace(/^\S+ /, '')))}${p.keptOnRemoved ? ' ' + esc(W.keptRemoved(p.keptOnRemoved, p.keptCount, join(p.removedNames))) : ''}</p></li>`)
  if (p.pinned.length) items.push(`<li><h4 class="t-callout">${W.pinnedTitle}</h4><ul class="t-footnote muted">${p.pinned.map((x) => `<li>${esc(trackName(x.track))}: ${esc(dayList(x.days))}</li>`).join('')}</ul></li>`)
  if (p.overrides.length) items.push(`<li><h4 class="t-callout">${W.overridesTitle}</h4><ul class="t-footnote muted num">${p.overrides.map((x) => `<li>${esc(trackName(x.track))}: ${join(x.weeks.map(([n, m]) => `<span style="white-space:nowrap">${esc(W.week(n, m))}</span>`))}</li>`).join('')}</ul></li>`)
  return `<section class="surface stack-4" id="preview" tabindex="-1" aria-labelledby="preview-title" data-preview>
    ${S.stale ? `<p class="alert t-footnote" role="alert">${W.stale}</p>` : ''}
    <div class="stack-2">
      <p class="t-overline muted">${W.overline} · uke ${d.boundaryWeek}</p>
      <h3 id="preview-title" class="t-heading">${esc(W.title(day))}</h3>
      <p class="t-footnote">${d.boundaryThisWeek ? W.boundaryThis : W.boundaryNext} ${esc(p.familyLine)}</p>
    </div>
    ${weekView(p.week)}
    ${p.notes.map((n) => `<p class="t-footnote muted">${esc(n)}</p>`).join('')}
    ${p.week.days.some((dd) => dd.sessions.some((s) => s.kept) || dd.lifting.some((l) => l.kept)) ? `<p class="t-footnote muted">${W.yoursNote}</p>` : ''}
    ${items.length ? `<div><hr class="hr"><h3 class="t-overline muted" style="margin-top:16px">${W.alsoTitle}</h3><ul class="changes">${items.join('')}</ul></div>` : ''}
    <div class="stack-2">
      <button type="button" class="btn btn-primary btn-block pressable" data-act="confirm" data-focus="confirm" ${S.pending ? 'disabled' : ''}>${S.pending === 'confirm' ? ICON.loader : ''}${W.confirm}</button>
      <p class="t-footnote muted">${W.confirmNote}</p>
    </div>
  </section>`
}

function editor() {
  const d = S.d
  const chipList = [
    ...SPORTS.map((s) => ({ v: s, label: sportName(s), mark: MARK[s], on: S.sports.includes(s) })),
    ...KINDS.map((k) => ({ v: k, label: kindName(k), mark: 'mark-other', on: S.activities.includes(k) })),
    ...(d.lifting ? [{ v: 'strength', label: L.simple.strength.chip, mark: 'mark-strength', on: S.strength != null }] : []),
  ]
  const main = S.sports[0]
  const mainLine = main && S.sports.length > 1
    ? `<button type="button" class="ghost-btn pressable" data-act="main" data-focus="main" aria-label="${esc(L.simple.activities.switchMainSport(sportName(main), sportName(S.sports[1])))}"><span class="muted" style="min-width:0">${L.simple.activities.mainSportLead} <strong style="color:var(--foreground);font-weight:600">${sportName(main)}</strong></span><span style="color:var(--primary)">${L.simple.activities.switchHint}</span></button>`
    : main ? `<p class="t-footnote muted" style="min-height:44px;display:flex;align-items:center">${L.simple.activities.mainSportLead}&nbsp;<strong style="color:var(--foreground);font-weight:600">${sportName(main)}</strong></p>` : ''
  const strength = S.strength != null ? `<fieldset class="stack-2"><legend class="t-callout" style="margin-bottom:8px">${L.simple.strength.legend}</legend>
      <div class="seg" role="radiogroup" aria-label="${L.simple.strength.legend}">${[1, 2, 3].map((n) => `<button type="button" role="radio" aria-checked="${S.strength === n}" aria-label="${esc(L.simple.strength.choiceLabel(n))}" class="pressable" data-act="freq" data-n="${n}" data-focus="freq-${n}" tabindex="${S.strength === n ? 0 : -1}">${n}</button>`).join('')}</div>
      <p class="t-footnote muted">${S.current.strength ? esc(W.strengthAnswer(S.current.strength)) + ' ' : ''}${L.simple.strength.notInHours}</p></fieldset>` : ''
  const changedSince = S.asked && !S.preview && S.note === 'changed'
  const noteText = S.note === 'same' ? W.same : S.note === 'none' ? W.none : S.note === 'changed' ? W.changedSince : ''
  const daysWords = join(d.days.map((x) => E.NB_WEEKDAY_LABELS[x]))
  return `<section aria-labelledby="meg-activities" class="stack-4" data-meg-activities>
    <div><h2 id="meg-activities" class="t-overline section-head">${W.heading}</h2><p class="t-footnote muted">${W.note}</p></div>
    <fieldset class="stack-2"><legend class="sr-only">${L.simple.activities.list}</legend>
      <div class="chips" role="group" aria-label="${L.simple.activities.list}">${chipList.map((c) => `<button type="button" class="chip pressable" aria-pressed="${c.on}" data-act="chip" data-v="${c.v}" data-focus="chip-${c.v}"><span class="dot ${c.mark}" aria-hidden="true"></span><span class="lbl">${esc(c.label)}</span></button>`).join('')}</div>
      <div aria-live="polite">${mainLine}</div>
    </fieldset>
    ${strength}
    <p class="t-footnote muted num">${esc(W.stands(E.nbHoursWords(d.hours), daysWords))}</p>
    <div class="stack-2">
      <button type="button" class="btn btn-outline btn-block pressable" data-act="preview" data-focus="preview" ${S.pending ? 'disabled' : ''}>${S.pending === 'preview' ? ICON.loader : ''}${W.show}</button>
      <p class="t-footnote muted" role="status" data-editor-note>${noteText}</p>
    </div>
    ${S.preview ? previewSection(S.preview) : ''}
    ${S.done ? `<div class="result t-footnote" role="status">${ICON.check}<span>${esc(S.done)} <a class="linkrow" style="display:inline;min-height:0" href="#plan">${W.doneLink}</a></span></div>` : ''}
  </section>`
}

function readOnly() {
  const d = S.d
  const names = [...d.current.sports.map(sportName), ...d.current.activities.map(kindName), ...(d.current.strength ? [L.simple.strength.chip] : [])]
  if (d.plan.kind === 'none') return `<section aria-labelledby="meg-activities"><h2 id="meg-activities" class="t-overline section-head">${W.heading}</h2><p class="t-callout">${L.meg.activitiesNone}</p></section>`
  const why = d.plan.kind === 'event' ? W.readOnly.event(d.plan.event) : W.readOnly[d.plan.kind]
  return `<section aria-labelledby="meg-activities" class="stack-2"><h2 id="meg-activities" class="t-overline section-head">${W.heading}</h2>
    <p class="t-callout wrap-any">${esc(names.join(', '))}</p>
    <p class="t-footnote muted wrap-any">${esc(why)}</p>
    <a class="linkrow t-callout" href="#plan">${L.meg.activitiesLink}</a></section>`
}

function answers() {
  const lv = E.SIMPLE_START_LABELS.levels
  return `<section aria-labelledby="answers-h" class="stack-4"><div><h2 id="answers-h" class="t-overline section-head">${L.meg.level} og økter du liker</h2><p class="t-footnote muted">${W.answersIntro}</p></div>
    <fieldset><legend class="t-heading" style="margin-bottom:12px">${L.meg.level}</legend>${['beginner', 'recreational', 'experienced', 'competitive'].map((k) => `<label class="choice" ${k === S.level ? 'data-on' : ''}><span class="radio" aria-hidden="true"></span><input type="radio" name="level" class="sr-only" ${k === S.level ? 'checked' : ''}><span><span class="t-callout" style="display:block">${lv[k].name}</span><span class="t-footnote muted">${lv[k].description}</span></span></label>`).join('')}</fieldset>
    <button type="button" class="btn btn-primary btn-block pressable">${L.meg.save}</button></section>`
}

function render() {
  const focusKey = document.activeElement?.dataset?.focus
  const editable = S.d.plan.kind === 'editable'
  document.getElementById('stage').innerHTML = `<div class="page">
    <div class="page-header"><a class="icon-btn pressable" href="#meg" aria-label="${E.APP_TAB_LABELS.me}">${ICON.back}</a><h1>${L.meg.title}</h1></div>
    <main>${editable ? editor() : readOnly()}<hr class="hr">${answers()}</main></div>`
  if (focusKey) document.querySelector(`[data-focus="${focusKey}"]`)?.focus({ preventScroll: true })
}

/* ---------- Behaviour ---------- */
function press(v) {
  if (SPORTS.includes(v)) S.sports = S.sports.includes(v) ? S.sports.filter((s) => s !== v) : [...S.sports, v]
  else if (KINDS.includes(v)) S.activities = S.activities.includes(v) ? S.activities.filter((k) => k !== v) : [...S.activities, v]
  else if (v === 'strength') S.strength = S.strength != null ? null : (S.current.strength ?? E.startStrengthPerWeek(S.d.level, null))
  afterChange()
}
function afterChange() {
  S.done = null
  if (S.preview && sig(choices()) !== sig(S.asked)) { S.preview = null; S.note = 'changed'; S.stale = false }
  else if (S.note !== 'changed') S.note = null
  render()
}
function roundTrip(kind, then) { S.pending = kind; render(); setTimeout(() => { S.pending = null; then(); render() }, 650) }
function showPreview(focusIt = true) {
  const c = choices()
  if (c.sports.length === 0 && c.activities.length === 0 && !c.strength) { S.note = 'none'; S.preview = null; return }
  if (sameSet(c, S.current)) { S.note = 'same'; S.preview = null; return }
  S.note = null; S.asked = c; S.preview = computePreview(c)
  if (focusIt) queueMicrotask(() => { const n = document.getElementById('preview'); n?.focus({ preventScroll: true }); n?.scrollIntoView({ block: 'nearest' }) })
}
function confirm() {
  if (document.getElementById('stale-toggle').checked && !S.stale) {
    // The boundary week changed after the preview: nothing is written, the new preview shows.
    S.kept.push(structuredClone(S.d.lateKept)); S.stale = true; S.preview = computePreview(S.asked)
    queueMicrotask(() => document.getElementById('preview')?.focus({ preventScroll: true }))
    return
  }
  S.current = structuredClone(S.asked)
  S.done = W.done(E.nbLongDay(S.d.boundaryKey)); S.preview = null; S.asked = null; S.stale = false; S.note = null
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]')
  if (!t || t.disabled) return
  const act = t.dataset.act
  if (act === 'chip') press(t.dataset.v)
  else if (act === 'main') { S.sports = [...S.sports.slice(1), S.sports[0]]; afterChange() }
  else if (act === 'freq') { S.strength = Number(t.dataset.n); afterChange() }
  else if (act === 'preview') roundTrip('preview', () => showPreview())
  else if (act === 'confirm') roundTrip('confirm', confirm)
})
document.addEventListener('keydown', (e) => {
  const t = e.target
  if (t.getAttribute?.('role') === 'radio' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault()
    const n = Math.min(3, Math.max(1, S.strength + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1)))
    S.strength = n; afterChange(); document.querySelector(`[data-focus="freq-${n}"]`)?.focus()
  }
})

/* Tabs and harness */
document.getElementById('tabs').innerHTML = [['today', 'home'], ['plan', 'calendar'], ['me', 'user']].map(([t, i]) => `<li style="display:flex"><a href="#${t}" ${t === 'me' ? 'aria-current="true"' : ''} style="flex:1">${ICON[i]}${E.APP_TAB_LABELS[t]}</a></li>`).join('')
const toggle = document.getElementById('data-toggle')
function setData(key) {
  reset(key)
  toggle.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.key === key)))
  try { const url = new URL(location); url.searchParams.set('data', key); history.replaceState(null, '', url) } catch {}
  render()
}
toggle.innerHTML = Object.entries(DATASETS).map(([k, d]) => `<button type="button" data-key="${k}">${d.label}</button>`).join('')
toggle.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setData(b.dataset.key) })
setData(DATASETS[params.get('data')] ? params.get('data') : 'demo')

/* Picker wiring (PICKER.md): one variant in an unattended run */
const picker = document.querySelector('.proto-picker')
const hl = picker.querySelector('.proto-picker-highlight')
const items = [...picker.querySelectorAll('.proto-picker-item')]
function moveHighlight() { const el = items[0]; hl.style.width = el.offsetWidth + 'px'; hl.style.transform = `translateX(${el.offsetLeft}px)` }
moveHighlight(); window.addEventListener('resize', moveHighlight)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')))

/* Test hooks for the screenshot script */
window.__proto = { S: () => S, setData, press, showPreview: () => { showPreview(false); render() }, confirmNow: () => { confirm(); render() } }
</script>
