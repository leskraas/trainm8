<!--
  PROTOTYPE — THROWAWAY. Variant E · Levende, built on variant A of
  enkel-start.prototype.html. Question: does the plan feel like the athlete's
  own if they watch it assemble from their answers? A live week strip sits on
  every question screen and fills in as they answer; the top suggestion grows
  out of that strip, the chosen card grows into the 12-week curve, and the
  curve grows into I dag. Same generation rules (buildWeek / outlineFor).
  Nothing is saved; everything is in memory.

  Motion budget (Emil Kowalski's rules, docs/design/design-system.md § Motion):
  transform/opacity only (clip-path for container morphs, a 2px blur on label
  crossfades), custom curves, every UI move ≤ 280ms, exits faster than enters,
  transitions on anything that can be re-triggered, reduced motion = fades only.
-->

	const DAY = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn']
	const DAY_LONG = [

	// The three principles. Plain name first; the family the Outline records second.
	const PRINCIPLES = {

	const state = {
		step: 0,
		prevStep: 0,
		level: null,
		hours: null,
		acts: new Set(),
		actOrder: [],
		prefs: new Set(),

	const today = new Date()
	const todayIdx = (today.getDay() + 6) % 7

	function fmtMin(m) {
		if (m < 60) return `${m} min`
		const h = Math.floor(m / 60),
			r = m % 60
		return r ? `${h} t ${r} min` : `${h} t`
	}
	const fmtH = (h) => String(Math.round(h * 10) / 10).replace('.', ',')
	const actOf = (k) => ACTS.find((a) => a.k === k)
	const color = (k) => `var(--t-${k})`
	const esc = (s) =>
		String(s).replace(
			/[&<>"]/g,
			(c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
		)
	const checkSvg =
		'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-fg)"/></svg>'
	const checkInk =
		'<svg width="16" height="16" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'

	// ——— Week generation: the same rules every principle card, the plan and I dag read ———
	const WORK = {
		easy: {
			t: 'Rolig',
			int: 'easy',
			wt: 0.8,
			d: 'Rolig tempo hele veien. Du skal kunne prate.',
		},
		long: {

		intervals: {

			int: 'hard',
			wt: 1,
			d: 'Varm opp, så 4 × 4 min hardt med 3 min rolig mellom.',
		},
		threshold: {
			t: 'Jevnt hardt',
			int: 'mid',
			wt: 1,
			d: '3 × 10 min kontrollert hardt. Pusten skal være tung, men jevn.',
		},
		tempo: {
			t: 'Tempo',
			int: 'mid',
			wt: 1,
			d: '20 min i komfortabelt hardt tempo midt i økta.',
		},
		strength: {
			t: 'Styrke',
			int: 'mid',
			d: 'Helkropp: knebøy, markløft, press og kjerne. 3 runder.',
		},
		climb: {
			t: 'Klatring',
			int: 'mid',
			d: 'Buldring eller tau. Varm opp fingrene godt.',
		},
		yoga: {
			t: 'Bevegelighet',
			int: 'easy',
			d: 'Rolig yoga for hofter og rygg.',
		},
	}

	function principlesFor() {
		const keys =
			state.level === 'ny'
				? ['base', 'polarized', 'classic']
				: ['polarized', 'threshold', 'classic']
		const score = (k) => {
			let s = 0
			if (state.prefs.has('intervals') && k === 'polarized') s += 2
			if (state.prefs.has('threshold') && k === 'threshold') s += 2
			if (state.prefs.has('long') && (k === 'polarized' || k === 'base')) s += 1
			if (state.prefs.has('surprise') && k === 'classic') s += 2
			if (state.prefs.has('short') && k === 'threshold') s += 1
			return s
		}
		return keys
			.map((k) => ({ k, s: score(k) }))
			.sort((a, b) => b.s - a.s)
			.map((x) => x.k)
	}

	function buildWeek(pk) {
		const days = [...state.days].sort((a, b) => a - b)
		const n = days.length
		const total = Math.round(state.hours * 60)
		const endurance = enduranceChosen()
		const short = state.prefs.has('short')
		// One of each chosen activity first, so nothing the athlete asked for goes missing; a
		// second strength or climbing day only when the week has room for it.
		const strength = { w: 'strength', act: 'strength', min: 45 }
		const climb = { w: 'climb', act: 'climb', min: short ? 60 : 90 }
		const wanted = []
		if (state.acts.has('strength')) wanted.push(strength)
		if (state.acts.has('climb')) wanted.push(climb)
		if (state.acts.has('yoga')) wanted.push({ w: 'yoga', act: 'yoga', min: 30 })
		if (state.acts.has('strength') && state.level !== 'ny' && n >= 5)
			wanted.push({ ...strength })
		if (state.acts.has('climb') && state.level === 'konk' && n >= 6)
			wanted.push({ ...climb })
		const room = n - (endurance.length ? Math.min(2, n) : 0)
		const others = wanted.slice(0, Math.max(0, room))

		const slots = endurance.length ? n - others.length : 0
		let kinds = []
		if (slots > 0) {
			const hardCount =
				pk === 'threshold' ? (slots >= 3 ? 2 : 1) : slots >= 2 ? 1 : 0
			const hardKind =
				pk === 'threshold' ? 'threshold' : pk === 'base' ? 'tempo' : 'intervals'
			for (let i = 0; i < hardCount; i++) kinds.push(hardKind)
			if (pk === 'classic' && slots >= 4) kinds.push('tempo')
			if (pk === 'base' && state.level !== 'ny' && slots >= 4)
				kinds.push('tempo')
			if (slots - kinds.length >= 1 && !(short && slots < 3))
				kinds.push(short ? 'easy' : 'long')
			while (kinds.length < slots) kinds.push('easy')
			kinds = kinds.slice(0, slots)
		}
		const otherMin = others.reduce((s, o) => s + o.min, 0)
		const budget = Math.max(total - otherMin, slots * 25)
		const weightSum = kinds.reduce((s, k) => s + WORK[k].wt, 0) || 1
		const endSessions = kinds.map((k, i) => {
			let min = Math.round((budget * WORK[k].wt) / weightSum / 5) * 5
			min = Math.max(
				state.level === 'ny' ? 20 : 30,
				Math.min(short ? 45 : 180, min),
			)
			// The main sport takes the hard sessions and the long one; the others share the easy days.
			const act =
				WORK[k].int !== 'easy' || k === 'long' || endurance.length === 1
					? endurance[0]
					: endurance[i % endurance.length]
			return { w: k, act, min }
		})

		// Place: the long one last, hard ones spread with an easy day between, the rest fills.
		const placed = new Array(n).fill(null)
		const longI = endSessions.findIndex((s) => s.w === 'long')
		if (longI >= 0) placed[n - 1] = endSessions.splice(longI, 1)[0]
		const hard = endSessions.filter((s) => WORK[s.w].int !== 'easy')
		const rest = endSessions.filter((s) => WORK[s.w].int === 'easy')
		const free = () => placed.map((p, i) => (p ? -1 : i)).filter((i) => i >= 0)
		hard.forEach((s, j) => {
			const f = free()
			const target = Math.round(((j + 1) * n) / (hard.length + 1)) - 1
			const pick = f.reduce(
				(best, i) =>
					Math.abs(i - target) < Math.abs(best - target) ? i : best,
				f[0],
			)
			placed[pick] = s
		})
		;[...others, ...rest].forEach((s) => {
			const f = free()
			if (f.length) placed[f[0]] = s
		})
		return placed
			.map((s, i) =>
				s ? { ...s, day: days[i], ...WORK[s.w], d: WORK[s.w].d } : null,
			)
			.filter(Boolean)
	}

	function weekStats(week) {
		const total = week.reduce((s, x) => s + x.min, 0)
		const by = { easy: 0, mid: 0, hard: 0 }
		week.forEach((x) => (by[x.int] += x.min))
		return {
			total,
			by,
			count: week.length,
			hard: week.filter((x) => x.int === 'hard' || x.w === 'threshold').length,
		}
	}
	function title(s) {
		if (s.act === 'strength' || s.act === 'climb' || s.act === 'yoga')
			return s.t
		return `${s.t} · ${actOf(s.act).t.toLowerCase()}`
	}

	// ——— Outline: what is built behind the chosen card ———
	function outlineFor(pk) {
		const weeks = 12
		const p = PRINCIPLES[pk]
		const rhythm = 4
		const climb = pk === 'base' ? 0.04 : 0.06
		const series = []
		let block = 0
		for (let i = 0; i < weeks; i++) {
			const pos = i % rhythm
			if (pos === 0 && i > 0) block++
			const h =
				state.hours *
				(1 + climb * (block * (rhythm - 1) + Math.min(pos, rhythm - 2)))
			series.push(
				pos === rhythm - 1 ? { h: h * 0.7, light: true } : { h, light: false },
			)
		}
		const tracks = []
		const endurance = enduranceChosen().map(actOf)
		if (endurance.length)
			tracks.push({
				name: 'Utholdenhet',
				unit: 'timer',
				start: fmtH(state.hours),
				sports: endurance.map((a) => a.t).join(', '),
			})
		if (state.acts.has('strength'))
			tracks.push({
				name: 'Styrke',
				unit: 'økter',
				start: state.level === 'ny' ? '1 / uke' : '2 / uke',
			})
		if (state.acts.has('climb'))
			tracks.push({
				name: 'Klatring',
				unit: 'timer',
				start: 'enkel aktivitet, teller i ukas timer',
			})
		if (state.acts.has('yoga'))
			tracks.push({
				name: 'Bevegelighet',
				unit: 'økter',
				start: 'når det er plass',
			})
		return {
			family: p.family,
			familyKey: p.familyKey,
			weeks,
			series,
			tracks,
			peak: Math.max(...series.map((s) => s.h)),
		}
	}

	const enduranceChosen = () =>
		state.actOrder.filter(
			(k) => actOf(k).kind === 'endurance' && state.acts.has(k),
		)
	function mainSport() {
		return enduranceChosen()[0] ?? null
	}

	// ——— Motion kit: WAAPI so every move is transform/opacity on the compositor ———
	const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)'
	const EASE_IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)'
	const MORPH = 280 // something already on screen travelling to its new place
	const RM = matchMedia('(prefers-reduced-motion: reduce)')
	const reduce = () => RM.matches
	const $ = (s, r = document) => r.querySelector(s)
	const $$ = (s, r = document) => [...r.querySelectorAll(s)]

	function fadeIn(els, { delay = 0, stagger = 0, dur = 200 } = {}) {
		els
			.filter(Boolean)
			.forEach((el, i) =>
				el.animate([{ opacity: 0 }, { opacity: 1 }], {
					duration: dur,
					delay: delay + i * stagger,
					easing: EASE_OUT,
					fill: 'backwards',
				}),
			)
	}
	// Entrances rise a few pixels and fade; reduced motion keeps the fade only.
	function enter(
		els,
		{ dx = 0, dy = 6, delay = 0, stagger = 40, dur = 220 } = {},
	) {
		els = els.filter(Boolean)
		if (reduce()) return fadeIn(els, { delay: Math.min(delay, 80), stagger: 0 })
		els.forEach((el, i) =>
			el.animate(
				[
					{ opacity: 0, transform: `translate(${dx}px, ${dy}px)` },
					{ opacity: 1, transform: 'none' },
				],
				{
					duration: dur,
					delay: delay + i * stagger,
					easing: EASE_OUT,
					fill: 'backwards',
				},
			),
		)
	}
	// Container transform: the new box starts where the old one was and at its size (translate + clip),
	// then opens to its own. clip-path handles the radius exactly, which a scale would distort.
	function morphBox(el, first, last) {
		const dx = first.left - last.left,
			dy = first.top - last.top
		const r = Math.max(0, last.width - first.width),
			b = Math.max(0, last.height - first.height)
		const rad = getComputedStyle(el).borderTopLeftRadius
		el.animate(
			// The clip sits 16px outside the box throughout, so the card's shadow never pops in at the end.
			[
				{
					transform: `translate(${dx}px, ${dy}px)`,
					clipPath: `inset(-16px ${r - 16}px ${b - 16}px -16px round ${rad})`,
				},
				{
					transform: 'none',
					clipPath: `inset(-16px -16px -16px -16px round ${rad})`,
				},
			],
			{ duration: MORPH, easing: EASE_IN_OUT },
		)
		return { dx, dy }
	}
	// Shared element (FLIP). `parent` is the offset its morphing container adds, so the two don't double up.
	function flip(
		el,
		first,
		last,
		{ parent = { dx: 0, dy: 0 }, uniform = null } = {},
	) {
		const sx = uniform ?? first.width / last.width,
			sy = uniform ?? first.height / last.height
		const dx = first.left - last.left - parent.dx,
			dy = first.top - last.top - parent.dy
		el.style.transformOrigin = '0 0'
		el.animate(
			[
				{ transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` },
				{ transform: 'none' },
			],
			{ duration: MORPH, easing: EASE_IN_OUT },
		)
	}
	// What the old screen leaves behind: a copy that travels with the morph and fades out fast (exit < enter).
	function ghost(node, rect, move = { dx: 0, dy: 0 }) {
		if (!node || !rect) return
		const g = node.cloneNode(true)
		g.removeAttribute('id')
		g.querySelectorAll('[id]').forEach((x) => x.removeAttribute('id'))
		g.setAttribute('aria-hidden', 'true')
		Object.assign(g.style, {
			position: 'fixed',
			left: `${rect.left}px`,
			top: `${rect.top}px`,
			width: `${rect.width}px`,
			height: `${rect.height}px`,
			margin: '0',
			pointerEvents: 'none',
			zIndex: '4',
		})
		document.body.append(g)
		g.animate(
			[
				{ transform: 'none' },
				{ transform: `translate(${move.dx}px, ${move.dy}px)` },
			],
			{ duration: MORPH, easing: EASE_IN_OUT, fill: 'forwards' },
		)
		g.animate([{ opacity: 1 }, { opacity: 0 }], {
			duration: 140,
			easing: EASE_OUT,
			fill: 'forwards',
		}).onfinish = () => g.remove()
	}

	// Rolling numbers. A value already rolling that changes again (a held stepper) just updates: no queue of rolls.
	function roll(el, from, to) {
		const now = performance.now()
		el._anims?.forEach((a) => a.cancel())
		const quick = el._at && now - el._at < 220
		el._at = now
		el.classList.remove('rolling')
		el.textContent = to
		if (quick || from === to) return
		if (reduce()) {
			el.animate([{ opacity: 0.2 }, { opacity: 1 }], {
				duration: 180,
				easing: EASE_OUT,
			})
			return
		}
		const n = (s) =>
			parseFloat(
				String(s)
					.replace(',', '.')
					.replace(/[^\d.]/g, ''),
			) || 0
		const up = n(to) >= n(from) ? 1 : -1
		el.innerHTML = `<span aria-hidden="true">${esc(from)}</span><span>${esc(to)}</span>`
		el.classList.add('rolling')
		const [o, nw] = el.children
		el._anims = [
			o.animate(
				[
					{ transform: 'none', opacity: 1 },
					{ transform: `translateY(${-70 * up}%)`, opacity: 0 },
				],
				{ duration: 150, easing: EASE_OUT, fill: 'forwards' },
			),
			nw.animate(
				[
					{ transform: `translateY(${70 * up}%)`, opacity: 0 },
					{ transform: 'none', opacity: 1 },
				],
				{ duration: 220, easing: EASE_OUT },
			),
		]
		el._anims[1].onfinish = () => {
			el.classList.remove('rolling')
			el.textContent = to
		}
	}
	function setRoll(el, v) {
		if (!el) return
		const old = el.dataset.v
		el.dataset.v = v
		if (old !== v) roll(el, old ?? v, v)
	}
	const rollSnap = () =>
		new Map($$('[data-roll]').map((el) => [el.dataset.roll, el.dataset.v]))
	function rollFrom(prev) {
		$$('[data-roll]').forEach((el) => {
			const old = prev.get(el.dataset.roll)
			if (old != null && old !== el.dataset.v) roll(el, old, el.dataset.v)
		})
	}
	const rollSpan = (k, v) =>
		`<span data-roll="${k}" data-v="${esc(v)}">${esc(v)}</span>`

	// Count a figure up while the curve grows (the plan's peak). Final value is always exact.
	function countUp(el, from, to, delay, dur) {
		if (!el) return
		if (reduce()) {
			el.textContent = fmtH(to)
			return
		}
		el.textContent = fmtH(from)
		const t0 = performance.now() + delay
		const tick = (t) => {
			const p = Math.min(1, Math.max(0, (t - t0) / dur))
			const e = 1 - Math.pow(1 - p, 3)
			el.textContent = fmtH(from + (to - from) * e)
			if (p < 1) requestAnimationFrame(tick)
		}
		requestAnimationFrame(tick)
	}

	// ——— The strip: one renderer for the live preview and every suggestion card ———
	const ratio = (min) => Math.max(0.14, Math.min(1, min / 150))
	const blkTransform = (m) =>
		`translateY(${((1 - ratio(m.min)) * 100).toFixed(1)}%)`
	const blkColor = (m) => (m.act ? color(m.act) : 'var(--block-neutral)')
	const sig = (m) => (m ? `${m.min}|${m.act}` : 'off')
	function stripCols(model) {
		return DAY.map((d, i) => {
			const m = model[i]
			const st = m
				? `transform:${blkTransform(m)};opacity:1;background-color:${blkColor(m)}`
				: ''
			return `<div class="col"><div class="track"><i class="blk" data-sig="${sig(m)}" style="${st}"></i></div><span class="dl">${d}</span></div>`
		}).join('')
	}
	function weekModel(week) {
		const m = new Array(7).fill(null)
		week.forEach((s) => (m[s.day] = { min: s.min, act: s.act }))
		return m
	}
	function liveModel() {
		const m = new Array(7).fill(null)
		if (!state.level || !state.days.size) return m
		if (!state.acts.size) {
			const per = Math.round((state.hours * 60) / state.days.size / 5) * 5
			state.days.forEach((d) => (m[d] = { min: per, act: null }))
			return m
		}
		return weekModel(buildWeek(principlesFor()[0]))
	}
	// Blocks rise in (ease-out 260ms), stretch in place (ease-in-out 240ms), drop out faster (160ms).
	// Transitions, not keyframes: a day tapped twice quickly reverses from where the block is.
	function updateStrip(el, model, { stagger = true } = {}) {
		let k = 0
		$$('.blk', el).forEach((b, i) => {
			const m = model[i],
				s = sig(m)
			if (b.dataset.sig === s) return
			const was = b.dataset.sig && b.dataset.sig !== 'off'
			b.dataset.sig = s
			const entering = m && !was,
				leaving = !m && was
			b.style.transitionDelay = stagger && m ? `${k++ * 30}ms` : '0ms'
			b.style.transitionDuration = leaving
				? '160ms'
				: entering
					? ''
					: '240ms, 200ms, 200ms'
			b.style.transitionTimingFunction =
				entering || leaving ? '' : `${EASE_IN_OUT}, ${EASE_OUT}, ease`
			if (m) {
				b.style.transform = blkTransform(m)
				b.style.opacity = '1'
				b.style.backgroundColor = blkColor(m)
			} else {
				b.style.transform = 'translateY(101%)'
				b.style.opacity = '0'
			}
		})
	}
	function updateLive(opts) {
		const model = liveModel()
		updateStrip(liveStrip, model, opts)
		const has = model.some(Boolean)
		live.dataset.has = has
		setRoll($('[data-roll="live-n"]'), String(model.filter(Boolean).length))
		setRoll(
			$('[data-roll="live-t"]'),
			fmtMin(model.reduce((s, b) => s + (b ? b.min : 0), 0)),
		)
		liveStrip.setAttribute(
			'aria-label',
			has
				? 'Uka di: ' +
						model
							.map((b, i) =>
								b
									? `${DAY_LONG[i]}, ${b.act ? actOf(b.act).t.toLowerCase() : 'trening'}, ${fmtMin(b.min)}`
									: null,
							)
							.filter(Boolean)
							.join('; ')
				: 'Uka di er tom ennå',
		)
	}

	// ——— Rendering ———
	const head = $('#head'),
		live = $('#live'),
		liveStrip = $('#live-strip'),
		screenEl = $('#screen'),
		ctaEl = $('#cta')
	liveStrip.innerHTML = stripCols(new Array(7).fill(null))
	const FLOW = ['intro', 'level', 'acts', 'prefs', 'suggest', 'ready', 'home']

	function renderScreen() {
		const name = FLOW[state.step]
		const top = state.step >= 1 && state.step <= 4,
			liveOn = state.step >= 1 && state.step <= 3
		head.dataset.top = top ? 'on' : 'off'
		head.dataset.live = liveOn ? 'on' : 'off'
		if (top) {
			$('#progress-i').style.transform =
				`translateX(${(state.step / 4 - 1) * 100}%)`
			$('#progress-label').textContent = `${state.step} av 4`
			$('#progress').setAttribute('aria-valuenow', state.step)
			$('#progress').setAttribute('aria-label', `Steg ${state.step} av 4`)
		}
		screenEl.innerHTML = SCREENS[name]()
		ctaEl.innerHTML = CTA[name] ? CTA[name]() : ''
		bindAfter(name)
	}

	// Rects and nodes the next screen grows out of, taken before the old screen is replaced.
	function capture(from, to) {
		const r = (el) => el?.getBoundingClientRect()
		if (from === 'prefs' && to === 'suggest')
			return {
				liveCard: r(live),
				liveStrip: r(liveStrip),
				sum: $('#live-sum'),
				sumRect: r($('#live-sum')),
			}
		if (from === 'suggest' && to === 'ready') {
			const card = $$('#rail > .card')[state.railIndex]
			const strip = $('.strip', card)
			return { strip: r(strip), stripNode: strip, h2: r($('h2', card)) }
		}
		if (from === 'ready' && to === 'home') {
			const c = $('#ramp-card')
			return { ramp: r(c), rampNode: c }
		}
		return {}
	}

	function go(step) {
		const from = FLOW[state.step],
			to = FLOW[step]
		const wasLive = head.dataset.live === 'on',
			wasHead = head.dataset.top === 'on' || wasLive
		if (from === 'prefs' && to === 'suggest') state.railIndex = 0
		const ctx = capture(from, to)
		state.prevStep = state.step
		state.step = step
		renderScreen()
		window.scrollTo(0, 0)
		if (from === 'prefs' && to === 'suggest') return toSuggest(ctx)
		if (from === 'suggest' && to === 'ready') return toReady(ctx)
		if (from === 'ready' && to === 'home') return toHome(ctx)
		// Plain step: the content slides the way the athlete is going; the head and its strip stay put.
		const back = step < state.prevStep
		enter([screenEl], { dx: back ? -16 : 16, dy: 0, stagger: 0, dur: 240 })
		if (head.dataset.top === 'on' && !wasHead) fadeIn([head])
		if (head.dataset.live === 'on') {
			if (!wasLive && wasHead) fadeIn([live])
			void live.offsetWidth // let the strip's current state resolve, so the update below transitions
			updateLive({ stagger: true })
		}
	}

	function toSuggest(ctx) {
		const cards = $$('#rail > .card'),
			card0 = cards[0],
			strip0 = $('.strip', card0)
		const intro = [$('h1', screenEl), $('.lead', screenEl)],
			pager = $('.pager', screenEl)
		if (reduce() || !ctx.liveCard) {
			fadeIn([...intro, ...cards, pager])
			return
		}
		const rail = $('#rail')
		const last0 = card0.getBoundingClientRect(),
			lastStrip = strip0.getBoundingClientRect()
		rail.style.overflow = 'visible' // the card travels from above the rail; let it be seen on the way
		setTimeout(() => (rail.style.overflow = ''), MORPH + 20)
		enter(intro, { stagger: 30, dur: 200 })
		const P = morphBox(card0, ctx.liveCard, last0)
		flip(strip0, ctx.liveStrip, lastStrip, { parent: P })
		ghost(ctx.sum, ctx.sumRect, { dx: -P.dx, dy: -P.dy })
		enter(
			[...card0.children].filter((c) => c !== strip0),
			{ delay: 140, stagger: 25, dur: 200 },
		)
		// The other two branch off the first: they slide out from behind it.
		cards.slice(1).forEach((c, i) =>
			c.animate(
				[
					{ opacity: 0, transform: 'translateX(-32px)' },
					{ opacity: 1, transform: 'none' },
				],
				{
					duration: 260,
					delay: 160 + i * 50,
					easing: EASE_OUT,
					fill: 'backwards',
				},
			),
		)
		fadeIn([pager], { delay: 220 })
	}

	function toReady(ctx) {
		const h1 = $('#ready-title'),
			card = $('#ramp-card'),
			rbs = $$('.rb', card)
		const o = outlineFor(state.chosen)
		const rest = [
			$('.over', screenEl),
			$('.lead', screenEl),
			$('.facts', card),
			$('.note', screenEl),
			$('details.hood', screenEl),
		]
		if (reduce() || !ctx.strip) {
			fadeIn([h1, card, ...rest])
			$('#peak').textContent = fmtH(o.peak)
			return
		}
		const lastH = h1.getBoundingClientRect(),
			lastCard = card.getBoundingClientRect()
		flip(h1, ctx.h2, lastH, { uniform: 18 / 26 })
		const P = morphBox(card, ctx.strip, lastCard)
		ghost(ctx.stripNode, ctx.strip, { dx: -P.dx, dy: -P.dy })
		enter(rest, { delay: 80, stagger: 40 })
		// Twelve weeks grow out of the baseline, one after another (clipped by their track, never from scale(0)).
		rbs.forEach((rb, i) => {
			const d = 140 + i * 30
			rb.firstElementChild.animate(
				[{ transform: 'translateY(100%)' }, { transform: 'none' }],
				{ duration: 260, delay: d, easing: EASE_OUT, fill: 'backwards' },
			)
			rb.animate([{ opacity: 0 }, { opacity: 1 }], {
				duration: 160,
				delay: d,
				easing: EASE_OUT,
				fill: 'backwards',
			})
		})
		countUp($('#peak'), state.hours, o.peak, 140, rbs.length * 30 + 200)
	}

	function toHome(ctx) {
		const week = $('#week-card'),
			rows = $$('.wrow', week),
			segs = $$('.seg', screenEl)
		segs.forEach((s) => (s.dataset.on = 'false')) // before first style resolve: no transition yet
		const fills = state.week.map(isDone)
		if (reduce() || !ctx.ramp) {
			fadeIn([screenEl])
			requestAnimationFrame(() =>
				segs.forEach((s, i) => (s.dataset.on = fills[i])),
			)
			return
		}
		const last = week.getBoundingClientRect()
		const P = morphBox(week, ctx.ramp, last)
		ghost(ctx.rampNode, ctx.ramp, { dx: -P.dx, dy: -P.dy })
		enter([$('.home-head', screenEl), $('#today-card')], { dy: 8, stagger: 40 })
		enter([$('.sec-head', screenEl), $('.segs', screenEl), $('#done-line')], {
			delay: 80,
			stagger: 30,
			dur: 200,
		})
		enter(rows, { dy: 4, delay: 140, stagger: 30, dur: 200 })
		enter([$('.note', screenEl)], { delay: 260 })
		segs.forEach((s, i) => {
			s.firstElementChild.style.transitionDelay = `${260 + i * 40}ms`
			s.dataset.on = fills[i]
		})
		setTimeout(
			() =>
				segs.forEach((s) => (s.firstElementChild.style.transitionDelay = '')),
			900,
		)
	}

	const ctaBar = (inner) => `<div class="cta-bar"><div>${inner}</div></div>`

	const SCREENS = {
		intro: () => `
		<div style="height:10vh"></div>
		<p class="over">Trainm8</p>
		<h1>La oss lage treningen din</h1>
		<p class="lead">Fire korte spørsmål. Mens du svarer, ser du uka di bli til. Så foreslår vi tre måter å trene på, du velger én, og appen tar seg av resten.</p>
		<div class="note">Tar under ett minutt. Alt kan endres senere.</div>`,

		level: () => {
			const l = LEVELS.find((x) => x.k === state.level)
			return `
		<h1>Hvor er du nå?</h1>

			return `<h1>Tre måter å trene på</h1><p class="lead">Den første er uka du så bli til. Alle passer ${fmtH(state.hours)} timer på ${state.days.size} dager, men følger ulike prinsipper.</p>

	const hintFor = (l) =>
		`Vanlig for en ${l.t.toLowerCase()}. Har du koblet til Strava eller intervals.icu, fyller vi inn det du faktisk trener.`

	function mixBar(by, total) {
		return `<div class="mix" role="img" aria-label="${Math.round((by.easy / total) * 100)} % rolig, ${Math.round((by.mid / total) * 100)} % middels, ${Math.round((by.hard / total) * 100)} % hard">${['easy', 'mid', 'hard'].map((k) => (by[k] ? `<i style="flex:${by[k]};background:var(--${k})"></i>` : '')).join('')}</div>`

	function weekRows(week) {
		return DAY.map((d, i) => {
			const s = week.find((x) => x.day === i)
			return `<div class="wrow"><span class="dn">${d}</span>${s ? `<span class="t"><span class="dot" style="background:${color(s.act)}"></span>${esc(title(s))}</span><span class="m">${fmtMin(s.min)} · <span class="int ${s.int}">${INT[s.int]}</span></span>` : `<span class="t rest">hvile</span><span></span>`}</div>`
		}).join('')
	}
	function missingNote(week) {
		const missing = [...state.acts]
			.filter((k) => !week.some((s) => s.act === k))
			.map((k) => actOf(k).t.toLowerCase())
		return missing.length
			? `<p class="small">Fikk ikke plass denne uka: ${missing.join(' og ')}. Velg en dag til, så kommer det med.</p>`
			: ''
	}
	function suggestionCard(k, best) {
		const p = PRINCIPLES[k],
			week = buildWeek(k),
			s = weekStats(week)
		return `<article class="card" data-k="${k}">
		<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:24px">${best ? '<span class="badge">Passer deg best</span>' : ''}<span class="small">${p.family}</span></div>
		<h2>${p.name}</h2>
		<div class="strip" role="img" aria-label="Uka: ${week.map((x) => `${DAY_LONG[x.day]} ${fmtMin(x.min)}`).join(', ')}">${stripCols(weekModel(week))}</div>
		<p class="small">${p.why}</p>
		${mixBar(s.by, s.total)}
		<div class="facts num"><span><b>${fmtMin(s.total)}</b> i uka</span><span><b>${s.count}</b> økter</span><span><b>${s.hard}</b> ${s.hard === 1 ? 'hard' : 'harde'}</span></div>
		<div class="week">${weekRows(week)}</div>${missingNote(week)}

	function hood(o) {
		const pattern = state.week
			.map(
				(s) =>
					`${DAY[s.day]}: ${s.w}${s.act !== s.w ? `/${s.act}` : ''} ${s.min}m`,
			)
			.join('\n')
		return `<details class="hood"><summary>Under panseret</summary><div class="hood-body">
		<p class="small">Dette er planen appen bygger av svarene dine. Den bruker den hver gang en ny uke lages. Du trenger aldri å se den, men den ligger her.</p>

			<dt>Filosofi</dt><dd>${o.family}</dd>

	</div></details>`

	const isDone = (s) => state.done.has(s.day)
	function todayCard(s, next) {
		if (!s)
			return `<div class="card today" id="today-card"><p class="over">Hviledag</p><h2>Ingen økt i dag</h2>${next ? `<p class="small">Neste: ${esc(title(next))}, ${DAY_LONG[next.day]}, ${fmtMin(next.min)}.</p>` : ''}</div>`
		const done = isDone(s)
		return `<div class="card today" id="today-card" data-day="${s.day}" data-done="${done}"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${color(s.act)}"></span><span class="small">${actOf(s.act).t}</span><span class="int ${s.int}" style="margin-left:auto">${INT[s.int]}</span></div>
		<h2>${esc(s.t)}</h2><p class="num" style="font-weight:600">${fmtMin(s.min)}</p><p class="small">${esc(s.d)}</p>
		<div class="row-actions">
			<button type="button" class="btn btn-primary gjort" data-done="${s.day}" aria-pressed="${done}"><span class="swap"><span class="l-todo" aria-hidden="${done}">Gjort</span><span class="l-done" aria-hidden="${!done}"><span class="ck">${checkInk}</span>Gjort</span></span></button>
			<button type="button" class="btn btn-quiet" data-second="${s.day}"><span class="swap"><span class="l-todo" aria-hidden="${done}">Bytt eller flytt</span><span class="l-done" aria-hidden="${!done}">Angre</span></span></button>
		</div></div>`

	function homeRow(week, i) {
		const s = week.find((x) => x.day === i)
		const cls = i === todayIdx ? 'wrow today-row' : 'wrow'
		if (!s)
			return `<div class="${cls}"><span class="dn">${DAY[i]}</span><span class="t rest">hvile</span><span></span></div>`
		const mark =
			i < todayIdx && !isDone(s)
				? `<span class="small">ikke gjort</span>`
				: `<span class="mark" data-day="${s.day}" data-done="${isDone(s)}" role="img" aria-label="${isDone(s) ? 'gjort' : 'ikke gjort ennå'}"><span class="todo-mark"></span><span class="done-mark">${checkSvg}</span></span>`
		return `<div class="${cls}"><span class="dn">${DAY[i]}</span><span class="t"><span class="dot" style="background:${color(s.act)}"></span><span>${esc(title(s))}<br><span class="small num" data-roll="m-${i}" data-v="${fmtMin(s.min)}">${fmtMin(s.min)}</span><span class="small"> · ${INT[s.int]}</span></span></span>${mark}</div>`

	// ——— In-place patches: answers change the screen without re-mounting it ———
	const PATCH = {
		level() {
			$$('[data-level]').forEach((b) =>
				b.setAttribute('aria-pressed', b.dataset.level === state.level),
			)
			const l = LEVELS.find((x) => x.k === state.level)
			$('#hours-sec').classList.toggle('in', !!l)
			setRoll($('[data-roll="hours"]'), fmtH(state.hours ?? 0))
			$('#level-hint').textContent = l ? hintFor(l) : ''
			$('#cta [data-act="next"]').disabled = !state.level
		},
		acts() {
			$$('[data-act-k]').forEach((b) =>
				b.setAttribute('aria-pressed', state.acts.has(b.dataset.actK)),
			)
			$$('[data-day]').forEach((b) =>
				b.setAttribute('aria-pressed', state.days.has(Number(b.dataset.day))),
			)
			const main = mainSport()
			$('#main-line').classList.toggle('in', !!main)
			if (main) $('#main-name').textContent = actOf(main).t
			setRoll($('[data-roll="days-n"]'), String(state.days.size))
			$('#cta [data-act="next"]').disabled = !(
				state.acts.size && state.days.size
			)
		},
		prefs() {
			$$('[data-pref]').forEach((b) =>
				b.setAttribute('aria-pressed', state.prefs.has(b.dataset.pref)),
			)
			$('#cta [data-act="next"]').textContent = state.prefs.size
				? 'Vis forslag'
				: 'Hopp over, vis forslag'
		},
	}
	function answer(opts) {
		PATCH[FLOW[state.step]]()
		updateLive(opts)
	}

	function patchHome() {
		const week = state.week,
			s = weekStats(week),
			doneList = week.filter(isDone)
		const tc = $('#today-card')
		if (tc?.dataset.day) {
			const done = state.done.has(Number(tc.dataset.day))
			tc.dataset.done = done
			$('.gjort', tc).setAttribute('aria-pressed', done)
			$$('.l-todo', tc).forEach((x) => x.setAttribute('aria-hidden', done))
			$$('.l-done', tc).forEach((x) => x.setAttribute('aria-hidden', !done))
		}
		$$('.mark[data-day]').forEach((m) => {
			const d = state.done.has(Number(m.dataset.day))
			m.dataset.done = d
			m.setAttribute('aria-label', d ? 'gjort' : 'ikke gjort ennå')
		})

			(g) => (g.dataset.on = state.done.has(Number(g.dataset.day))),

	function rerenderHome() {
		const prev = rollSnap()
		screenEl.innerHTML = SCREENS.home()

	// The earned moment: the first time a session is marked done, a few sparks leave the check.
	// Rare (once per session, never on undo), 300ms, compositor-only; reduced motion skips it.
	function celebrate(btn, act) {
		if (reduce()) return
		const r = $('.ck', btn).getBoundingClientRect()
		const cx = r.left + r.width / 2,
			cy = r.top + r.height / 2
		for (let i = 0; i < 8; i++) {
			const a = (i / 8) * Math.PI * 2 + 0.3,
				dist = i % 2 ? 26 : 20
			const sp = document.createElement('i')
			sp.className = 'spark'
			Object.assign(sp.style, {
				left: `${cx}px`,
				top: `${cy}px`,
				background: i % 2 ? 'var(--primary)' : color(act),
			})
			document.body.append(sp)
			sp.animate(
				[
					{ transform: 'translate(-50%, -50%) scale(0.9)', opacity: 1 },
					{
						transform: `translate(calc(-50% + ${(Math.cos(a) * dist).toFixed(1)}px), calc(-50% + ${(Math.sin(a) * dist).toFixed(1)}px)) scale(0.5)`,
						opacity: 0,
					},
				],
				{ duration: 300, delay: 80, easing: EASE_OUT, fill: 'backwards' },
			).onfinish = () => sp.remove()
		}
	}

	// ——— Sheet and toast ———
	const scrim = $('#scrim'),
		sheet = $('#sheet'),
		sheetBody = $('#sheet-body')
	let lastFocus = null
	function openSheet(html) {
		lastFocus = document.activeElement
		sheetBody.innerHTML = `<div class="grabber"></div>${html}`
		scrim.classList.add('open')
		sheet.classList.add('open')
		setTimeout(() => sheetBody.querySelector('button')?.focus(), 50)
	}
	function closeSheet() {
		scrim.classList.remove('open')
		sheet.classList.remove('open')
		lastFocus?.focus?.()
	}
	scrim.addEventListener('click', closeSheet)
	document.addEventListener('keydown', (e) => {
		if (e.key === 'Escape') closeSheet()
	})

	const toastEl = $('#toast'),
		toastText = $('#toast-text')
	let toastTimer = null,
		undoFn = null
	function toast(msg, undo) {
		toastText.textContent = msg
		undoFn = undo
		$('#toast-undo').hidden = !undo
		toastEl.classList.add('show')
		clearTimeout(toastTimer)
		toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000)
	}
	toastEl.addEventListener('pointerenter', () => clearTimeout(toastTimer))
	toastEl.addEventListener('pointerleave', () => {
		toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000)
	})
	$('#toast-undo').addEventListener('click', () => {
		undoFn?.()
		toastEl.classList.remove('show')
	})

	function adjustSheet() {
		openSheet(`<h2 id="sheet-title">Juster</h2><p class="small">Si hva som skjer, så ordner appen resten.</p>
		<div class="options" style="margin-top:8px">
			<button type="button" class="option" data-adj="lighter"><div><b>Uka er for tung</b><span class="d">Kortere økter resten av uka, ingen harde.</span></div></button>
			<button type="button" class="option" data-adj="less-time"><div><b>Jeg har mindre tid denne uka</b><span class="d">Fjerner den korteste økta som gjenstår.</span></div></button>
			<button type="button" class="option" data-adj="harder"><div><b>Jeg vil ha mer</b><span class="d">Litt lengre økter resten av uka.</span></div></button>
			<button type="button" class="option" data-adj="advanced"><div><b>Avansert</b><span class="d">Sesong, filosofi, ukemål, soner og terskler. Alt som finnes i dag.</span></div></button>
		</div>`)
	}
	function adjust(kind) {
		const before = state.week.map((s) => ({ ...s }))
		const ahead = (s) => s.day >= todayIdx && !isDone(s)
		let msg = ''
		if (kind === 'lighter') {
			state.week = state.week.map((s) =>
				ahead(s)
					? {
							...s,
							min: Math.max(20, Math.round((s.min * 0.8) / 5) * 5),
							...(s.int !== 'easy'
								? { w: 'easy', t: 'Rolig', int: 'easy', d: WORK.easy.d }
								: {}),
						}
					: s,
			)
			msg = 'Resten av uka er gjort lettere'
		}
		if (kind === 'harder') {
			state.week = state.week.map((s) =>
				ahead(s) ? { ...s, min: Math.round((s.min * 1.15) / 5) * 5 } : s,
			)
			msg = 'Resten av uka er litt lengre'
		}
		if (kind === 'less-time') {
			const left = state.week.filter(ahead).sort((a, b) => a.min - b.min)
			if (!left.length) {
				toast('Ingen økter igjen å fjerne')
				closeSheet()
				return
			}
			state.week = state.week.filter((s) => s !== left[0])
			msg = `${title(left[0])} på ${DAY_LONG[left[0].day]} er fjernet`
		}
		if (kind === 'advanced') {
			closeSheet()
			toast('Her åpnes dagens Sesong-side med alt det avanserte')
			return
		}
		closeSheet()
		rerenderHome()
		toast(msg, () => {
			state.week = before
			rerenderHome()
		})
	}

	// ——— Events ———
	function bindAfter(name) {
		if (name !== 'suggest') return
		const rail = $('#rail'),
			ind = $('#pg-ind')
		const step = () => rail.firstElementChild.offsetWidth + 12
		rail.scrollLeft = state.railIndex * step()
		const sync = () => {
			const p = Math.max(0, Math.min(2, rail.scrollLeft / step()))
			ind.style.transform = `translateX(${(p * 24).toFixed(1)}px)` // follows the finger, no easing
			state.railIndex = Math.round(p)
		}
		sync()
		rail.addEventListener('scroll', sync, { passive: true })
	}

	function choose(k) {
		state.chosen = k
		state.week = buildWeek(k)
		state.done = new Set(
			state.week.filter((s) => s.day < todayIdx).map((s) => s.day),
		)
		state.celebrated = new Set(state.done)
		go(5)
	}

	function toggleDone(day, btn) {
		const was = state.done.has(day)
		was ? state.done.delete(day) : state.done.add(day)
		patchHome()
		if (!was && !state.celebrated.has(day)) {
			state.celebrated.add(day)
			celebrate(
				$('#today-card .gjort'),
				state.week.find((s) => s.day === day).act,
			)
		}
	}

	document.addEventListener('click', (e) => {
		const t = e.target.closest('button')
		if (!t) return
		const d = t.dataset
		if (d.level) {
			const l = LEVELS.find((x) => x.k === d.level)
			state.level = l.k
			state.hours = l.h
			if (!state.daysTouched) state.days = new Set(l.days)
			answer()
			return
		}
		if (d.hours) {
			state.hours = Math.min(20, Math.max(1, state.hours + Number(d.hours)))
			answer({ stagger: false })
			return
		}
		if (d.actK) {
			if (state.acts.has(d.actK)) {
				state.acts.delete(d.actK)
				state.actOrder = state.actOrder.filter((k) => k !== d.actK)
			} else {
				state.acts.add(d.actK)
				state.actOrder.push(d.actK)
			}
			answer()
			return
		}
		if (d.day) {
			const i = Number(d.day)
			state.daysTouched = true
			state.days.has(i) ? state.days.delete(i) : state.days.add(i)
			answer()
			return
		}
		if (d.pref) {
			state.prefs.has(d.pref)
				? state.prefs.delete(d.pref)
				: state.prefs.add(d.pref)
			answer()
			return
		}
		if (d.done) {
			toggleDone(Number(d.done), t)
			return
		}
		if (d.second) {
			const day = Number(d.second)
			state.done.has(day) ? toggleDone(day, t) : adjustSheet()
			return
		}
		if (d.adj) {
			adjust(d.adj)
			return
		}
		switch (d.act) {
			case 'next':
				go(state.step + 1)
				break
			case 'back':
				go(Math.max(0, state.step - 1))
				break
			case 'demo':
				demo()
				break
			case 'choose-rail':
				choose(principlesFor()[state.railIndex] ?? principlesFor()[0])
				break
			case 'adjust':
				adjustSheet()
				break
			case 'plan-tab':
				toast('Plan: sesongen som én enkel kurve, med «Avansert» for alt annet')
				break
			case 'me-tab':
				toast('Meg: profil, tilkoblinger og innstillinger')
				break
		}
	})

	// The example fills in every answer and lands on the last question, so the week can be seen
	// assembling before the suggestions grow out of it.
	function demo() {
		state.level = 'mosjon'
		state.hours = 6
		state.acts = new Set(['run', 'strength', 'climb'])
		state.actOrder = ['run', 'strength', 'climb']
		state.days = new Set([0, 1, 3, 5, 6])
		state.daysTouched = true
		state.prefs = new Set(['long', 'intervals'])
		go(3)
	}

	renderScreen()
</script>
