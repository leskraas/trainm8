<!--
  PROTOTYPE — THROWAWAY. Question: can the app start with a few plain questions
  (nivå, aktiviteter, dager, økttyper), offer up to three weeks that follow different
  training principles, and land on a calm I dag, with the Plan Outline built
  behind it? Three variants of the suggestion screen and of I dag, switchable
  from the pill at the top (or ← →). Nothing is saved; everything is in memory.
-->

.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 12px; scrollbar-width: none; overscroll-behavior-x: contain; outline-offset: -2px; }

<script>
const VARIANTS = [
	{ k: 'A', name: 'Kort' },
	{ k: 'B', name: 'Sammenlign' },
	{ k: 'C', name: 'Én om gangen' },
]
const LEVELS = [
	{ k: 'ny', t: 'Nybegynner', d: 'Jeg er i gang, eller kommer tilbake etter en pause.', h: 3, days: [1, 3, 5] },
	{ k: 'mosjon', t: 'Mosjonist', d: 'Jeg trener jevnlig, to–tre ganger i uka.', h: 5, days: [1, 3, 5, 6] },
	{ k: 'erfaren', t: 'Erfaren', d: 'Jeg har trent strukturert i flere år.', h: 7, days: [0, 1, 3, 4, 6] },
	{ k: 'konk', t: 'Konkurranse', d: 'Jeg trener mot resultater og tåler mye.', h: 10, days: [0, 1, 2, 3, 5, 6] },
]
const ACTS = [
	{ k: 'run', t: 'Løping', s: 'løping', kind: 'endurance' },
	{ k: 'bike', t: 'Sykling', s: 'sykling', kind: 'endurance' },
	{ k: 'ski', t: 'Langrenn', s: 'langrenn', kind: 'endurance' },
	{ k: 'swim', t: 'Svømming', s: 'svømming', kind: 'endurance' },
	{ k: 'hike', t: 'Fjelltur', s: 'fjelltur', kind: 'endurance' },
	{ k: 'strength', t: 'Styrke', s: 'styrke', kind: 'strength' },
	{ k: 'climb', t: 'Klatring', s: 'klatring', kind: 'climb' },
	{ k: 'yoga', t: 'Yoga og bevegelighet', s: 'yoga', kind: 'mobility' },
]
const PREFS = [
	{ k: 'long', t: 'Lange, rolige turer', d: 'Tid i beina, i et tempo der du kan prate.' },
	{ k: 'intervals', t: 'Korte, harde intervaller', d: 'Få minutter der det virkelig går unna.' },
	{ k: 'threshold', t: 'Jevnt hardt', d: 'Lengre drag der du jobber kontrollert hardt.' },
	{ k: 'short', t: 'Korte økter', d: 'Helst ikke over 45 minutter.' },
	{ k: 'surprise', t: 'Overrask meg', d: 'Bland gjerne, jeg liker variasjon.' },
]
const DAY = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn']
const DAY_LONG = ['mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag', 'søndag']
const MONTH = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des']
const INT = { easy: 'rolig', mid: 'middels', hard: 'hard' }
const MIN_H = 1, MAX_H = 20

const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`
const listFmt = (xs) => (Intl.ListFormat ? new Intl.ListFormat('nb', { type: 'conjunction' }).format(xs) : xs.join(', '))

// The principles. Plain name first; the family the Outline records second.
const PRINCIPLES = {
	polarized: { name: 'Mest rolig, litt veldig hardt', family: 'Polarisert 80/20', familyKey: 'polarized', why: () => 'Nesten alt går rolig. Én gang i uka går det skikkelig hardt. Gir mye form for lite slitasje.' },
	threshold: { name: 'Jevnt og kontrollert hardt', family: 'Terskelfokus', familyKey: 'threshold', why: (s) => `${s.hard === 1 ? 'Én økt' : `${s.hard} økter`} i uka der du jobber jevnt hardt i lengre drag. Effektivt når tiden er knapp.` },
	classic: { name: 'Variert og bygger seg opp', family: 'Klassisk 3:1', familyKey: 'classic', why: () => 'Litt av alt. Tre uker blir gradvis tyngre, den fjerde er lett så kroppen tar igjen.' },
	base: { name: 'Bygg grunnform først', family: 'Stor base', familyKey: 'big-base', why: () => 'Lange perioder med rolig trening før det blir hardere. Trygt når du starter opp.' },
	mixed: { name: 'Jevnt fordelt', family: 'Uten utholdenhetsplan', familyKey: 'none', why: () => 'Uten en utholdenhetsidrett er det ingen rolige og harde økter å fordele. Vi sprer øktene, så du får hvile mellom.' },
}

const state = {
	step: 0, rendered: -1, variant: 0,
	level: null, hours: null, acts: new Set(), actOrder: [], prefs: new Set(), days: new Set(), daysTouched: false,
	railIndex: 0, soloIndex: 0, expanded: null, chosen: null,
	week: null, startDay: 0, done: new Set(), justDone: null, adj: {}, tab: 'today',
}

const today = new Date()
const todayIdx = (today.getDay() + 6) % 7

function fmtMin(m) {
	if (m < 60) return `${m} min`
	const h = Math.floor(m / 60), r = m % 60
	return r ? `${h} t ${r} min` : `${h} t`
}
const fmtH = (h) => String(Math.round(h * 10) / 10).replace('.', ',')
const hoursTxt = (h) => `${fmtH(h)} ${h === 1 ? 'time' : 'timer'}`
const actOf = (k) => ACTS.find((a) => a.k === k)
const color = (k) => `var(--t-${k})`
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const checkSvg = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-fg)"/></svg>'
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const buzz = (ms = 10) => { try { navigator.vibrate?.(ms) } catch {} }

// ——— Week generation: the same rules every principle card, the plan and I dag read ———
const WORK = {
	easy: { t: 'Rolig', int: 'easy', wt: 0.8, d: 'Rolig tempo hele veien. Du skal kunne prate.' },
	long: { t: 'Langtur', int: 'easy', wt: 1.6, d: 'Lang og rolig. Ta med drikke.' },
	intervals: { t: 'Intervaller', int: 'hard', wt: 1, d: 'Varm opp, så 4 × 4 min hardt med 3 min rolig mellom.' },
	threshold: { t: 'Jevnt hardt', int: 'mid', wt: 1, d: '3 × 10 min kontrollert hardt. Pusten skal være tung, men jevn.' },
	tempo: { t: 'Tempo', int: 'mid', wt: 1, d: '20 min i komfortabelt hardt tempo midt i økta.' },
	strength: { t: 'Styrke', int: 'mid', wt: 0.7, d: 'Helkropp: knebøy, markløft, press og kjerne. 3 runder.' },
	climb: { t: 'Klatring', int: 'mid', wt: 1.1, d: 'Buldring eller tau. Varm opp fingrene godt.' },
	yoga: { t: 'Bevegelighet', int: 'easy', wt: 0.5, d: 'Rolig yoga for hofter og rygg.' },
}
const isEndurance = (s) => actOf(s.act).kind === 'endurance'

// Shortest and longest a session may be. The week is fitted inside these, never outside.
function limits(w) {
	const ny = state.level === 'ny', konk = state.level === 'konk', short = state.prefs.has('short')
	switch (w) {
		case 'easy': return [ny ? 20 : 30, short ? 45 : konk ? 180 : 150]
		case 'long': return [ny ? 40 : 60, short ? 90 : ny ? 120 : konk ? 240 : 180]
		case 'intervals': case 'tempo': return [ny ? 25 : 30, short ? 45 : 90]
		case 'threshold': return [30, short ? 45 : 105]
		case 'strength': return [30, 75]
		case 'climb': return [45, short ? 60 : 150]
		case 'yoga': return [20, 60]
	}
}
const session = (w, act, extra) => { const [lo, hi] = limits(w); return { w, act, lo, hi, wt: WORK[w].wt, extra: !!extra, min: lo } }

// Pick k of the days, as spread out as possible, always keeping the last one (the long day).
function spread(days, k) {
	if (k >= days.length) return days
	if (k === 1) return [days[days.length - 1]]
	return [...new Set(Array.from({ length: k }, (_, i) => days[Math.round((i * (days.length - 1)) / (k - 1))]))]
}

function enduranceKinds(pk, S) {
	if (S <= 0) return []
	const ny = state.level === 'ny'
	const L = !state.prefs.has('short') || state.prefs.has('long') ? 'long' : 'easy'
	let k
	if (pk === 'polarized') k = S === 1 ? [L] : ['intervals', L, ...(S >= 6 && !ny ? ['intervals'] : [])]
	else if (pk === 'threshold') k = S === 1 ? ['threshold'] : S === 2 ? ['threshold', 'easy'] : ['threshold', 'threshold', ...(S >= 5 ? [L] : [])]
	else if (pk === 'classic') k = S === 1 ? ['tempo'] : S === 2 ? ['tempo', L] : ny ? ['tempo', L] : ['intervals', 'tempo', L]
	else k = S === 1 ? ['easy'] : [L, ...(!ny && S >= 4 ? ['tempo'] : [])]
	k = k.slice(0, S)
	while (k.length < S) k.push('easy')
	return k
}

// Share the minutes by weight, clamped to each session's limits (water-filling).
function fit(list, total) {
	const fixed = new Map()
	for (let guard = 0; guard < 20; guard++) {
		const free = list.filter((s) => !fixed.has(s))
		if (!free.length) break
		const rem = total - [...fixed.values()].reduce((a, b) => a + b, 0)
		const wsum = free.reduce((a, s) => a + s.wt, 0)
		let changed = false
		for (const s of free) {
			const m = (rem * s.wt) / wsum
			if (m < s.lo) { fixed.set(s, s.lo); changed = true } else if (m > s.hi) { fixed.set(s, s.hi); changed = true }
		}
		if (!changed) { free.forEach((s) => (s.min = (rem * s.wt) / wsum)); break }
	}
	fixed.forEach((v, s) => (s.min = v))
	list.forEach((s) => (s.min = Math.min(s.hi, Math.max(s.lo, Math.round(s.min / 5) * 5))))
}

function plan(pk) {
	const notes = []
	let days = [...state.days].sort((a, b) => a - b)
	const total = Math.round(state.hours * 60)
	const end = enduranceChosen()
	const ny = state.level === 'ny'
	const cap = ny ? 4 : 7
	if (days.length > cap) { days = spread(days, cap); notes.push(`Som nybegynner får du høyst ${cap} økter i uka, så kroppen rekker å hente seg inn.`) }
	const n = days.length
	let list = []
	if (end.length) {
		const firsts = ['strength', 'climb', 'yoga'].filter((k) => state.acts.has(k)).map((k) => session(k, k))
		const extras = []
		if (state.acts.has('strength') && !ny && n >= 5) extras.push(session('strength', 'strength', true))
		if (state.acts.has('climb') && state.level === 'konk' && n >= 6) extras.push(session('climb', 'climb', true))
		const others = [...firsts, ...extras].slice(0, Math.max(0, n - Math.min(2, n)))
		let e = 0
		const endS = enduranceKinds(pk, n - others.length).map((k) => {
			const main = WORK[k].int !== 'easy' || k === 'long' || end.length === 1
			return session(k, main ? end[0] : end[(1 + e++) % end.length])
		})
		// Priority order: what goes first when the hours run short is at the end.
		list = [...endS.slice(0, 2), ...others.filter((o) => !o.extra), ...endS.slice(2), ...others.filter((o) => o.extra)]
	} else {
		const max = { strength: ny ? 2 : 3, climb: state.level === 'konk' ? 4 : 3, yoga: 7 }
		const kinds = ['strength', 'climb', 'yoga'].filter((k) => state.acts.has(k))
		const count = {}
		for (let i = 0; list.length < n && kinds.some((k) => (count[k] || 0) < max[k]); i++) {
			const k = kinds[i % kinds.length]
			if ((count[k] || 0) < max[k]) { count[k] = (count[k] || 0) + 1; list.push(session(k, k)) }
		}
		if (list.length < n) notes.push(`${listFmt(kinds.map((k) => actOf(k).s)).replace(/^./, (c) => c.toUpperCase())} trenger hvile mellom øktene, så det blir ${pl(list.length, 'økt', 'økter')} på ${pl(n, 'dag', 'dager')}.`)
	}
	const before = list.length
	while (list.length > 1 && list.reduce((a, s) => a + s.lo, 0) > total) list.pop()
	if (list.length < before) notes.push(`${hoursTxt(state.hours)} rekker til ${pl(list.length, 'økt', 'økter')}, så vi bruker ${list.length} av de ${n} dagene.`)
	fit(list, total)
	const sum = list.reduce((a, s) => a + s.min, 0)
	if (sum < total - 20) notes.push(state.prefs.has('short') && end.length
		? `Du vil ha korte økter, så uka blir ${fmtMin(sum)}, ikke ${hoursTxt(state.hours)}.${state.days.size < 7 ? ' Velg flere dager for å komme nærmere.' : ''}`
		: `Øktene blir ikke lengre enn det som gir mening, så uka blir ${fmtMin(sum)}, ikke ${hoursTxt(state.hours)}. ${!end.length ? 'Legg til en utholdenhetsidrett for å fylle timene.' : state.days.size < 7 ? 'Velg flere dager for å komme helt opp.' : 'Mer enn dette krever to økter noen dager.'}`)
	else if (sum > total + 20) notes.push(`Den korteste økta som gir mening er ${fmtMin(sum)}, så uka blir litt over ${hoursTxt(state.hours)}.`)
	if (state.prefs.has('short') && state.prefs.has('long') && list.some((s) => s.w === 'long')) notes.push('Korte økter, men langturen får være opptil 1 t 30 min, siden du også liker lange turer.')

	// Place: the long one last, hard ones spread with an easy day between, other sports spread out, rest fills.
	days = spread(days, list.length)
	const m = days.length
	const placed = new Array(m).fill(null)
	const free = () => placed.map((p, i) => (p ? -1 : i)).filter((i) => i >= 0)
	const nearest = (target, avoid) => {
		const f = free()
		const ok = f.filter((i) => !avoid || !placed.some((p, j) => p && avoid(p) && Math.abs(days[j] - days[i]) <= 1))
		const pool = ok.length ? ok : f
		return pool.reduce((best, i) => (Math.abs(i - target) < Math.abs(best - target) ? i : best), pool[0])
	}
	const longI = list.findIndex((s) => s.w === 'long')
	if (longI >= 0) placed[m - 1] = list[longI]
	const hard = list.filter((s) => isEndurance(s) && WORK[s.w].int !== 'easy')
	hard.forEach((s, j) => (placed[nearest(Math.round(((j + 1) * m) / (hard.length + 1)) - 1, (p) => isEndurance(p) && WORK[p.w].int !== 'easy')] = s))
	const others = list.filter((s) => !isEndurance(s))
	if (end.length) others.forEach((s, j) => (placed[nearest(Math.round(((j + 1) * m) / (others.length + 1)) - 1, (p) => p.w === s.w)] = s))
	else others.forEach((s) => (placed[free()[0]] = s))
	list.filter((s) => !placed.includes(s)).forEach((s) => (placed[free()[0]] = s))
	const week = placed.map((s, i) => ({ w: s.w, act: s.act, min: s.min, day: days[i], t: WORK[s.w].t, int: WORK[s.w].int, d: WORK[s.w].d }))
	return { week, notes }
}
const buildWeek = (pk) => plan(pk).week

function weekStats(week) {
	const total = week.reduce((s, x) => s + x.min, 0)
	const by = { easy: 0, mid: 0, hard: 0 }
	week.forEach((x) => (by[x.int] += x.min))
	return { total, by, count: week.length, hard: week.filter((x) => x.int === 'hard' || x.w === 'threshold').length }
}
function title(s) {
	if (!isEndurance(s)) return s.t
	return `${s.t} · ${actOf(s.act).s}`
}

function principlesFor() {
	if (!enduranceChosen().length) return [{ k: 'mixed', s: 0 }]
	const keys = state.level === 'ny' ? ['base', 'polarized', 'classic'] : ['polarized', 'threshold', 'classic']
	const score = (k) => {
		let s = 0
		if (state.prefs.has('intervals') && k === 'polarized') s += 2
		if (state.prefs.has('threshold') && k === 'threshold') s += 2
		if (state.prefs.has('long') && (k === 'polarized' || k === 'base')) s += 1
		if (state.prefs.has('surprise') && k === 'classic') s += 2
		if (state.prefs.has('short') && k === 'threshold') s += 1
		return s
	}
	return keys.map((k) => ({ k, s: score(k) })).sort((a, b) => b.s - a.s)
}
// The suggestions actually shown: identical weeks collapse into one, so every card is a real choice.
function suggestions() {
	const seen = new Set(), out = []
	const all = principlesFor()
	for (const { k, s } of all) {
		const { week, notes } = plan(k)
		const sig = week.map((x) => `${x.day}${x.int}${x.min}${x.act}`).join('|')
		if (seen.has(sig)) continue
		seen.add(sig); out.push({ k, score: s, week, notes })
	}
	out.forEach((x, i) => (x.badge = i === 0 && x.score > 0 ? 'Passer deg best' : i === 0 && x.k === 'base' ? 'Anbefalt for nivået ditt' : ''))
	out.collapsed = all.length - out.length
	return out
}

// ——— Outline: what is built behind the chosen card ———
function outlineFor(pk) {
	const weeks = 12
	const p = PRINCIPLES[pk]
	const rhythm = 4
	const climb = pk === 'base' ? 0.04 : 0.06
	const startH = weekStats(state.week).total / 60
	const series = []
	let block = 0
	for (let i = 0; i < weeks; i++) {
		const pos = i % rhythm
		if (pos === 0 && i > 0) block++
		const h = startH * (1 + climb * (block * (rhythm - 1) + Math.min(pos, rhythm - 2)))
		series.push(pos === rhythm - 1 ? { h: h * 0.7, light: true } : { h, light: false })
	}
	const tracks = []
	const endurance = enduranceChosen().map(actOf)
	if (endurance.length) tracks.push({ name: 'Utholdenhet', unit: 'timer', start: fmtH(startH), sports: endurance.map((a) => a.t).join(', ') })
	if (state.acts.has('strength')) tracks.push({ name: 'Styrke', unit: 'økter', start: `${state.week.filter((s) => s.w === 'strength').length} / uke` })
	if (state.acts.has('climb')) tracks.push({ name: 'Klatring', unit: 'timer', start: 'enkel aktivitet, teller i ukas timer' })
	if (state.acts.has('yoga')) tracks.push({ name: 'Bevegelighet', unit: 'økter', start: 'når det er plass' })
	return { family: p.family, familyKey: p.familyKey, weeks, series, tracks, startH, peak: Math.max(...series.map((s) => s.h)) }
}

// ——— Rendering ———
const app = document.getElementById('app')
const FLOW = ['intro', 'level', 'acts', 'prefs', 'suggest', 'ready', 'home']
const pctFor = (step) => (step >= 1 && step <= 4 ? Math.min(step, 3) / 3 : null)

// Patch the new markup into the live DOM so pressed buttons keep their node: the press releases
// smoothly and selection transitions actually run. Only a step change replaces the screen.
function morph(from, to) {
	if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return }
	if (from.nodeType === Node.TEXT_NODE) { if (from.data !== to.data) from.data = to.data; return }
	if (from.nodeType !== Node.ELEMENT_NODE) return
	for (const { name } of [...from.attributes]) {
		if (name === 'open' && from.nodeName === 'DETAILS') continue // user-toggled
		if (!to.hasAttribute(name)) from.removeAttribute(name)
	}
	for (const { name, value } of [...to.attributes]) if (from.getAttribute(name) !== value) from.setAttribute(name, value)
	morphChildren(from, to)
}
function morphChildren(from, to) {
	const a = [...from.childNodes], b = [...to.childNodes]
	b.forEach((n, i) => (a[i] ? morph(a[i], n) : from.appendChild(n.cloneNode(true))))
	a.slice(b.length).forEach((n) => n.remove())
}

function topFor(name) {
	const step = FLOW.indexOf(name)
	const backBtn = '<button type="button" class="back" data-act="back" aria-label="Tilbake"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
	if (name === 'ready') return `<div class="top">${backBtn}</div>`
	const pct = pctFor(step)
	if (pct == null) return ''
	const label = step <= 3 ? `${step} av 3` : 'Velg'
	return `<div class="top">${backBtn}<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${Math.min(step, 3)}" aria-label="Steg ${Math.min(step, 3)} av 3"><i style="transform:scaleX(${pct})"></i></div><span class="small num">${label}</span></div>`
}

function render() {
	const name = FLOW[state.step]
	const stepChanged = state.step !== state.rendered
	const structural = stepChanged || state.variant !== state.renderedVariant // a variant switch is a different screen, not a patch
	const prevPct = pctFor(state.rendered)
	const html = `${topFor(name)}<div class="screen">${SCREENS[name]()}</div>${CTA[name] ? CTA[name]() : ''}`
	if (structural || !app.firstElementChild) app.innerHTML = html
	else { const next = document.createElement('main'); next.innerHTML = html; morphChildren(app, next) }
	state.rendered = state.step
	state.renderedVariant = state.variant
	state.justDone = null
	const fill = app.querySelector('.progress > i'), pct = pctFor(state.step)
	if (stepChanged && fill && prevPct != null && prevPct !== pct && !reduceMotion()) fill.animate([{ transform: `scaleX(${prevPct})` }, { transform: `scaleX(${pct})` }], { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' })
	document.getElementById('sw-label').textContent = `${VARIANTS[state.variant].k} · ${VARIANTS[state.variant].name}`
	const bar = app.querySelector('.cta-bar, .tabbar')
	app.style.setProperty('--cta-h', `${bar ? bar.offsetHeight : 0}px`)
	bindAfter(name)
	edge()
}

// ——— Navigation: real history entries, View Transitions with an exit, rapid taps land at once ———
let histOk = true, vt = null
function pushHist(step, prev, replace) {
	if (!histOk) return
	try { history[replace ? 'replaceState' : 'pushState']({ step, prev }, '', `#${FLOW[step]}`) } catch { histOk = false }
}
function go(step, { fromHistory = false } = {}) {
	if (step === state.step && state.rendered === step) return
	const from = state.step
	document.documentElement.dataset.dir = from === 5 && step === 6 ? 'root' : step < from ? 'back' : 'forward'
	if (!fromHistory) pushHist(step, from)
	state.step = step
	const swap = () => { render(); window.scrollTo(0, 0) }
	if (document.startViewTransition && !document.hidden) {
		try { vt?.skipTransition() } catch {}
		vt = document.startViewTransition(swap)
		vt.finished.catch(() => {}).finally(() => (vt = null))
	} else swap()
}
function back() {
	const to = state.step === 5 ? 4 : Math.max(0, state.step - 1)
	if (histOk && history.state && history.state.step === state.step && history.state.prev === to) history.back()
	else go(to)
}
addEventListener('popstate', (e) => {
	if (isOpen) closeSheet()
	const step = e.state?.step
	if (typeof step !== 'number') return
	if (step >= 4 && !state.level) return // nothing answered yet (after a restart): stay put
	if (step >= 5 && !state.week) return
	go(step, { fromHistory: true })
})

const edge = () => document.documentElement.classList.toggle('under-bottom', document.documentElement.scrollHeight - scrollY - innerHeight > 1)
addEventListener('scroll', edge, { passive: true })
addEventListener('resize', () => { edge(); const bar = app.querySelector('.cta-bar, .tabbar'); app.style.setProperty('--cta-h', `${bar ? bar.offsetHeight : 0}px`) })

		<p class="small" ${state.level === 'ny' && state.days.size > 4 ? '' : 'hidden'}>Som nybegynner får du høyst 4 økter i uka. Vi velger dagene som gir mest hvile mellom.</p></section>`,

	prefs: () => `
		<h1>Hva slags økter liker du?</h1>
		<p class="lead">Vi bruker dette til å velge hvilke forslag du ser først.</p>

			${PREFS.map((p) => `<button type="button" class="option" data-pref="${p.k}" aria-pressed="${state.prefs.has(p.k)}"><div><b>${p.t}</b><span class="d">${p.d}</span></div><span class="check">${checkSvg}</span></button>`).join('')}
		</div>
		<p class="small" ${state.prefs.has('short') && state.prefs.has('long') ? '' : 'hidden'}>Korte økter og lange turer trekker hver sin vei. Vi holder hverdagsøktene korte og lar langturen være lang.</p>`,

	suggest: () => {
		const list = suggestions()
		const n = list.length
		const h1 = n === 3 ? 'Tre måter å trene på' : n === 2 ? 'To måter å trene på' : 'Én uke som passer'
		const lead = `Du ba om ${hoursTxt(state.hours)} på ${pl(state.days.size, 'dag', 'dager')}.${n > 1 ? ' Ukene følger ulike prinsipper. Velg den som frister mest.' : ''}`
		const collapsed = list.collapsed && n > 0 && list[0].k !== 'mixed' ? `<p class="small">Med disse valgene ble noen av forslagene helt like, så vi viser bare ${n === 1 ? 'ett' : 'to'}.</p>` : ''
		const head = `<h1>${h1}</h1><p class="lead">${lead}</p>${collapsed}`

		if (v === 'A') return head + `<div class="rail${n === 1 ? ' single' : ''}" id="rail" tabindex="0" aria-label="Forslag">${list.map((x) => suggestionCard(x)).join('')}</div>${n > 1 ? `<div class="pager" role="tablist" aria-label="Forslag">${list.map((x, i) => `<button type="button" role="tab" data-page="${i}" class="${i === state.railIndex ? 'on' : ''}" aria-selected="${i === state.railIndex}" aria-label="${PRINCIPLES[x.k].name}"></button>`).join('')}</div>` : ''}`
		if (v === 'B') return head + `<div class="options" role="radiogroup" aria-label="Forslag">${list.map((x) => compareRow(x)).join('')}</div>`

		const o = outlineFor(state.chosen)
		const p = PRINCIPLES[state.chosen]
		const max = o.peak
		return `

	home: () => {
		const v = VARIANTS[state.variant].k
		const week = state.week
		const active = week.filter((x) => x.day >= state.startDay)
		const doneCount = active.filter(isDone).length
		const todays = week.find((x) => x.day === todayIdx)
		const nextUp = week.find((x) => x.day > todayIdx)
		const dateLine = `${DAY_LONG[todayIdx]} ${today.getDate()}. ${MONTH[today.getMonth()]}`
		const head = `<div class="home-head"><div><p class="over">${dateLine}</p><h1>I dag</h1></div><button type="button" class="icon-btn" data-act="adjust"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7M11 2v4M5 10v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Juster</button></div>`
		const preNote = week.some((x) => x.day < state.startDay) ? `<p class="small">Du startet ${DAY_LONG[state.startDay]}, så uka teller fra i dag.</p>` : ''
		let body = ''
		if (v === 'A') {
			body = `${todayCard(todays, nextUp)}

			${nextWeekNote()}`
		} else if (v === 'B') {
			const pct = active.length ? doneCount / active.length : 0
			body = `<div class="card" style="display:flex;align-items:center;gap:14px">${ring(pct)}<div><b class="num" style="font-size:1.125rem">${doneCount} av ${pl(active.length, 'økt', 'økter')}</b><p class="small num">${fmtMin(active.filter(isDone).reduce((a, x) => a + x.min, 0))} av ${fmtMin(active.reduce((a, x) => a + x.min, 0))} denne uka</p></div></div>

		} else {

			${todays ? `<p class="lead">${esc(todays.d)}</p>${todayActions(todays)}` : ''}
			<p class="small num">Denne uka: ${doneCount} av ${pl(active.length, 'økt', 'økter')} gjort.</p>
			<details class="hood"><summary>Se hele uka</summary><div class="hood-body"><div class="week">${DAY.map((_, i) => homeRow(week, i)).join('')}</div>${preNote}</div></details>
			${nextWeekNote()}`
		}
		return head + body
	},
}

const enduranceChosen = () => state.actOrder.filter((k) => actOf(k).kind === 'endurance' && state.acts.has(k))
function mainSport() { return enduranceChosen()[0] ?? null }

function mixBar(by, total) {
	return `<div class="mix" role="img" aria-label="${Math.round((by.easy / total) * 100)} % rolig, ${Math.round((by.mid / total) * 100)} % middels, ${Math.round((by.hard / total) * 100)} % hard">${['easy', 'mid', 'hard'].map((k) => (by[k] ? `<i style="flex:${by[k]};background:var(--${k})"></i>` : '')).join('')}</div>`
}
function weekRows(week) {
	return DAY.map((d, i) => {
		const s = week.find((x) => x.day === i)
		return `<div class="wrow"><span class="dn">${d}</span>${s ? `<span class="t"><span class="dot" style="background:${color(s.act)}"></span><span>${esc(title(s))}<br><span class="small num">${fmtMin(s.min)}</span></span></span><span class="int ${s.int}">${INT[s.int]}</span>` : `<span class="t rest">hvile</span><span></span>`}</div>`
	}).join('')
}
function missingNote(week) {
	const missing = [...state.acts].filter((k) => !week.some((s) => s.act === k)).map((k) => actOf(k).s)
	return missing.length ? `<p>Fikk ikke plass denne uka: ${listFmt(missing)}. Velg flere dager for å få ${missing.length === 1 ? 'det' : 'dem'} med.</p>` : ''
}
function notesBlock(x) {
	const missing = missingNote(x.week)
	const inner = x.notes.map((t) => `<p>${esc(missing ? t.replace(/ Velg flere dager[^.]*\./, '') : t)}</p>`).join('') + missing // say "velg flere dager" once
	return inner ? `<div class="notes">${inner}</div>` : ''
}
const hardTxt = (s) => (s.hard ? `<b>${s.hard}</b> ${s.hard === 1 ? 'hard økt' : 'harde økter'}` : 'ingen harde økter')
function suggestionCard(x) {
	const p = PRINCIPLES[x.k], s = weekStats(x.week)
	return `<article class="card" data-k="${x.k}" style="display:flex;flex-direction:column;gap:12px">
		<div class="badge-row">${x.badge ? `<span class="badge">${x.badge}</span>` : ''}</div>
		<h2>${p.name}</h2>
		<p class="small">${p.why(s)}</p>
		${mixBar(s.by, s.total)}
		<div class="facts num"><span><b>${fmtMin(s.total)}</b> i uka</span><span>${hardTxt(s)}</span></div>
		<div class="week">${weekRows(x.week)}</div>${notesBlock(x)}

// ——— Sheet: 1:1 drag, rubber band, velocity-projected dismiss, interruptible spring ———
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheet-body')
let lastFocus = null, sy = 0, sv = 0, sh = 1, raf = 0, isOpen = false

const project = (v, d = 0.998) => ((v / 1000) * d) / (1 - d)
const rubberband = (o, dim, c = 0.55) => (o * dim * c) / (dim + c * Math.abs(o))

function paint() {
	sheet.style.transform = `translate3d(0, ${sy}px, 0)`
	scrim.style.opacity = String(Math.min(1, Math.max(0, 1 - sy / sh)))
}
// Damping/response spring, mass 1. It always starts from the live position (sy) and velocity (sv).
function springTo(to, { velocity = sv, damping = 1, response = 0.35, done } = {}) {
	cancelAnimationFrame(raf)
	sv = velocity
	if (reduceMotion()) return fadeTo(to, done)
	const k = (2 * Math.PI / response) ** 2, c = (4 * Math.PI * damping) / response
	let last = performance.now()
	const step = (now) => {
		const dt = Math.min(1 / 30, Math.max(0, now - last) / 1000); last = now
		sv += (-k * (sy - to) - c * sv) * dt
		sy += sv * dt
		if (Math.abs(sv) < 4 && Math.abs(sy - to) < 0.5) { sy = to; sv = 0; paint(); raf = 0; done?.(); return }
		paint(); raf = requestAnimationFrame(step)
	}
	raf = requestAnimationFrame(step)
}
// Reduced motion: no travel. The sheet cross-fades in place.
function fadeTo(to, done) {
	const opening = to <= 0
	sy = 0; sheet.style.transform = 'none'
	sheet.style.transition = scrim.style.transition = 'opacity 200ms ease'
	requestAnimationFrame(() => { sheet.style.opacity = scrim.style.opacity = opening ? '1' : '0' })
	setTimeout(() => { sheet.style.transition = scrim.style.transition = ''; if (!opening) sy = sh + 48; done?.() }, 220)
}

function openSheet(html) {
	lastFocus = document.activeElement
	sheetBody.innerHTML = `<div class="grabber" aria-hidden="true"></div>${html}`
	sheetBody.scrollTop = 0
	const wasLive = sheet.classList.contains('live')
	sheet.classList.add('live'); scrim.classList.add('open'); isOpen = true
	hideToast() // never cover the sheet's options
	sheet.classList.toggle('scrolls', sheetBody.scrollHeight > sheetBody.clientHeight + 1)
	sh = sheetBody.getBoundingClientRect().height
	if (!wasLive) { sy = sh + 48; sheet.style.opacity = reduceMotion() ? '0' : '' } // a re-open mid-close starts from where it is
	paint()
	app.inert = true
	document.documentElement.style.overflow = 'hidden'
	springTo(0, { velocity: 0, damping: 1, response: 0.35 })
	requestAnimationFrame(() => sheetBody.querySelector('button:not([aria-disabled="true"])')?.focus({ preventScroll: true }))
}
function closeSheet(velocity = 0) {
	if (!isOpen) return
	isOpen = false; scrim.classList.remove('open')
	app.inert = false
	document.documentElement.style.overflow = ''
	springTo(sh + 48, { velocity, damping: 1, response: 0.3, done: () => { if (!isOpen) sheet.classList.remove('live') } })
	lastFocus?.focus?.({ preventScroll: true })
}
scrim.addEventListener('click', () => closeSheet())
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen) closeSheet() })

// Drag. pointerdown stops the spring, so a sheet caught mid-flight stays under the finger.
const g = { id: null, y0: 0, s0: 0, hist: [], drag: false, moved: false }
sheet.addEventListener('pointerdown', (e) => {
	if (!isOpen || g.id !== null || (e.pointerType === 'mouse' && e.button !== 0)) return // one finger at a time
	if (sheetBody.scrollTop > 0 && !e.target.closest('.grabber')) return // let a scrolled list scroll
	cancelAnimationFrame(raf); raf = 0
	Object.assign(g, { id: e.pointerId, y0: e.clientY, s0: sy, hist: [{ t: e.timeStamp, y: sy }], drag: false, moved: false })
})
window.addEventListener('pointermove', (e) => { // on window: a mouse has no implicit capture before the threshold
	if (e.pointerId !== g.id) return
	const dy = e.clientY - g.y0
	if (!g.drag) {
		if (Math.abs(dy) < 10) return // hysteresis; after this, 1:1
		g.drag = true; g.moved = true
		getSelection()?.removeAllRanges()
		try { sheet.setPointerCapture(e.pointerId) } catch {}
		g.y0 = e.clientY; g.s0 = sy // no jump once the threshold is crossed
	}
	const raw = g.s0 + (e.clientY - g.y0)
	sy = raw < 0 ? rubberband(raw, sh) : raw // resists above the open position
	paint()
	g.hist.push({ t: e.timeStamp, y: sy }); if (g.hist.length > 6) g.hist.shift()
})
function release(e) {
	if (e.pointerId !== g.id) return
	g.id = null
	if (!g.drag) { if (isOpen && sy !== 0) springTo(0); return } // a tap mid-open: keep opening
	const a = g.hist[0], b = g.hist[g.hist.length - 1]
	const v = b.t > a.t ? ((b.y - a.y) / (b.t - a.t)) * 1000 : 0 // px/s over the last few events
	const projected = sy + project(v)
	const dismiss = v > 400 || (v > -400 && projected > sh * 0.5)
	if (dismiss) { closeSheet(v); buzz(8) }
	else springTo(0, { velocity: v, damping: Math.abs(v) > 400 ? 0.8 : 1, response: 0.3 }) // bounce only after a flick
}
window.addEventListener('pointerup', release)
window.addEventListener('pointercancel', release)
// A drag that ends over an option must not choose it
sheet.addEventListener('click', (e) => { if (g.moved) { e.stopPropagation(); e.preventDefault(); g.moved = false } }, true)

// ——— Toast ———
const toastEl = document.getElementById('toast'), toastText = document.getElementById('toast-text'), undoBtn = document.getElementById('toast-undo')
let toastTimer = null, undoFn = null
const hideToast = () => toastEl.classList.remove('show')
const armToast = (ms) => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms) }
function toast(msg, undo) {
	const visible = toastEl.classList.contains('show')
	toastText.textContent = msg; undoFn = undo
	undoBtn.hidden = !undo
	toastEl.classList.add('show')
	if (visible && !reduceMotion()) toastEl.animate([{ transform: 'translate(-50%, 4px)' }, { transform: 'translate(-50%, 0)' }], { duration: 160, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' })
	armToast(undo ? 6000 : 3000) // undo needs time for a thumb to get there
}
toastEl.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') clearTimeout(toastTimer) })
toastEl.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') armToast(2500) })
toastEl.addEventListener('pointerdown', () => clearTimeout(toastTimer))
toastEl.addEventListener('pointerup', () => armToast(2500))
undoBtn.addEventListener('click', () => { undoFn?.(); hideToast() })

// ——— Adjust: each change has a limit, works once per week, and never turns one sport into another ———
const ahead = (s) => s.day >= todayIdx && s.day >= state.startDay && !isDone(s)
function adjustOptions() {
	const left = state.week.filter(ahead)
	const none = !left.length ? 'Ingen økter igjen denne uka.' : ''
	const removable = state.week.filter((s) => ahead(s) && s.day > todayIdx).length || left.length
	return [
		{ k: 'lighter', t: 'Uka er for tung', d: 'Kortere økter resten av uka, ingen harde.', off: none || (state.adj.lighter ? 'Allerede gjort lettere denne uka.' : '') },
		{ k: 'less-time', t: 'Jeg har mindre tid denne uka', d: 'Fjerner den korteste økta som gjenstår.', off: removable ? '' : 'Ingen økter igjen å fjerne.' },
		{ k: 'harder', t: 'Jeg vil ha mer', d: 'Litt lengre økter resten av uka.', off: none || (state.adj.harder ? 'Allerede litt lengre denne uka. Mer enn det blir neste uke.' : '') },
		{ k: 'switch', t: 'Bytt treningsform', d: 'Se forslagene igjen og velg en annen uke.', off: '' },
		{ k: 'advanced', t: 'Avansert', d: 'Sesong, filosofi, ukemål, soner og terskler. Alt som finnes i dag.', off: '' },
	]
}
function adjustSheet() {
	openSheet(`<h2 id="sheet-title">Juster</h2><p class="small">Si hva som skjer, så ordner appen resten.</p>
		<div class="options" style="margin-top:8px">
			${adjustOptions().map((o) => `<button type="button" class="option" data-adj="${o.k}" ${o.off ? 'aria-disabled="true"' : ''}><div><b>${o.t}</b><span class="d">${o.off || o.d}</span></div></button>`).join('')}
		</div>`)
}
function adjust(kind) {
	if (kind === 'advanced') { closeSheet(); toast('Her åpnes dagens Sesong-side med alt det avanserte'); return }
	if (kind === 'switch') { closeSheet(); go(4); return }
	const before = state.week.map((s) => ({ ...s })), adjBefore = { ...state.adj }
	let msg = ''
	if (kind === 'lighter') {
		state.week = state.week.map((s) => {
			if (!ahead(s)) return s
			const toEasy = isEndurance(s) && s.int !== 'easy' && s.w !== 'long'
			const w = toEasy ? 'easy' : s.w
			const [lo] = limits(w)
			return { ...s, ...(toEasy ? { w, t: WORK.easy.t, int: 'easy', d: WORK.easy.d } : {}), min: Math.max(lo, Math.round((s.min * 0.8) / 5) * 5) }
		})
		state.adj.lighter = true
		msg = 'Resten av uka er gjort lettere'
	}
	if (kind === 'harder') {
		state.week = state.week.map((s) => (ahead(s) ? { ...s, min: Math.min(limits(s.w)[1], Math.round((s.min * 1.15) / 5) * 5) } : s))
		state.adj.harder = true
		msg = 'Resten av uka er litt lengre'
	}
	if (kind === 'less-time') {
		const later = state.week.filter((s) => ahead(s) && s.day > todayIdx)
		const left = (later.length ? later : state.week.filter(ahead)).sort((a, b) => a.min - b.min)
		if (!left.length) return
		state.week = state.week.filter((s) => s !== left[0]); msg = `${title(left[0])} på ${DAY_LONG[left[0].day]} er fjernet`
	}
	closeSheet(); render()
	toast(msg, () => { state.week = before; state.adj = adjBefore; render() })
}

// ——— Events ———
function bindAfter(name) {
	if (name !== 'suggest' || VARIANTS[state.variant].k !== 'A') return
	const rail = document.getElementById('rail')
	if (!rail || rail._bound) return
	rail._bound = true
	const w = () => rail.firstElementChild.offsetWidth + 12
	const count = () => rail.children.length
	rail.scrollLeft = state.railIndex * w()
	const sync = (i) => {
		state.railIndex = i
		app.querySelectorAll('.pager button').forEach((el, j) => { el.classList.toggle('on', j === i); el.setAttribute('aria-selected', String(j === i)) })
		const cta = app.querySelector('[data-act="choose-rail"]'), k = rail.children[i]?.dataset.k
		if (cta && k) cta.textContent = `Velg «${PRINCIPLES[k].name}»`
	}
	rail.addEventListener('scroll', () => { const i = Math.max(0, Math.min(count() - 1, Math.round(rail.scrollLeft / w()))); if (i !== state.railIndex) sync(i) }, { passive: true })
	rail._to = (i) => rail.scrollTo({ left: Math.max(0, Math.min(count() - 1, i)) * w(), behavior: reduceMotion() ? 'auto' : 'smooth' })
	rail.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.stopPropagation(); e.preventDefault(); rail._to(state.railIndex + (e.key === 'ArrowRight' ? 1 : -1)) } })
	// Mouse: 1:1 drag, rubber band at the ends, projected snap (touch uses native scroll-snap)
	let m = null
	rail.addEventListener('pointerdown', (e) => {
		if (e.pointerType !== 'mouse' || e.button !== 0) return
		m = { x: e.clientX, s: rail.scrollLeft, hist: [{ t: e.timeStamp, x: e.clientX }] }
		rail.style.scrollSnapType = 'none'; rail.setPointerCapture(e.pointerId)
	})
	rail.addEventListener('pointermove', (e) => {
		if (!m) return
		const max = rail.scrollWidth - rail.clientWidth, want = m.s - (e.clientX - m.x)
		rail.scrollLeft = want
		const over = want < 0 ? want : want > max ? want - max : 0
		rail.style.transform = over ? `translateX(${-rubberband(over, rail.clientWidth)}px)` : ''
		m.hist.push({ t: e.timeStamp, x: e.clientX }); if (m.hist.length > 6) m.hist.shift()
	})
	const up = () => {
		if (!m) return
		const a = m.hist[0], b = m.hist[m.hist.length - 1]
		const v = b.t > a.t ? ((b.x - a.x) / (b.t - a.t)) * 1000 : 0
		const target = Math.round((rail.scrollLeft - project(v, 0.99)) / w())
		rail.style.transition = 'transform 300ms var(--ease-out)'; rail.style.transform = ''
		setTimeout(() => (rail.style.transition = ''), 300)
		rail._to(target); m = null
		setTimeout(() => (rail.style.scrollSnapType = ''), 450)
	}
	rail.addEventListener('pointerup', up)
	rail.addEventListener('pointercancel', up)
}

function soloShow(delta) {
	const solo = document.getElementById('solo'), list = suggestions()
	state.soloIndex = (state.soloIndex + delta + list.length) % list.length
	const i = state.soloIndex
	const swap = () => { solo.innerHTML = suggestionCard(list[i]); const c = document.getElementById('solo-count'); if (c) c.textContent = `Forslag ${i + 1} av ${list.length}` }
	solo.getAnimations().forEach((a) => a.cancel())
	if (reduceMotion()) { swap(); solo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); return }
	const dx = delta > 0 ? 24 : -24
	const out = solo.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-dx}px)` }], { duration: 150, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' })
	out.onfinish = () => { swap(); out.cancel(); solo.animate([{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }) }
}

function choose(k) {
	state.chosen = k
	state.week = buildWeek(k)
	state.startDay = todayIdx // the week counts from today; nothing before it is marked done
	state.done = new Set()
	state.adj = {}
	buzz()
	go(5)
}

function notReady() {
	const name = FLOW[state.step]
	if (name === 'level') return 'Velg nivået ditt først.'
	if (name === 'acts') return !state.acts.size ? 'Velg minst én aktivitet.' : 'Velg minst én dag.'
	if (name === 'suggest') return 'Trykk på en av ukene først.'
	return ''
}

function resetAll() {
	Object.assign(state, { level: null, hours: null, acts: new Set(), prefs: new Set(), days: new Set(), daysTouched: false, actOrder: [], railIndex: 0, soloIndex: 0, expanded: null, chosen: null, week: null, startDay: 0, done: new Set(), adj: {} })
}

document.addEventListener('touchstart', () => {}, { passive: true }) // lets :active fire on iOS Safari

document.addEventListener('click', (e) => {
	const t = e.target.closest('button')
	if (!t) return
	const d = t.dataset
	if (d.sw) {
		if (d.sw === 'restart') { closeSheet(); resetAll(); if (state.step === 0) render(); else go(0); return }
		state.variant = (state.variant + (d.sw === 'next' ? 1 : VARIANTS.length - 1)) % VARIANTS.length
		render(); return
	}
	if (t.getAttribute('aria-disabled') === 'true') {
		if (d.adj) return
		const need = notReady(); if (need) { toast(need); buzz(8) }
		return
	}
	if (d.level) {
		const l = LEVELS.find((x) => x.k === d.level)
		state.level = l.k; state.hours = l.h
		if (!state.daysTouched) state.days = new Set(l.days)
		render(); return
	}
	if (d.hours) { state.hours = Math.min(MAX_H, Math.max(MIN_H, state.hours + Number(d.hours))); render(); return }
	if (d.actK) {
		if (state.acts.has(d.actK)) { state.acts.delete(d.actK); state.actOrder = state.actOrder.filter((k) => k !== d.actK) }
		else { state.acts.add(d.actK); state.actOrder.push(d.actK) }
		render(); return
	}
	if (d.day) { const i = Number(d.day); state.daysTouched = true; state.days.has(i) ? state.days.delete(i) : state.days.add(i); render(); return }
	if (d.pref) { state.prefs.has(d.pref) ? state.prefs.delete(d.pref) : state.prefs.add(d.pref); render(); return }
	if (d.cmp) { state.expanded = state.expanded === d.cmp ? null : d.cmp; render(); return }
	if (d.page) { document.getElementById('rail')?._to(Number(d.page)); return }
	if (d.done) {
		const day = Number(d.done)
		const was = state.done.has(day)
		was ? state.done.delete(day) : state.done.add(day)
		if (!was) { state.justDone = day; buzz() }
		render()
		if (!was) toast('Økta er markert som gjort', () => { state.done.delete(day); render() })
		return
	}
	if (d.adj) { adjust(d.adj); return }
	switch (d.act) {
		case 'next': go(state.step + 1); break
		case 'back': back(); break
		case 'demo': demo(); break
		case 'choose-rail': { const list = suggestions(); choose(list[Math.min(state.railIndex, list.length - 1)].k); break }
		case 'choose-cmp': choose(state.expanded); break
		case 'choose-solo': { const list = suggestions(); choose(list[state.soloIndex % list.length].k); break }
		case 'solo-next': soloShow(1); break
		case 'solo-prev': soloShow(-1); break
		case 'adjust': adjustSheet(); break
		case 'plan-tab': toast('Plan: sesongen som én enkel kurve, med «Avansert» for alt annet'); break
		case 'me-tab': toast('Meg: profil, tilkoblinger og innstillinger'); break
	}
})

document.addEventListener('keydown', (e) => {
	if (e.target.closest?.('input, textarea, [contenteditable], #rail')) return
	if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
		if (isOpen) return
		state.variant = (state.variant + (e.key === 'ArrowRight' ? 1 : VARIANTS.length - 1)) % VARIANTS.length
		render()
	}
})

function demo() {
	state.level = 'mosjon'; state.hours = 6
	state.acts = new Set(['run', 'strength', 'climb']); state.actOrder = ['run', 'strength', 'climb']
	state.days = new Set([0, 1, 3, 5, 6]); state.daysTouched = true; state.prefs = new Set(['long', 'intervals'])
	go(4)
}

pushHist(0, null, true)
render()
</script>
