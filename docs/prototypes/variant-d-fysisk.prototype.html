<!--
  PROTOTYPE — THROWAWAY. Variant D · Fysisk. Same four plain questions and the
  same week generation as enkel-start (variant A), made physical: the three
  suggestions are a deck you drag, flick and lift (flick up to choose); the
  chosen card's week travels into "Planen er klar" and on into I dag; I dag is
  a day pager with today in the middle; Juster is a sheet that follows the
  finger. Every moving thing is a vanilla rAF spring that starts from where it
  is on screen, inherits the finger's velocity and can be grabbed mid-flight.
  Reduced motion: cross-fades, no travel. Nothing is saved.

// ——— Physics: one rAF clock, springs in Apple's terms (response, damping ratio) ———
// Every spring starts from its current on-screen value and keeps its velocity when it is
// re-targeted, so anything moving can be grabbed and thrown somewhere else mid-flight.
const RM = matchMedia('(prefers-reduced-motion: reduce)')
const reduced = () => RM.matches
const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
// Where a release at v px/s would come to rest (Apple's Designing Fluid Interfaces projection).
const project = (v, rate = 0.998) => ((v / 1000) * rate) / (1 - rate)
// Progressive resistance past a boundary: the further past, the less it follows.
const rubber = (o, dim, c = 0.55) => (o * dim * c) / (dim + c * Math.abs(o))

const running = new Set()
let rafId = 0, lastT = 0
function frame(t) {
	const dt = clamp((t - lastT) / 1000, 0, 1 / 20) || 1 / 60
	lastT = t
	for (const s of [...running]) s.tick(dt)
	rafId = running.size ? requestAnimationFrame(frame) : 0
}
class Spring {
	constructor(v, paint, eps = 0.1) { this.v = v; this.vel = 0; this.target = v; this.paint = paint; this.eps = eps }
	get moving() { return running.has(this) }
	// Hold it where it is (a finger caught it). Velocity is kept for whoever re-targets it.
	stop() { running.delete(this); this.onRest = null }
	set(v) { this.stop(); this.v = v; this.target = v; this.vel = 0; this.paint(v) }
	to(target, { velocity = this.vel, response = 0.4, damping = 1, onRest = null } = {}) {
		this.target = target; this.vel = velocity; this.onRest = onRest
		this.k = (2 * Math.PI / response) ** 2 // stiffness, unit mass
		this.c = (4 * Math.PI * damping) / response // damping ratio 1 = critically damped, no overshoot
		running.add(this)
		if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame) }
	}
	tick(dt) {
		const n = Math.ceil(dt * 240), h = dt / n
		for (let i = 0; i < n; i++) {
			this.vel += (-this.k * (this.v - this.target) - this.c * this.vel) * h
			this.v += this.vel * h
		}
		if (Math.abs(this.v - this.target) < this.eps && Math.abs(this.vel) < this.eps * 10) {
			this.v = this.target; this.vel = 0; running.delete(this)
			this.paint(this.v)
			const f = this.onRest; this.onRest = null; f?.()
			return
		}
		this.paint(this.v)
	}
}
// Reduced motion: no travel, a short cross-fade around the change instead.
function fadeSwap(el, apply) {
	el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: 'ease' }).onfinish = () => {
		apply()
		el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'ease' })
	}
}

// One drag recogniser: nothing moves until 10px of travel picks an axis, then the element
// follows the finger 1:1 from where it was grabbed, with pointer capture so it keeps tracking
// outside its bounds. Release hands over the velocity of the last 100ms.
let suppressClickUntil = 0
document.addEventListener('click', (e) => { if (performance.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault() } }, true)
function drag(el, o) {
	let g = null
	el.addEventListener('pointerdown', (e) => {
		if (g || (e.pointerType === 'mouse' && e.button !== 0)) return
		g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, axis: null, samples: [{ x: e.clientX, y: e.clientY, t: e.timeStamp }] }
		o.down?.(e)
	})
	el.addEventListener('pointermove', (e) => {
		if (!g || e.pointerId !== g.id) return
		const dx = e.clientX - g.x0, dy = e.clientY - g.y0
		g.samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp })
		while (g.samples.length > 2 && e.timeStamp - g.samples[0].t > 100) g.samples.shift()
		if (g.axis === null) {
			if (Math.hypot(dx, dy) < 10) return
			const axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'
			if (!o.axes.includes(axis)) { g.axis = 'none'; return }
			g.axis = axis
			try { el.setPointerCapture(e.pointerId) } catch {}
			o.start?.(axis)
		}
		if (g.axis === 'none') return
		e.preventDefault()
		o.move(dx, dy, g.axis)
	})
	const end = (e, cancelled) => {
		if (!g || e.pointerId !== g.id) return
		const t = e.timeStamp
		const recent = g.samples.filter((s) => t - s.t <= 100)
		let vx = 0, vy = 0
		if (!cancelled && recent.length >= 2) {
			const a = recent[0], b = recent[recent.length - 1], dt = (b.t - a.t) / 1000
			if (dt > 0) { vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt }
		}
		const { axis } = g
		const dx = e.clientX - g.x0, dy = e.clientY - g.y0
		g = null
		if (axis === 'x' || axis === 'y') { suppressClickUntil = performance.now() + 350; o.end({ vx, vy, dx, dy, axis }) }
		else o.release?.(e, cancelled || axis === 'none')
	}
	el.addEventListener('pointerup', (e) => end(e, false))
	el.addEventListener('pointercancel', (e) => end(e, true))
	el.addEventListener('lostpointercapture', (e) => { if (g && g.axis && g.axis !== 'none') end(e, true) })
}

// ——— Week generation: the same rules every principle card, the plan and I dag read ———
const WORK = {
	easy: { t: 'Rolig', int: 'easy', wt: 0.8, d: 'Rolig tempo hele veien. Du skal kunne prate.' },
	long: { t: 'Langtur', int: 'easy', wt: 1.6, d: 'Lang og rolig. Ta med drikke.' },
	intervals: { t: 'Intervaller', int: 'hard', wt: 1, d: 'Varm opp, så 4 × 4 min hardt med 3 min rolig mellom.' },
	threshold: { t: 'Jevnt hardt', int: 'mid', wt: 1, d: '3 × 10 min kontrollert hardt. Pusten skal være tung, men jevn.' },
	tempo: { t: 'Tempo', int: 'mid', wt: 1, d: '20 min i komfortabelt hardt tempo midt i økta.' },
	strength: { t: 'Styrke', int: 'mid', d: 'Helkropp: knebøy, markløft, press og kjerne. 3 runder.' },
	climb: { t: 'Klatring', int: 'mid', d: 'Buldring eller tau. Varm opp fingrene godt.' },
	yoga: { t: 'Bevegelighet', int: 'easy', d: 'Rolig yoga for hofter og rygg.' },
}

function principlesFor() {
	const keys = state.level === 'ny' ? ['base', 'polarized', 'classic'] : ['polarized', 'threshold', 'classic']
	const score = (k) => {
		let s = 0
		if (state.prefs.has('intervals') && k === 'polarized') s += 2
		if (state.prefs.has('threshold') && k === 'threshold') s += 2
		if (state.prefs.has('long') && (k === 'polarized' || k === 'base')) s += 1
		if (state.prefs.has('surprise') && k === 'classic') s += 2
		if (state.prefs.has('short') && k === 'threshold') s += 1
		return s
	}
	return keys.map((k) => ({ k, s: score(k) })).sort((a, b) => b.s - a.s).map((x) => x.k)
}

function buildWeek(pk) {
	const days = [...state.days].sort((a, b) => a - b)
	const n = days.length
	const total = Math.round(state.hours * 60)
	const endurance = enduranceChosen()
	const short = state.prefs.has('short')
	// One of each chosen activity first, so nothing the athlete asked for goes missing; a
	// second strength or climbing day only when the week has room for it.
	const strength = { w: 'strength', act: 'strength', min: 45 }
	const climb = { w: 'climb', act: 'climb', min: short ? 60 : 90 }
	const wanted = []
	if (state.acts.has('strength')) wanted.push(strength)
	if (state.acts.has('climb')) wanted.push(climb)
	if (state.acts.has('yoga')) wanted.push({ w: 'yoga', act: 'yoga', min: 30 })
	if (state.acts.has('strength') && state.level !== 'ny' && n >= 5) wanted.push({ ...strength })
	if (state.acts.has('climb') && state.level === 'konk' && n >= 6) wanted.push({ ...climb })
	const room = n - (endurance.length ? Math.min(2, n) : 0)
	const others = wanted.slice(0, Math.max(0, room))

	const slots = endurance.length ? n - others.length : 0
	let kinds = []
	if (slots > 0) {
		const hardCount = pk === 'threshold' ? (slots >= 3 ? 2 : 1) : slots >= 2 ? 1 : 0
		const hardKind = pk === 'threshold' ? 'threshold' : pk === 'base' ? 'tempo' : 'intervals'
		for (let i = 0; i < hardCount; i++) kinds.push(hardKind)
		if (pk === 'classic' && slots >= 4) kinds.push('tempo')
		if (pk === 'base' && state.level !== 'ny' && slots >= 4) kinds.push('tempo')
		if (slots - kinds.length >= 1 && !(short && slots < 3)) kinds.push(short ? 'easy' : 'long')
		while (kinds.length < slots) kinds.push('easy')
		kinds = kinds.slice(0, slots)
	}
	const otherMin = others.reduce((s, o) => s + o.min, 0)
	const budget = Math.max(total - otherMin, slots * 25)
	const weightSum = kinds.reduce((s, k) => s + WORK[k].wt, 0) || 1
	const endSessions = kinds.map((k, i) => {
		let min = Math.round((budget * WORK[k].wt) / weightSum / 5) * 5
		min = Math.max(state.level === 'ny' ? 20 : 30, Math.min(short ? 45 : 180, min))
		// The main sport takes the hard sessions and the long one; the others share the easy days.
		const act = WORK[k].int !== 'easy' || k === 'long' || endurance.length === 1 ? endurance[0] : endurance[(i % endurance.length)]
		return { w: k, act, min }
	})

	// Place: the long one last, hard ones spread with an easy day between, the rest fills.
	const placed = new Array(n).fill(null)
	const longI = endSessions.findIndex((s) => s.w === 'long')
	if (longI >= 0) placed[n - 1] = endSessions.splice(longI, 1)[0]
	const hard = endSessions.filter((s) => WORK[s.w].int !== 'easy')
	const rest = endSessions.filter((s) => WORK[s.w].int === 'easy')
	const free = () => placed.map((p, i) => (p ? -1 : i)).filter((i) => i >= 0)
	hard.forEach((s, j) => {
		const f = free()
		const target = Math.round(((j + 1) * n) / (hard.length + 1)) - 1
		const pick = f.reduce((best, i) => (Math.abs(i - target) < Math.abs(best - target) ? i : best), f[0])
		placed[pick] = s
	})
	;[...others, ...rest].forEach((s) => { const f = free(); if (f.length) placed[f[0]] = s })
	return placed.map((s, i) => (s ? { ...s, day: days[i], ...WORK[s.w], d: WORK[s.w].d } : null)).filter(Boolean)
}

function weekStats(week) {
	const total = week.reduce((s, x) => s + x.min, 0)
	const by = { easy: 0, mid: 0, hard: 0 }
	week.forEach((x) => (by[x.int] += x.min))
	return { total, by, count: week.length, hard: week.filter((x) => x.int === 'hard' || x.w === 'threshold').length }
}
function title(s) {
	if (s.act === 'strength' || s.act === 'climb' || s.act === 'yoga') return s.t
	return `${s.t} · ${actOf(s.act).t.toLowerCase()}`
}

// ——— Outline: what is built behind the chosen card ———
function outlineFor(pk) {
	const weeks = 12
	const p = PRINCIPLES[pk]
	const rhythm = 4
	const climb = pk === 'base' ? 0.04 : 0.06
	const series = []
	let block = 0
	for (let i = 0; i < weeks; i++) {
		const pos = i % rhythm
		if (pos === 0 && i > 0) block++
		const h = state.hours * (1 + climb * (block * (rhythm - 1) + Math.min(pos, rhythm - 2)))
		series.push(pos === rhythm - 1 ? { h: h * 0.7, light: true } : { h, light: false })
	}
	const tracks = []
	const endurance = enduranceChosen().map(actOf)
	if (endurance.length) tracks.push({ name: 'Utholdenhet', unit: 'timer', start: fmtH(state.hours), sports: endurance.map((a) => a.t).join(', ') })
	if (state.acts.has('strength')) tracks.push({ name: 'Styrke', unit: 'økter', start: state.level === 'ny' ? '1 / uke' : '2 / uke' })
	if (state.acts.has('climb')) tracks.push({ name: 'Klatring', unit: 'timer', start: 'enkel aktivitet, teller i ukas timer' })
	if (state.acts.has('yoga')) tracks.push({ name: 'Bevegelighet', unit: 'økter', start: 'når det er plass' })
	return { family: p.family, familyKey: p.familyKey, weeks, series, tracks, peak: Math.max(...series.map((s) => s.h)) }
}

// ——— Rendering ———
const app = document.getElementById('app')
const FLOW = ['intro', 'level', 'acts', 'prefs', 'suggest', 'ready', 'home']

function render(opts = {}) {
	const name = FLOW[state.step]
	const html = SCREENS[name]()
	const anim = state.step === state.prevStep ? '' : opts.fade ? ' enter fade' : ` enter${state.step < state.prevStep ? ' back' : ''}`
	app.innerHTML = `<div class="screen${anim}">${html}</div>${CTA[name] ? CTA[name]() : ''}`
	state.prevStep = state.step
	bindAfter(name)
}
function go(step, opts) { state.prevStep = state.step; state.step = step; render(opts); window.scrollTo({ top: 0 }) }

function flowTop(i) {
	const pct = i / 4
	return `<div class="top"><button type="button" class="back" data-act="back" aria-label="Tilbake">${chevron(-1)}</button><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${i}" aria-label="Steg ${i} av 4"><i style="transform:scaleX(${pct})"></i></div><span class="small num">${i} av 4</span></div>`
}
const ctaBar = (inner) => `<div class="cta-bar"><div>${inner}</div></div>`

const CTA = {

const enduranceChosen = () => state.actOrder.filter((k) => actOf(k).kind === 'endurance' && state.acts.has(k))
function mainSport() { return enduranceChosen()[0] ?? null }

function mixBar(by, total) {
	return `<div class="mix" role="img" aria-label="${Math.round((by.easy / total) * 100)} % rolig, ${Math.round((by.mid / total) * 100)} % middels, ${Math.round((by.hard / total) * 100)} % hard">${['easy', 'mid', 'hard'].map((k) => (by[k] ? `<i style="flex:${by[k]};background:var(--${k})"></i>` : '')).join('')}</div>`
}
function weekRows(week) {
	return DAY.map((d, i) => {
		const s = week.find((x) => x.day === i)
		return `<div class="wrow"><span class="dn">${d}</span>${s ? `<span class="t"><span class="dot" style="background:${color(s.act)}"></span><span>${esc(title(s))}</span></span><span class="m">${fmtMin(s.min)} · <span class="int ${s.int}">${INT[s.int]}</span></span>` : `<span class="t rest">hvile</span><span></span>`}</div>`
	}).join('')
}
function missingNote(week) {
	const missing = [...state.acts].filter((k) => !week.some((s) => s.act === k)).map((k) => actOf(k).t.toLowerCase())
	return missing.length ? `<p class="small">Fikk ikke plass denne uka: ${missing.join(' og ')}. Velg en dag til, så kommer det med.</p>` : ''
}
function suggestionCard(k, best, i, n) {
	const p = PRINCIPLES[k], week = buildWeek(k), s = weekStats(week)
	return `<article class="card deck-card" data-k="${k}" role="group" aria-roledescription="forslag" aria-label="Forslag ${i + 1} av ${n}: ${p.name}">
		<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:24px">${best ? '<span class="badge">Passer deg best</span>' : ''}<span class="small">${p.family}</span></div>
		<h2>${p.name}</h2>

		${mixBar(s.by, s.total)}
		<div class="facts num"><span><b>${fmtMin(s.total)}</b> i uka</span><span><b>${s.count}</b> økter</span><span><b>${s.hard}</b> ${s.hard === 1 ? 'hard' : 'harde'}</span></div>
		<div class="rows">${weekRows(week)}</div>${missingNote(week)}
	</article>`
}
function hood(o) {
	const pattern = state.week.map((s) => `${DAY[s.day]}: ${s.w}${s.act !== s.w ? `/${s.act}` : ''} ${s.min}m`).join('\n')
	return `<details class="hood"><summary>Under panseret</summary><div class="hood-body">
		<p class="small">Dette er planen appen bygger av svarene dine. Den bruker den hver gang en ny uke lages. Du trenger aldri å se den, men den ligger her.</p>
		<dl class="kv">
			<dt>Filosofi</dt><dd>${o.family}</dd>
			<dt>Lengde</dt><dd>Åpen, uten sluttdato. Her vises de første ${o.weeks} ukene.</dd>
			<dt>Rytme</dt><dd>3 uker opp, 1 lett</dd>
			<dt>Spor</dt><dd>${o.tracks.map((t) => `${t.name} (${t.unit}${t.sports ? `: ${t.sports}` : ''}), start ${t.start}`).join('<br>')}</dd>
			<dt>Nivå</dt><dd>${LEVELS.find((l) => l.k === state.level).t}</dd>
			<dt>Ønsker</dt><dd>${[...state.prefs].map((k) => PREFS.find((p) => p.k === k).t).join(', ') || 'ingen'}</dd>
		</dl>
		<p class="over">Ukemønster</p><div class="code">${esc(pattern)}</div>
		<p class="over">Timer per uke</p><div class="code">${o.series.map((s, i) => `uke ${String(i + 1).padStart(2)}  ${fmtH(s.h).padStart(4)} t${s.light ? '  lett' : ''}`).join('\n')}</div>
	</div></details>`
}
const isDone = (s) => state.done.has(s.day)
function todayActions(s) {
	return isDone(s)
		? `<div class="row-actions"><button type="button" class="btn btn-quiet" data-done="${s.day}">Angre «gjort»</button></div>`
		: `<div class="row-actions"><button type="button" class="btn btn-primary" data-done="${s.day}">Gjort</button><button type="button" class="btn btn-quiet" data-act="adjust">Bytt eller flytt</button></div>`
}
function dayName(i) {
	if (i === todayIdx) return 'I dag'
	if (i === todayIdx - 1) return 'I går'
	if (i === todayIdx + 1) return 'I morgen'
	return cap(DAY_LONG[i])
}
function dateOf(i) {
	const d = new Date(today); d.setDate(today.getDate() + i - todayIdx)
	return `${DAY_LONG[i]} ${d.getDate()}. ${MONTH[d.getMonth()]}`
}
function dayPage(week, i) {
	const s = week.find((x) => x.day === i)
	const cls = `card page${i === todayIdx ? ' is-today' : ''}`
	const head = `<p class="over">${i === todayIdx || Math.abs(i - todayIdx) === 1 ? `${dayName(i)} · ` : ''}${dateOf(i)}</p>`
	if (!s) return `<article class="${cls}" data-page="${i}" role="group" aria-roledescription="dag" aria-label="${dayName(i)}">${head}<h2>Hviledag</h2><p class="small">Ingen økt. Det er når du hviler at kroppen blir sterkere.</p></article>`
	let foot = ''
	if (i === todayIdx) foot = todayActions(s)
	else if (i < todayIdx) foot = `<div class="row-actions"><button type="button" class="btn btn-quiet" data-done="${s.day}">${isDone(s) ? 'Angre «gjort»' : 'Marker som gjort'}</button></div>`
	else foot = `<p class="small" style="margin-top:auto">Kommer ${DAY_LONG[i]}. Du kan flytte den under Juster.</p>`
	return `<article class="${cls}" data-page="${i}" role="group" aria-roledescription="dag" aria-label="${dayName(i)}">${head}
		<div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${color(s.act)}"></span><span class="small">${actOf(s.act).t}</span><span class="int ${s.int}" style="margin-left:auto">${INT[s.int]}</span></div>
		<h2>${esc(s.t)}${isDone(s) ? ' ✓' : ''}</h2><p class="num" style="font-weight:600">${fmtMin(s.min)}${i < todayIdx && !isDone(s) ? ' · <span class="small">ikke gjort</span>' : ''}</p><p class="small">${esc(s.d)}</p>${foot}</article>`
}
function homeRow(week, i) {
	const s = week.find((x) => x.day === i)
	const cls = i === todayIdx ? 'wrow today-row' : 'wrow'
	const label = `aria-label="Vis ${dayName(i).toLowerCase()}"`
	if (!s) return `<button type="button" class="${cls}" data-goday="${i}" ${label}><span class="dn">${DAY[i]}</span><span class="t rest">hvile</span><span></span><span></span></button>`
	const mark = isDone(s) ? `<span class="done-mark">${checkSvg}</span>` : i < todayIdx ? `<span class="small">ikke gjort</span>` : `<span class="todo-mark"></span>`
	return `<button type="button" class="${cls}" data-goday="${i}" ${label}><span class="dn">${DAY[i]}</span><span class="t"><span class="dot" style="background:${color(s.act)}"></span><span>${esc(title(s))}</span></span><span class="m">${fmtMin(s.min)}</span>${mark}</button>`
}
function nextWeekNote() {
	return `<div class="note"><span aria-hidden="true">↻</span><span>Neste uke legges ut søndag kveld, tilpasset hvordan denne uka gikk.</span></div>`
}

// ——— The deck ———
// One continuous position p drives every card: p = 1.4 means card 1 is 40% of the way off to the
// left and card 2 is 60% of the way up from under it. A second spring lifts the top card.
let deckPaint = () => {}
const deckX = new Spring(0, () => deckPaint(), 0.0005)
const deckY = new Spring(0, () => deckPaint(), 0.2)
const LIFT = 110 // how far up the top card has to travel (or be thrown) to be chosen
let deckMeasure = null

function bindDeck() {
	const deck = document.getElementById('deck')
	const cards = [...deck.querySelectorAll('.deck-card')]
	const n = cards.length
	const dots = [...document.querySelectorAll('.dotbtn')]
	const hint = document.getElementById('deck-hint')
	let W = 1, H = 1, top = -1, armed = null
	deckX.stop(); deckY.stop()
	deckX.v = deckX.target = state.deckIndex; deckY.v = deckY.target = 0
	deckMeasure = () => {
		cards.forEach((c) => (c.style.height = 'auto'))
		H = Math.max(...cards.map((c) => c.offsetHeight))
		cards.forEach((c) => (c.style.height = `${H}px`))
		deck.style.height = `${H + 28}px`
		W = deck.offsetWidth + 24
		deckPaint()
	}
	deckPaint = () => {
		const p = deckX.v, lift = deckY.v
		const cur = clamp(Math.round(p), 0, n - 1)
		cards.forEach((el, i) => {
			const d = i - p
			let x = 0, y = 0, s = 1, r = 0, o = 1, z
			if (d < 0) { x = d * W; r = Math.max(d, -1) * 5; z = 300 + Math.round(d * 10) } // thrown off to the left, tipping the way it goes
			else { const k = Math.min(d, 3); y = k * 13; s = 1 - k * 0.05; o = d > 2 ? clamp(3 - d, 0, 1) : 1; z = 200 - Math.round(d * 10) } // waiting underneath
			if (i === cur) { y += lift; s *= 1 + clamp(-lift / 4000, -0.015, 0.03) }
			el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`
			el.style.opacity = o
			el.style.zIndex = z
			el.style.visibility = d < -1.25 || d > 3 ? 'hidden' : ''
		})
		if (cur !== top) {
			top = cur; state.deckIndex = cur
			cards.forEach((el, i) => (el.inert = i !== cur))
			dots.forEach((b, i) => b.setAttribute('aria-current', String(i === cur)))
		}
		const a = lift < -LIFT ? 2 : lift < -12 ? 1 : 0
		if (a !== armed) {
			armed = a
			hint.textContent = ['Sveip for å bla · dra opp for å velge', 'Dra helt opp for å velge', 'Slipp for å velge'][a]
			hint.classList.toggle('armed', a === 2)
		}
	}
	deckMeasure()

	let baseP = 0, baseY = 0
	drag(deck, {
		axes: ['x', 'y'],
		down: () => { deckX.stop(); deckY.stop() }, // catch it mid-flight, right where it is
		start: (axis) => {
			baseP = deckX.v; baseY = deckY.v
			if (axis === 'y') deckX.to(Math.round(clamp(baseP, 0, n - 1)), { response: 0.3 }) // lifting settles the stack under it
		},
		move: (dx, dy, axis) => {
			if (reduced()) return
			if (axis === 'x') {
				const raw = baseP - dx / W
				const over = raw < 0 ? raw : raw > n - 1 ? raw - (n - 1) : 0
				deckX.set(over ? (raw < 0 ? 0 : n - 1) + rubber(over * W, W) / W : raw)
			} else {
				const raw = baseY + dy
				deckY.set(raw > 0 ? rubber(raw, H) : raw) // it lifts freely; pushing it down meets resistance
			}
		},
		end: ({ vx, vy, dx, dy, axis }) => {
			if (reduced()) {
				if (axis === 'x' && (Math.abs(dx) > 40 || Math.abs(vx) > 400)) deckGo(state.deckIndex + (dx < 0 ? 1 : -1))
				if (axis === 'y' && (dy < -60 || vy < -600)) chooseDeck(0)
				return
			}
			if (axis === 'x') {
				const from = Math.round(clamp(baseP, 0, n - 1))
				const projected = deckX.v - project(vx) / W
				const target = clamp(Math.round(projected), Math.max(0, from - 1), Math.min(n - 1, from + 1))
				const flick = Math.abs(vx) > 400
				deckX.to(target, { velocity: -vx / W, response: 0.42, damping: flick ? 0.82 : 1 })
				deckY.to(0, { response: 0.3 })
			} else {
				const projected = deckY.v + project(vy)
				if (projected < -LIFT && vy < 300) chooseDeck(vy)
				else deckY.to(0, { velocity: vy, response: 0.38, damping: Math.abs(vy) > 400 ? 0.8 : 1 })
			}
		},
		release: () => { // a tap or a cancelled touch: let anything that was caught finish settling
			if (deckX.v !== Math.round(deckX.v)) deckX.to(clamp(Math.round(deckX.v), 0, n - 1), { response: 0.35 })
			if (deckY.v !== 0) deckY.to(0, { response: 0.35 })
		},
	})
	deck.addEventListener('keydown', (e) => {
		if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); deckGo(state.deckIndex + (e.key === 'ArrowRight' ? 1 : -1)) }
		if (e.key === 'Enter') { e.preventDefault(); chooseDeck(0) }
	})
}
function deckGo(i) {
	const n = principlesFor().length
	i = clamp(i, 0, n - 1)
	if (reduced()) { fadeSwap(document.getElementById('deck'), () => deckX.set(i)); return }
	deckX.to(i, { response: 0.42, damping: 1 })
}
function chooseDeck(vy) {
	const keys = principlesFor()
	const i = clamp(Math.round(deckX.v), 0, keys.length - 1)
	const card = document.querySelectorAll('.deck-card')[i]
	deckX.stop(); deckY.stop()
	const k = keys[i]
	state.chosen = k
	state.week = buildWeek(k)
	state.done = new Set(state.week.filter((s) => s.day < todayIdx).map((s) => s.day))
	state.dayIndex = todayIdx
	morphTo(5, card.querySelector('.rows'), 'ready-week', vy)
}

// ——— The week that travels: the chosen card's week becomes Uke 1, then this week on I dag ———
// A copy of the rows lifts off where it is (including any lift the finger gave it), the next
// screen renders underneath, and three springs (x, y, scale, decomposed) carry it onto the
// matching card there, starting with the finger's vertical speed.
function morphTo(step, src, targetId, vy = 0) {
	if (reduced() || !src) { go(step); return }
	const P = 16
	const a = src.getBoundingClientRect()
	const w = src.offsetWidth
	const s0 = a.width / w
	const ghost = document.createElement('div')
	ghost.className = 'ghost'
	ghost.style.width = `${w + 2 * P}px`
	ghost.innerHTML = `<div class="rows">${src.innerHTML}</div>`
	document.body.appendChild(ghost)
	go(step, { fade: true })
	const target = document.getElementById(targetId)
	const b = target.getBoundingClientRect()
	const s1 = b.width / (w + 2 * P)
	target.style.opacity = '0'
	const paint = () => { ghost.style.transform = `translate3d(${gx.v}px,${gy.v}px,0) scale(${gs.v})` }
	const gx = new Spring(a.left - P * s0, paint, 0.3)
	const gy = new Spring(a.top - P * s0, paint, 0.3)
	const gs = new Spring(s0, paint, 0.0005)
	paint()
	const opts = { response: 0.5, damping: Math.abs(vy) > 500 ? 0.84 : 1 } // a throw may overshoot a touch; a tap never does
	let left = 3
	const land = () => {
		if (--left) return
		target.style.transition = 'opacity 160ms ease'; target.style.opacity = ''
		ghost.style.transition = 'opacity 160ms ease'; ghost.style.opacity = '0'
		setTimeout(() => { ghost.remove(); target.style.transition = '' }, 200)
	}
	gx.to(b.left, { ...opts, velocity: 0, onRest: land })
	gy.to(b.top, { ...opts, velocity: vy, onRest: land })
	gs.to(s1, { ...opts, velocity: 0, onRest: land })
}

// ——— I dag: a day pager with today in the middle ———
let pagerPaint = () => {}
const dayP = new Spring(0, () => pagerPaint(), 0.0005)
let pagerMeasure = null

function bindPager() {
	const pager = document.getElementById('pager')
	const track = pager.firstElementChild
	const pages = [...track.children]
	const rows = [...document.querySelectorAll('#home-week .wrow')]
	const label = document.getElementById('pg-label'), toToday = document.getElementById('to-today')
	const prev = document.querySelector('[data-pg="-1"]'), next = document.querySelector('[data-pg="1"]')
	let PW = 1, cur = -1
	dayP.stop()
	dayP.v = dayP.target = state.dayIndex ?? todayIdx
	pagerMeasure = () => {
		pages.forEach((el) => (el.style.minHeight = '0'))
		const h = Math.max(...pages.map((el) => el.offsetHeight))
		pages.forEach((el) => (el.style.minHeight = `${h}px`))
		track.style.height = `${h}px`
		PW = pages[0].offsetWidth + 12
		pagerPaint()
	}
	pagerPaint = () => {
		const p = dayP.v
		pages.forEach((el, i) => {
			const d = i - p, ad = Math.min(1, Math.abs(d))
			el.style.transform = `translate3d(${(d * PW).toFixed(2)}px,0,0) scale(${(1 - 0.06 * ad).toFixed(4)})`
			el.style.opacity = (1 - 0.5 * ad).toFixed(3)
			el.style.visibility = Math.abs(d) > 2.5 ? 'hidden' : ''
		})
		const c = clamp(Math.round(p), 0, 6)
		if (c !== cur) {
			cur = c; state.dayIndex = c
			pages.forEach((el, i) => (el.inert = i !== c))
			rows.forEach((r, i) => r.classList.toggle('shown', i === c))
			label.textContent = c === todayIdx ? 'I dag' : dayName(c)
			label.hidden = c !== todayIdx
			toToday.hidden = c === todayIdx
			prev.disabled = c === 0; next.disabled = c === 6
		}
	}
	pagerMeasure()

	let base = 0
	drag(pager, {
		axes: ['x'], // vertical belongs to the page scroll
		down: () => dayP.stop(),
		start: () => { base = dayP.v },
		move: (dx) => {
			if (reduced()) return
			const raw = base - dx / PW
			const over = raw < 0 ? raw : raw > 6 ? raw - 6 : 0
			dayP.set(over ? (raw < 0 ? 0 : 6) + rubber(over * PW, PW) / PW : raw)
		},
		end: ({ vx, dx }) => {
			if (reduced()) { if (Math.abs(dx) > 40 || Math.abs(vx) > 400) dayGo(state.dayIndex + (dx < 0 ? 1 : -1)); return }
			const target = clamp(Math.round(dayP.v - project(vx) / PW), 0, 6)
			dayP.to(target, { velocity: -vx / PW, response: 0.42, damping: Math.abs(vx) > 400 ? 0.82 : 1 })
		},
		release: (e, cancelled) => {
			// A tap on a neighbouring day brings it to the middle.
			if (!cancelled && dayP.v === Math.round(dayP.v)) {
				const r = pager.getBoundingClientRect()
				const i = clamp(Math.round(dayP.v + (e.clientX - (r.left + r.width / 2)) / PW), 0, 6)
				if (i !== state.dayIndex) { dayGo(i); return }
			}
			if (dayP.v !== Math.round(dayP.v)) dayP.to(clamp(Math.round(dayP.v), 0, 6), { response: 0.35 })
		},
	})
	pager.addEventListener('keydown', (e) => {
		if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); dayGo(state.dayIndex + (e.key === 'ArrowRight' ? 1 : -1)) }
	})
}
function dayGo(i) {
	i = clamp(i, 0, 6)
	if (reduced()) { fadeSwap(document.getElementById('pager'), () => dayP.set(i)); return }
	dayP.to(i, { response: 0.42, damping: 1 })
}
window.addEventListener('resize', () => { if (FLOW[state.step] === 'suggest') deckMeasure?.(); if (FLOW[state.step] === 'home') pagerMeasure?.() })

// ——— Sheet: follows the finger, leaves by velocity, can be caught on its way out ———
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheet-body')
let lastFocus = null, sheetH = 400, sheetOpen = false
const sheetY = new Spring(0, (y) => {
	sheet.style.transform = `translate3d(0,${y.toFixed(2)}px,0)`
	scrim.style.opacity = clamp(1 - y / sheetH, 0, 1).toFixed(3)
}, 0.3)
function openSheet(html) {
	lastFocus = document.activeElement
	sheetBody.innerHTML = `<div class="grabber"></div>${html}`
	sheet.classList.add('open'); scrim.classList.add('open'); sheetOpen = true
	sheetH = sheetBody.offsetHeight
	if (reduced()) {
		sheetY.set(0)
		sheet.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease' })
		scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease' })
	} else {
		if (!sheetY.moving && sheetY.v < sheetH * 0.5) sheetY.set(sheetH + 24)
		sheetY.to(0, { response: 0.38, damping: 1 })
	}
	setTimeout(() => sheetBody.querySelector('button')?.focus({ preventScroll: true }), 60)
}
function hideSheet() { sheet.classList.remove('open'); scrim.classList.remove('open') }
function closeSheet(velocity = 0) {
	if (!sheet.classList.contains('open')) return
	sheetOpen = false
	scrim.classList.remove('open')
	if (reduced()) {
		sheet.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: 'ease' }).onfinish = hideSheet
		scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: 'ease' }).onfinish = () => (scrim.style.opacity = '0')
	} else {
		sheetY.to(sheetH + 24, { velocity, response: 0.32, damping: 1, onRest: hideSheet })
	}
	lastFocus?.focus?.({ preventScroll: true })
}
scrim.addEventListener('click', () => closeSheet())
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet() })
let sheetBase = 0
drag(sheet, {
	axes: ['y'],
	down: () => { if (!reduced()) sheetY.stop() },
	start: () => { sheetBase = sheetY.v; sheet.classList.add('open') },
	move: (dx, dy) => {
		if (reduced()) return
		const raw = sheetBase + dy
		sheetY.set(raw < 0 ? rubber(raw, sheetH) : raw) // pulling up past open resists
	},
	end: ({ vy, dy }) => {
		if (reduced()) { if (dy > 60 || vy > 600) closeSheet(); return }
		const projected = sheetY.v + project(vy)
		if (projected > sheetH * 0.5 && vy > -200) closeSheet(vy)
		else { sheetOpen = true; scrim.classList.add('open'); sheetY.to(0, { velocity: vy, response: 0.36, damping: Math.abs(vy) > 400 ? 0.8 : 1 }) }
	},
	release: () => { if (!reduced() && sheetY.v !== 0 && sheetOpen) sheetY.to(0, { response: 0.36 }); else if (!sheetOpen && sheet.classList.contains('open')) closeSheet() },
})

const toastEl = document.getElementById('toast'), toastText = document.getElementById('toast-text')
let toastTimer = null, undoFn = null
function toast(msg, undo) {
	toastText.textContent = msg; undoFn = undo
	document.getElementById('toast-undo').hidden = !undo
	toastEl.classList.add('show')
	clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000)
}
toastEl.addEventListener('pointerenter', () => clearTimeout(toastTimer))
toastEl.addEventListener('pointerleave', () => { toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000) })
document.getElementById('toast-undo').addEventListener('click', () => { undoFn?.(); toastEl.classList.remove('show') })

function adjustSheet() {
	openSheet(`<h2 id="sheet-title">Juster</h2><p class="small">Si hva som skjer, så ordner appen resten.</p>
		<div class="options" style="margin-top:8px">
			<button type="button" class="option" data-adj="lighter"><div><b>Uka er for tung</b><span class="d">Kortere økter resten av uka, ingen harde.</span></div></button>
			<button type="button" class="option" data-adj="less-time"><div><b>Jeg har mindre tid denne uka</b><span class="d">Fjerner den korteste økta som gjenstår.</span></div></button>
			<button type="button" class="option" data-adj="harder"><div><b>Jeg vil ha mer</b><span class="d">Litt lengre økter resten av uka.</span></div></button>
			<button type="button" class="option" data-adj="advanced"><div><b>Avansert</b><span class="d">Sesong, filosofi, ukemål, soner og terskler. Alt som finnes i dag.</span></div></button>
		</div>`)
}
function adjust(kind) {
	const before = state.week.map((s) => ({ ...s }))
	const ahead = (s) => s.day >= todayIdx && !isDone(s)
	let msg = ''
	if (kind === 'lighter') { state.week = state.week.map((s) => (ahead(s) ? { ...s, min: Math.max(20, Math.round((s.min * 0.8) / 5) * 5), ...(s.int !== 'easy' ? { w: 'easy', t: 'Rolig', int: 'easy', d: WORK.easy.d } : {}) } : s)); msg = 'Resten av uka er gjort lettere' }
	if (kind === 'harder') { state.week = state.week.map((s) => (ahead(s) ? { ...s, min: Math.round((s.min * 1.15) / 5) * 5 } : s)); msg = 'Resten av uka er litt lengre' }
	if (kind === 'less-time') {
		const left = state.week.filter(ahead).sort((a, b) => a.min - b.min)
		if (!left.length) { toast('Ingen økter igjen å fjerne'); closeSheet(); return }
		state.week = state.week.filter((s) => s !== left[0]); msg = `${title(left[0])} på ${DAY_LONG[left[0].day]} er fjernet`
	}
	if (kind === 'advanced') { closeSheet(); toast('Her åpnes dagens Sesong-side med alt det avanserte'); return }
	closeSheet(); render()
	toast(msg, () => { state.week = before; render() })
}

// ——— Events ———
function bindAfter(name) {
	if (name === 'suggest') bindDeck()
	if (name === 'home') bindPager()
}

document.addEventListener('click', (e) => {
	const t = e.target.closest('button')
	if (!t) return
	const d = t.dataset
	if (d.level) {
		const l = LEVELS.find((x) => x.k === d.level)
		state.level = l.k; state.hours = l.h
		if (!state.daysTouched) state.days = new Set(l.days)
		render(); return
	}
	if (d.hours) { state.hours = Math.min(20, Math.max(1, state.hours + Number(d.hours))); render(); return }
	if (d.actK) {
		if (state.acts.has(d.actK)) { state.acts.delete(d.actK); state.actOrder = state.actOrder.filter((k) => k !== d.actK) }
		else { state.acts.add(d.actK); state.actOrder.push(d.actK) }
		render(); return
	}
	if (d.day) { const i = Number(d.day); state.daysTouched = true; state.days.has(i) ? state.days.delete(i) : state.days.add(i); render(); return }
	if (d.pref) { state.prefs.has(d.pref) ? state.prefs.delete(d.pref) : state.prefs.add(d.pref); render(); return }
	if (d.deck) { deckGo(Number(d.deck)); return }
	if (d.goday) { dayGo(Number(d.goday)); return }
	if (d.pg) { dayGo(state.dayIndex + Number(d.pg)); return }
	if (d.done) {
		const day = Number(d.done)
		const was = state.done.has(day)
		was ? state.done.delete(day) : state.done.add(day)
		render()
		if (!was) toast('Økta er markert som gjort', () => { state.done.delete(day); render() })
		return
	}
	if (d.adj) { adjust(d.adj); return }
	switch (d.act) {
		case 'next':
			if (FLOW[state.step] === 'ready') morphTo(6, document.querySelector('#ready-week .rows'), 'home-week')
			else go(state.step + 1)
			break
		case 'back': go(Math.max(0, state.step - 1)); break
		case 'demo': demo(); break
		case 'choose-deck': chooseDeck(0); break
		case 'to-today': dayGo(todayIdx); break
		case 'adjust': adjustSheet(); break
		case 'plan-tab': toast('Plan: sesongen som én enkel kurve, med «Avansert» for alt annet'); break
		case 'me-tab': toast('Meg: profil, tilkoblinger og innstillinger'); break
	}
})

function demo() {
	state.level = 'mosjon'; state.hours = 6
	state.acts = new Set(['run', 'strength', 'climb']); state.actOrder = ['run', 'strength', 'climb']
	state.days = new Set([0, 1, 3, 5, 6]); state.prefs = new Set(['long', 'intervals'])
	state.deckIndex = 0
	go(4)
}

render()
</script>
