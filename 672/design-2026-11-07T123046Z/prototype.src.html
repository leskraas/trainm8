/* The project's tokens (app/styles/tailwind.css), light and dark. */

.tabbar a, .tabs-desktop a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted-foreground); text-decoration: none; font-size: 12px; font-weight: 500; }

@media (min-width: 768px) {

.card { background: var(--card); color: var(--card-foreground); border-radius: 15.6px; box-shadow: 0 0 0 1px color-mix(in oklab, var(--foreground) 5%, transparent), 0 4px 6px -1px rgb(0 0 0 / .08), 0 2px 4px -2px rgb(0 0 0 / .06); padding: 16px; }

.stack-4 > * + * { margin-top: 16px; }

/* A collapsible row (CollapsibleSection) */
.row { margin: 0 -8px; width: calc(100% + 16px); min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 10px 8px; border: 0; background: transparent; text-align: left; border-radius: 10.8px; cursor: pointer; user-select: none; transition: background-color 160ms var(--ease-out); }
.row:active { background: var(--muted); }

.alert-desc .strong { font-weight: 500; color: var(--foreground); }
.alert-action { position: absolute; top: 10px; right: 12px; }
.icon-btn { position: relative; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted-foreground); cursor: pointer; user-select: none; transition: background-color 160ms var(--ease-out), transform 160ms var(--ease-out); }
.icon-btn::after { content: ''; position: absolute; inset: -6px; }
.icon-btn:active { transform: scale(0.97); background: var(--muted); }
@media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: var(--muted); color: var(--foreground); } }
.icon-btn svg { width: 16px; height: 16px; }
/* A link inside a notice: a real 44px target, the resting link's idiom. */
/* An invisible hit area, not a taller line: inline-flex min-h-11 opened a 20px gap in
   the middle of a sentence. The inline box is the font's content area (~19px at 16px,
   ~16px at 14px), not the line, so the area grows 13px / 14px each way to reach 44px; neighbours are text, never
   another target (each band line runs to at least two lines, so its link is 48px+
   from the next). */
.tap-link { position: relative; color: inherit; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.tap-link::after { content: ''; position: absolute; inset: -13px -4px; }
@media (min-width: 768px) { .tap-link::after { inset: -14px -4px; } }
.band-link { color: var(--foreground); text-decoration: none; }
@media (hover: hover) and (pointer: fine) { .band-link:hover { text-decoration: underline; } }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }

.guards { display: flex; flex-direction: column; gap: 12px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--muted); }

.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }

.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }

// ---------- Pieces ----------
function curveSvg(d) {
  const weeks = d.phases.reduce((n, p) => n + p[2], 0)
  const W = 340, H = 112, base = 92, top = 14
  const slot = W / weeks
  let pts = [], i = 0, v = 4.5, done = []
  for (const [, tone, n] of d.phases) for (let k = 0; k < n; k++, i++) {
    const rec = tone !== 'taper' && k % 4 === 3
    if (tone === 'taper') v *= 0.82; else if (!rec) v *= tone === 'build' ? 1.06 : tone === 'peak' ? 1.02 : 1.03
    const val = rec ? v * 0.7 : v
    pts.push(val); if (i < 3) done.push(val * (0.85 + 0.1 * (i % 2)))
  }
  const max = Math.max(...pts) * 1.05
  const y = (val) => base - (val / max) * (base - top)
  let bands = '', at = 0
  for (const [, tone, n] of d.phases) { bands += `<rect x="${(at * slot).toFixed(1)}" y="${base + 2}" width="${(n * slot - 0.5).toFixed(1)}" height="3" style="fill:var(--phase-${tone})"/>`; at += n }
  const bars = done.map((dv, k) => `<rect x="${(k * slot + slot * 0.2).toFixed(1)}" y="${y(dv).toFixed(1)}" width="${(slot * 0.6).toFixed(1)}" height="${(base - y(dv)).toFixed(1)}" rx="1" style="fill:var(--track-run)"/>`).join('')
  const line = pts.map((p, k) => `${(k * slot + slot / 2).toFixed(1)},${y(p).toFixed(1)}`).join(' ')
  const now = 2 * slot + slot / 2
  return `<figure class="curve" style="margin:0"><div class="text-caption muted" style="display:flex;justify-content:space-between"><span>Timer i uka, uke for uke</span><span class="tnum">${weeks} uker</span></div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Sesongen som én kurve, denne uka markert">${bands}${bars}
  <line x1="${now}" x2="${now}" y1="${top - 6}" y2="${base}" stroke="var(--primary)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <text x="${now + 4}" y="${top - 2}" font-size="10" font-weight="600" style="fill:var(--primary)">Nå</text></svg></figure>`
}

function leadCard(d) {
  return `<section aria-labelledby="plan-name" data-plan-lead class="stack-3 lead-col">
    <div class="card stack-4">
      <header style="display:grid;gap:4px">
        <h1 id="plan-name" class="text-title wrap-any" style="text-wrap:balance">${esc(d.name)}</h1>
        <p class="text-footnote muted">${esc(d.family)}</p>
        <p class="text-footnote muted tnum wrap-any">Mot <a href="#" data-dest="/training/events/…" style="color:var(--foreground);font-weight:600;text-decoration:none">${esc(d.event)}</a> · ${esc(d.meta)}</p>
      </header>
      ${curveSvg(d)}
      <p class="text-callout">${esc(d.easy)}</p>
      <a class="pill" href="#" data-dest="/training/events/…" style="padding:0 16px">${ICON.cal}Endre løpet</a>
      <div class="hair" style="padding-top:2px"><button class="row" type="button" aria-expanded="false" data-row><span style="flex:1;min-width:0"><span class="text-callout" style="display:block">Bytt treningsform</span><span class="text-footnote muted" style="display:block">Se måtene å trene på igjen, lagt for ukene dine</span></span>${ICON.chev}</button>
        <div class="collapse"><div><p class="text-footnote muted" style="padding:4px 0 16px">Hver er en ekte uke med 6 t på 5 dager, fra uka som starter 9. nov. Du ser hva som endres før noe skjer.</p></div></div></div>
    </div>
    ${d.resting ? `<p class="text-footnote muted" style="text-align:center">${esc(d.resting.text)} <a href="#" data-dest="/training/plan" style="color:var(--foreground);font-weight:600;display:inline-flex;min-height:44px;align-items:center;text-decoration:underline;text-underline-offset:4px">${esc(d.resting.link)}</a></p>` : ''}
    ${state.variant === 1 ? guards(d, 'lead') : ''}
  </section>`
}

function notice(name, key, body) {
  if (state.dismissed.has(key)) return `<p tabindex="-1" class="sr-only" data-closed="${key}">${esc(NOTE.dismissed(name))}</p>`
  return `<div class="alert" role="alert" data-notice="${key}"><div class="alert-desc">${body}</div>
    <div class="alert-action"><button class="icon-btn" type="button" aria-label="${esc(NOTE.dismiss(name))}" data-dismiss="${key}">${ICON.cross}</button></div></div>`
}

function rampBody(d) {
  const lifting = d.ramp.some((w) => w.lifting)
  return `<ul>${d.ramp.map((w) => w.lifting ? `<li class="fact"><span class="strong">${esc(w.lifting)}</span> ${esc(w.rest)}</li>` : `<li class="fact"><span class="strong wrap-any">${esc(w.phase)}</span> ${esc(w.rate)}.</li>`).join('')}</ul>
  <p>${esc(NOTE.rampNote)}${lifting ? esc(NOTE.rampLiftingNote) : ''}</p>`
}
function availBody(d, noCap) {
  const a = d.avail, counted = a.days.length + a.hours.length > 0
  let html = ''
  if (counted) {
    html += `<ul>${[...a.days, ...a.hours].map((w) => `<li class="fact"><span class="strong tnum">${esc(w.span)}</span>${esc(w.text.join(''))}</li>`).join('')}</ul>`
    html += `<p>${esc(a.days.length && a.hours.length ? NOTE.bothChecks : a.days.length ? NOTE.daysCheck : NOTE.hoursCheck)}${esc(NOTE.fitNote)}</p>`
    if (noCap) html += `<p>${esc(NOTE.noCap[0])} <a class="tap-link" href="#" data-dest="/settings/profile">${esc(NOTE.noCap[1])}</a> ${esc(NOTE.noCap[2])}</p>`
  }
  if (a.clashes.length) {
    html += `<ul>${a.clashes.map((c) => `<li class="fact"><span class="strong tnum">${esc(c.span)}</span>${esc(c.text)}</li>`).join('')}</ul>`
    html += `<p>${esc(NOTE.dayClashCheck)}${esc(NOTE.dayClashNote)}</p>`
  }
  return html
}
function bandBody(d) {
  return `<ul class="band-list">${d.band.map((b) => `<li class="fact"><a class="tap-link band-link tnum" href="#" data-dest="/training/sessions/…">${esc(b.span)}</a> ${esc(b.line)}</li>`).join('')}</ul><p>${esc(NOTE.bandNote)}</p>`
}

function guards(d, where) {
  const any = d.ramp.length || d.avail.days.length || d.avail.hours.length || d.avail.clashes.length || d.band.length
  if (!any) return ''
  const noCap = Boolean(d.availNoCap)
  const avail = d
  return `<div class="guards" data-plan-guards="${where}">
    ${d.ramp.length ? notice(NOTE.rampName, 'ramp', rampBody(d)) : ''}
    ${avail.avail.days.length || avail.avail.hours.length || avail.avail.clashes.length ? notice(NOTE.availabilityName, 'avail', availBody(avail, noCap)) : ''}
    ${d.band.length ? notice(NOTE.bandName, 'band', bandBody(d)) : ''}
  </div>`
}

function library() {
  return `<section class="lead-col" style="margin-top:40px" aria-labelledby="bib"><h2 id="bib" class="text-heading" style="margin-bottom:8px">Bibliotek</h2>
  <div class="card" style="padding:4px 16px">
    ${[['Katalog', 'Ferdige økter du kan ta inn i uka di.'], ['Styrkeprogrammer', 'Programmer som setter neste vekt ut fra forrige logg.'], ['Alle øvelser', 'Hele øvelsesbanken, med søk.']].map(([t, s], k) => `<a href="#" data-dest="/library" class="row" style="text-decoration:none;color:inherit;${k ? 'border-top:1px solid color-mix(in oklab, var(--border) 60%, transparent);border-radius:0' : ''}"><span style="flex:1;min-width:0"><span class="text-callout" style="display:block">${t}</span><span class="text-footnote muted" style="display:block">${s}</span></span><svg class="chev" style="transform:rotate(-90deg)" viewBox="0 0 15 15" fill="currentColor"><path d="M3.13 5.82a.5.5 0 0 1 .7.05L7.5 10.1l3.67-4.23a.5.5 0 1 1 .76.65l-4.05 4.66a.5.5 0 0 1-.76 0L3.08 6.52a.5.5 0 0 1 .05-.7Z"/></svg></a>`).join('')}
  </div></section>`
}

function advanced(d) {
  return `<section id="avansert" style="margin-top:40px" aria-labelledby="avansert-title">
    <h2 id="avansert-title" class="lead-col" style="margin-bottom:0"><button class="row" type="button" aria-expanded="${state.adv}" data-adv style="border-top:1px solid color-mix(in oklab, var(--border) 60%, transparent);border-radius:10.8px">
      <span style="flex:1;min-width:0"><span class="text-heading" style="display:block">Avansert</span><span class="text-footnote muted" style="display:block;font-weight:400">Filosofi, ukemål, faser, treningsspor, den typiske uka og sesongdiagrammet.</span></span>${ICON.chev}</button></h2>
    <div class="collapse" ${state.adv ? 'data-open' : ''}><div><div class="stack-6" style="padding-top:16px">
      <div class="card"><h3 class="text-heading">Endre sesongen</h3><p class="text-footnote muted" style="margin-top:4px">Et ukemål, en fases navn og lengde, og den lette uka – hver bak en forhåndsvisning.</p></div>
      <nav class="seg" aria-label="Lesninger"><a href="#" aria-current="page">Blokker</a><a href="#">Uker</a></nav>
      <div class="stack-6" data-blocks-reading>
        ${state.variant === 0 ? guards(d, 'blocks') : ''}
        <ol style="list-style:none;padding:0;margin:0" class="stack-3" aria-label="Faser">
          ${d.phases.map(([n, tone, w], k) => `<li class="card phase"><span class="dot" style="background:var(--phase-${tone})"></span><span style="flex:1;min-width:0"><span class="text-callout wrap-any" style="display:block">${esc(n)}</span><span class="text-footnote muted tnum" style="display:block">${w} uker · 3:1</span></span>${k === (d.phases.length > 4 ? 1 : 0) ? '<span class="badge">Nå</span>' : ''}${ICON.chev}</li>`).join('')}
        </ol>
      </div>
    </div></div></div>
  </section>`
}

function page() {
  const d = DATA[state.data]
  return `<main>
    <header class="page-header lead-col"><h1>Plan</h1><nav aria-label="Start noe nytt" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <a class="pill" href="#" data-dest="/training/events/new">${ICON.plus}Nytt løp</a><a class="pill" href="#" data-dest="/training/plan/new">${ICON.plus}Ny plan</a></nav></header>
    ${leadCard(d)}
    ${library()}
    ${advanced(d)}
  </main>`
}

// ---------- State, picker and toggles ----------
const params = new URLSearchParams(location.search)
const state = {
  variant: 0,
  data: DATA[params.get('data')] ? params.get('data') : 'demo',
  adv: params.get('adv') === '1',
  dismissed: new Set(),
}
document.documentElement.classList.toggle('dark', params.get('theme') === 'dark')
document.documentElement.dataset.chrome = params.get('chrome') ?? '1'
document.documentElement.dataset.full = params.get('full') ?? '0'

const stage = document.getElementById('stage')
function render() { stage.innerHTML = page() }
function setParam(k, v) { const u = new URL(location); u.searchParams.set(k, v); history.replaceState(null, '', u) }
function syncToggles() {
  document.querySelectorAll('#data-toggle button').forEach((b) => b.toggleAttribute('data-on', b.dataset.k === state.data))
  const dark = document.documentElement.classList.contains('dark')
  document.querySelectorAll('#theme-toggle button').forEach((b) => b.toggleAttribute('data-on', (b.dataset.k === 'dark') === dark))
}
document.getElementById('data-toggle').addEventListener('click', (e) => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return
  state.data = k; state.dismissed.clear(); setParam('data', k); syncToggles(); render()
})
document.getElementById('theme-toggle').addEventListener('click', (e) => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return
  document.documentElement.classList.toggle('dark', k === 'dark'); setParam('theme', k); syncToggles()
})
let noteTimer
stage.addEventListener('click', (e) => {
  const dismiss = e.target.closest('[data-dismiss]')
  if (dismiss) {
    const key = dismiss.dataset.dismiss
    state.dismissed.add(key); render()
    // The line that replaces it takes focus, so the reader keeps their place.
    stage.querySelector(`[data-closed="${key}"]`)?.focus()
    return
  }
  const adv = e.target.closest('[data-adv]')
  if (adv) { state.adv = !state.adv; adv.setAttribute('aria-expanded', state.adv); adv.closest('section').querySelector('.collapse').toggleAttribute('data-open', state.adv); setParam('adv', state.adv ? 1 : 0); return }
  const row = e.target.closest('[data-row]')
  if (row) { const open = row.getAttribute('aria-expanded') !== 'true'; row.setAttribute('aria-expanded', open); row.nextElementSibling.toggleAttribute('data-open', open); return }
  const link = e.target.closest('a[data-dest]')
  if (link) {
    e.preventDefault()
    const n = document.getElementById('harness-note'); n.hidden = false
    n.textContent = `Prototype: would open ${link.dataset.dest}`
    clearTimeout(noteTimer); noteTimer = setTimeout(() => (n.hidden = true), 1800)
  }
})

// Picker wiring (PICKER.md reference wiring), variants re-render the stage.
const variants = [() => { state.variant = 0; state.dismissed.clear(); render() }, () => { state.variant = 1; state.dismissed.clear(); render() }]
const picker = document.querySelector('.proto-picker')
const highlight = picker.querySelector('.proto-picker-highlight')
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')]
let current = 0
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)` }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => variants[i]()) }
function setActive(i) {
  if (i < 0 || i >= variants.length) return
  current = i
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current') })
  moveHighlight(); setParam('v', i + 1); mount(i)
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)))
window.addEventListener('resize', moveHighlight)
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= variants.length) setActive(num - 1)
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length)
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length)
  else if (e.key === 'r' || e.key === 'R') mount(current)
})
syncToggles()
setActive((parseInt(params.get('v'), 10) || 1) - 1)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')))
</script>
</body>
</html>
