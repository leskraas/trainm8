name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev
    # Docs-only changes (ADRs, glossary, agent notes) cannot change the app.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  # Lint and type check share one job: each needs the same install and Prisma
  # client, and a job is billed by the started minute.
  static:
    name: ⬣ Lint & ʦ TypeScript
    runs-on: ubuntu-24.04
    # Draft PRs run nothing; marking one ready for review runs the full set.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      # Generates the icon sprite types the type check reads.
      - name: 🏗 Build
        run: npm run build

      - name: 🔬 Lint
        run: npm run lint

      - name: 🔎 Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

  vitest:
    name: ⚡ Vitest (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # Draft PRs run nothing; marking one ready for review runs the full set.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Depth 2: on a PR, HEAD is the merge commit and HEAD^1 the base branch,
      # so `HEAD^1..HEAD` is exactly what the PR changes.
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A PR runs only the tests whose import graph reaches a changed file, on
      # shard 1 alone. Anything that graph cannot see — dependencies, the schema
      # and migrations, test setup, mocks and fixtures, config, this workflow —
      # runs the full suite, and so does every push to main before it deploys.
      - name: 🎯 Pick tests
        id: scope
        run: |
          full='^(package(-lock)?\.json|vite\.config\.ts|tsconfig\.json|\.env\.example|prisma/|tests/(setup|mocks|fixtures)/|other/|\.github/)'
          if [ "${{ github.event_name }}" = pull_request ] &&
            ! git diff --name-only HEAD^1 HEAD | grep -qE "$full"; then
            echo "args=--changed HEAD^1 --passWithNoTests" >> "$GITHUB_OUTPUT"
            echo "run=${{ matrix.shard == 1 }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--shard=${{ matrix.shard }}/3" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧰 Setup
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: ⚡ Run vitest
        if: steps.scope.outputs.run == 'true'
        run: npx vitest run ${{ steps.scope.outputs.args }}

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-24.04
    # Draft PRs run nothing; marking one ready for review runs the full set.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      # The runner image already carries Chromium's system libraries, so only
      # the browser itself is downloaded (~10s).
      - name: 📥 Install Playwright Chromium
        run: npx playwright install chromium

      - name: 🌱 Seed Database
        run: npx prisma migrate reset --force

      - name: 🏗 Build
        run: npm run build

      # The e2e server runs with NODE_ENV=production, which refuses the
      # published development credential key from .env.example (see
      # parseCredentialKeys), so each run gets a throwaway key.
      - name: 🎭 Playwright tests
        run:
          CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -base64 32)" npx playwright
          test

      - name: 📊 Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  container:
    name: 📦 Prepare Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # only prepare container on pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file: 'fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: 📦 Build Staging Container
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build Production Container
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-secret SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --app ${{ steps.app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [static, vitest, playwright, container]
    # only deploy on pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: '50'

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file: 'fly.toml'
          field: 'app'

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: 🚀 Deploy Staging
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}-staging:${{ github.sha }}" \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
