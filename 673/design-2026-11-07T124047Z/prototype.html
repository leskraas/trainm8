/* trainm8 tokens, copied from app/styles/tailwind.css (light :root, dark .dark) */
:root {
  --radius: 0.375rem;
  --background: oklch(0.975 0.003 197);
  --foreground: oklch(0.148 0.004 228.8);
  --card: oklch(1 0 0);
  --primary: #0d7a68;
  --primary-foreground: #ffffff;
  --secondary: oklch(0.955 0.004 197);
  --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.948 0.004 197);
  --muted-foreground: oklch(0.52 0.016 213.5);
  --border: oklch(0.915 0.005 214.3);
  --input: oklch(0.915 0.005 214.3);
  --foreground-destructive: oklch(51.46% 0.1979 16.57);
  --ring: color-mix(in oklab, var(--primary) 55%, transparent);
  --status-under: oklch(0.55 0.13 65);
  --track-run: oklch(0.63 0.16 32);
  --track-bike: oklch(0.72 0.13 78);
  --track-swim: oklch(0.62 0.1 225);
  --track-run-ink: oklch(0.54 0.15 32);
  --track-bike-ink: oklch(0.53 0.11 78);
  --track-swim-ink: oklch(0.52 0.09 225);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.148 0.004 228.8);
    --foreground: oklch(0.987 0.002 197.1);
    --card: oklch(0.205 0.007 223.9);
    --primary: #35b89c;
    --primary-foreground: #0c1512;
    --secondary: oklch(0.275 0.011 216.9);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.255 0.01 216.9);
    --muted-foreground: oklch(0.723 0.014 214.4);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --foreground-destructive: oklch(63.72% 0.2071 21.89);
    --status-under: oklch(0.82 0.12 65);
    --track-run-ink: oklch(0.74 0.13 32);
    --track-bike-ink: oklch(0.8 0.12 78);
    --track-swim-ink: oklch(0.76 0.09 225);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: 'Public Sans Variable', system-ui, sans-serif; font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
button, a, label, summary, [role=button] { touch-action: manipulation; }
button, [role=button], .pill { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; }
/* type steps (design-system.md) */
.t-title { font-size: 24px; line-height: 30px; font-weight: 650; letter-spacing: -0.02em; }
.t-heading { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.012em; }
.t-callout { font-size: 15px; line-height: 21px; font-weight: 500; letter-spacing: -0.004em; }
.t-footnote { font-size: 13px; line-height: 18px; font-weight: 400; letter-spacing: 0.002em; }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; }
.t-overline { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.muted { color: var(--muted-foreground); }
.num { font-variant-numeric: tabular-nums; }
.wrap { overflow-wrap: anywhere; }
.clamp1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.semi { font-weight: 600; }
/* text-base md:text-sm */
.tb { font-size: 16px; line-height: 24px; }
@media (min-width: 768px) { .tb { font-size: 14px; line-height: 20px; } }

/* page */
.page { max-width: 672px; margin: 0 auto; padding: 24px 16px 120px; }
@media (min-width: 1024px) { .page { max-width: 1152px; padding: 32px 32px 120px; } }
.narrow { }
@media (min-width: 1024px) { .narrow { max-width: 672px; margin-left: auto; margin-right: auto; } }
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.page-header h1 { margin: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--secondary); color: var(--secondary-foreground); font-size: 14px; font-weight: 500; text-decoration: none; border: 0; cursor: pointer; position: relative; white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out); }
.pill::after { content: ''; position: absolute; inset: -6px -2px; }
.pill:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .pill:hover { background: color-mix(in oklab, var(--secondary) 80%, var(--foreground) 6%); } }

.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow-md), 0 0 0 1px color-mix(in oklab, var(--foreground) 5%, transparent); padding: 16px; }
@media (min-width: 768px) { .card { padding: 24px; } }
.card > h2 { margin: 0 0 16px; }
.stack-3 > * + * { margin-top: 12px; }
.stack-4 > * + * { margin-top: 16px; }
.stack-2 > * + * { margin-top: 8px; }
.stack-1 > * + * { margin-top: 4px; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; }

/* lead */
.lead-curve { width: 100%; height: 72px; display: block; }
.vol { border-top: 1px solid color-mix(in oklab, var(--border) 60%, transparent); padding-top: 12px; }
.vol-row { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.vol-row .what { min-width: 0; flex: 1; }
.vol-row .track { font-weight: 600; }
.ink-run { color: var(--track-run-ink); } .ink-bike { color: var(--track-bike-ink); } .ink-swim { color: var(--track-swim-ink); }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
.dot-run { background: var(--track-run); } .dot-bike { background: var(--track-bike); } .dot-swim { background: var(--track-swim); }

/* rows that open */
.row-btn { display: flex; width: calc(100% + 16px); margin: 0 -8px; min-height: 44px; align-items: center; gap: 12px; padding: 10px 8px; text-align: left; border: 0; background: transparent; border-radius: 11px; cursor: pointer; transition: background-color 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .row-btn:hover { background: color-mix(in oklab, var(--muted) 50%, transparent); } }
.row-btn:active { background: var(--muted); }
.row-btn:focus-visible, .btn:focus-visible, .pill:focus-visible, .choice:focus-within, .field:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.chev { flex-shrink: 0; color: var(--muted-foreground); transition: transform 160ms var(--ease-out); }
[aria-expanded=true] > .chev { transform: rotate(180deg); }
.section { border-top: 1px solid color-mix(in oklab, var(--border) 60%, transparent); }
.collapse { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 150ms var(--ease-out), opacity 150ms var(--ease-out); }
.collapse > .inner { overflow: hidden; min-height: 0; }
.collapse[data-open] { grid-template-rows: 1fr; opacity: 1; transition-duration: 200ms; }
.collapse:not([data-open]) > .inner { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .collapse { transition-property: opacity; } .chev { transition: none; } }

/* form */
.label { display: block; font-size: 14px; line-height: 20px; font-weight: 500; margin-bottom: 6px; }
.field { display: block; width: 100%; height: 44px; border-radius: 13px; border: 1px solid transparent; background: color-mix(in oklab, var(--input) 50%, transparent); padding: 0 12px; color: var(--foreground); font: inherit; font-size: 16px; }
@media (min-width: 768px) { .field { font-size: 14px; } }

<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Handling først</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<div class="data-toggle" role="group" aria-label="Data">
  <button data-data="demo">Demo data</button>
  <button data-data="worst">Worst case</button>
  <button data-sim="begun" aria-pressed="false">Simuler: uke 46 har begynt</button>
</div>

<script>
'use strict'
// ───────── calendar ─────────
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des']
const dayOf = (key) => new Date(key + 'T12:00:00Z')
function addWeeks(key, n) { const d = dayOf(key); d.setUTCDate(d.getUTCDate() + 7 * n); return d.toISOString().slice(0, 10) }
function isoWeek(key) { const d = dayOf(key); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const y = Date.UTC(d.getUTCFullYear(), 0, 1); return Math.ceil((Math.floor((d - y) / 86400000) + 1) / 7) }
const dayMonth = (key) => { const d = dayOf(key); return `${d.getUTCDate()}. ${MONTHS[d.getUTCMonth()]}` }
const fullDate = (key) => { const d = dayOf(key); return `${d.getUTCDate()}. ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}` }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

// ───────── units (labels.ts: NB_VOLUME_UNITS / NB_WEEKLY_UNITS) ─────────
const UNIT = { km: 'km', hours: 't', tss: 'TSS' }
const WEEKLY = { km: 'km/uke', hours: 't/uke', tss: 'TSS/uke' }
function round(value, currency) { return currency === 'hours' ? Math.round(value * 2) / 2 : currency === 'km' ? Math.round(value * 2) / 2 : Math.round(value) }
function fig(value, currency) { if (value == null) return 'Utilgjengelig'; const r = round(value, currency); return String(r).replace('.', ',') + ' ' + UNIT[currency] }
function parseNb(raw) { const t = String(raw).trim().replace(/\s/g, '').replace(',', '.'); if (t === '') return { error: 'Hvor mye i uka starter du fra?' }; const n = Number(t); if (!Number.isFinite(n)) return { error: 'Skriv et ukevolum, f.eks. 45' }; if (n <= 0) return { error: 'Et startnivå er mer enn 0.' }; return { value: n } }
const ROLE = { loading: 'hard uke', recovery: 'lett uke', taper: 'nedtrapping' }

// ───────── data: the issue's real content (demo) and break-ui's worst case ─────────
const DATA = {
  demo: () => ({
    planName: 'Mest rolig, litt veldig hardt', family: 'Polarisert',
    event: { name: 'Sentrumsløpet', date: '2027-04-25' },
    startKey: '2026-08-31', firstUnbegun: '2026-11-09',
    phases: [
      { name: 'Grunntrening', weeks: 12, rhythm: 3 },
      { name: 'Oppbygging', weeks: 12, rhythm: 3 },
      { name: 'Spissing', weeks: 8, rhythm: 2 },
      { name: 'Nedtrapping', weeks: 2, taper: true },
    ],
    tracks: [
      { id: 'run', name: 'Løping', ink: 'run', currency: 'km', ramp: 0.025,
        segments: [{ from: '2026-08-31', value: 40 }, { from: '2027-01-04', value: 48 }],
        overrides: { '2026-12-14': 30 } },
    ],
    strength: null,
  }),
  worst: () => ({
    planName: 'Bygg grunnform først', family: 'Pyramidal',
    event: { name: 'Birkebeinerløpet – Norges mest tradisjonsrike halvmaraton på fjellet', date: '2027-06-12' },
    startKey: '2026-08-31', firstUnbegun: '2026-11-09',
    phases: [
      { name: 'Grunntrening med høydeleir og ekstra rolig volum før jul', weeks: 16, rhythm: 3 },
      { name: 'Oppbygging', weeks: 12, rhythm: 3 },
      { name: 'Spissing', weeks: 9, rhythm: 2 },
      { name: 'Nedtrapping', weeks: 3, taper: true },
    ],
    tracks: [
      { id: 'run', name: 'Løping', ink: 'run', currency: 'km', ramp: 0.03,
        segments: [
          { from: '2026-09-14', value: 96.5 }, { from: '2026-10-12', value: 88 },
          { from: '2026-11-09', value: 104 }, { from: '2026-12-28', value: 112.5 },
          { from: '2027-02-15', value: 128.5 }, { from: '2027-08-02', value: 90, outside: true },
        ],
        overrides: { '2026-11-23': 0, '2026-12-21': 60, '2027-01-11': 142.5, '2027-03-08': 101 } },
      { id: 'bike', name: 'Sykling', ink: 'bike', currency: 'hours', ramp: 0.04,
        segments: [{ from: '2026-08-31', value: 7.5 }], overrides: { '2027-02-01': 0 } },
      { id: 'swim', name: 'Svømming', ink: 'swim', currency: 'km', ramp: 0.05,
        segments: [{ from: '2026-08-31', value: 2.5 }], overrides: {} },
    ],
    strength: 'Styrke',
  }),
}

// ───────── derivation (mirrors derive.ts: anchor × ramp over loading weeks, ADR 0040 §3) ─────────
function weeksOf(plan) {
  const out = []
  let i = 0
  plan.phases.forEach((phase, p) => {
    for (let w = 0; w < phase.weeks; w++, i++) {
      let role = 'loading'
      if (phase.taper) role = 'taper'
      else if (phase.rhythm && (w % (phase.rhythm + 1)) === phase.rhythm) role = 'recovery'
      out.push({ key: addWeeks(plan.startKey, i), index: i, phase: phase.name, phaseIndex: p, role, taperIndex: phase.taper ? w : null })
    }
  })
  return out
}
function segmentAt(segments, key) { let s = null; for (const seg of segments) if (!seg.outside && seg.from <= key && (!s || seg.from > s.from)) s = seg; return s }
/** Every week's target for one track under the given segments; each with how it was derived. */
function targets(plan, track, segments) {
  const weeks = weeksOf(plan)
  const out = []
  let lastLoading = null; let k = 0; let segFrom = null
  for (const week of weeks) {
    const seg = segmentAt(segments, week.key)
    if (seg && seg.from !== segFrom) { segFrom = seg.from; k = 0; lastLoading = null }
    let derived = null; let how = null
    if (!seg) { derived = null; how = 'Ingen startnivå dekker uka.' }
    else if (week.role === 'loading') {
      derived = seg.value * Math.pow(1 + track.ramp, k)
      how = k === 0
        ? `Startnivå ${fig(seg.value, track.currency)} fra uke ${isoWeek(seg.from)}: uka starter der.`
        : `Startnivå ${fig(seg.value, track.currency)} fra uke ${isoWeek(seg.from)}, så +${String(track.ramp * 100).replace('.', ',')} % for hver av de ${k} harde ukene før.`
      lastLoading = { value: derived, key: week.key }; k++
    } else if (week.role === 'recovery') {
      const base = lastLoading ? lastLoading.value : seg.value
      derived = base * 0.7
      how = `Lett uke: 70 % av ${lastLoading ? 'uke ' + isoWeek(lastLoading.key) : 'startnivået'} (${fig(base, track.currency)}).`
    } else {
      const base = lastLoading ? lastLoading.value : seg.value
      const f = [0.75, 0.55, 0.4][week.taperIndex] ?? 0.4
      derived = base * f
      how = `Nedtrapping: ${Math.round(f * 100)} % av ${lastLoading ? 'uke ' + isoWeek(lastLoading.key) : 'startnivået'} (${fig(base, track.currency)}).`
    }
    const override = track.overrides[week.key]
    const authored = override != null
    out.push({ ...week, value: authored ? override : derived, derived, authored, how, segFrom: seg ? seg.from : null })
  }
  return out
}
/** ADR 0084 §3: a loading week rising more than 10 % over the loading week before it (easy weeks skipped, taper ends). */
function riseWarnings(rows, touched, currency) {
  const out = []
  let prev = null
  for (const r of rows) {
    if (r.role === 'taper') break
    if (r.role !== 'loading') continue
    if (prev && prev.value != null && r.value != null && prev.value > 0 && touched.has(r.key)) {
      const a = round(prev.value, currency), b = round(r.value, currency)
      const rise = b / a - 1
      if (rise > 0.1) out.push(`Uke ${isoWeek(r.key)}: ${fig(prev.value, currency)} → ${fig(r.value, currency)}, +${Math.round(rise * 100)} % over forrige harde uke.`)
    }
    prev = r
  }
  return out
}

// ───────── the edit (season-anchor kind for previewSeasonEdit) ─────────
// action: 'add' (a re-anchor from a week; edits the one already there), 'set' (a segment's value), 'remove'
function previewAnchorEdit(plan, track, edit, firstUnbegun) {
  const segs = track.segments.map((s) => ({ ...s }))
  const week = plan.weeksList.find((w) => w.key === edit.week)
  let summary
  if (edit.action === 'add') {
    if (!week) return { refusal: 'week-outside-plan' }
    if (edit.week < firstUnbegun) return { refusal: 'week-lived' }
    const existing = segs.find((s) => s.from === edit.week)
    if (existing) { if (existing.value === edit.value) return { refusal: 'no-change' }; summary = { kind: 'edit-existing', before: existing.value }; existing.value = edit.value }
    else { const now = targets(plan, track, track.segments).find((r) => r.key === edit.week); segs.push({ from: edit.week, value: edit.value }); summary = { kind: 'add', before: now ? now.value : null } }
  } else if (edit.action === 'set') {
    const seg = segs.find((s) => s.from === edit.week)
    if (!seg) return { refusal: 'segment-not-found' }
    if (seg.value === edit.value) return { refusal: 'no-change' }
    if (seg.from < firstUnbegun) return { refusal: 'segment-covers-lived', segFrom: seg.from, value: edit.value }
    summary = { kind: 'set', before: seg.value }; seg.value = edit.value
  } else {
    const idx = segs.findIndex((s) => s.from === edit.week)
    if (idx < 0) return { refusal: 'segment-not-found' }
    const earliest = segs.filter((s) => !s.outside).sort((a, b) => a.from < b.from ? -1 : 1)[0]
    if (segs[idx] === earliest) return { refusal: 'earliest' }
    if (segs[idx].from < firstUnbegun && !segs[idx].outside) return { refusal: 'changes-lived-weeks' }
    summary = { kind: 'remove', before: segs[idx].value }; segs.splice(idx, 1)
  }
  const before = targets(plan, track, track.segments)
  const after = targets(plan, track, segs)
  const changed = []; const held = []
  after.forEach((a, i) => {
    const b = before[i]
    if (a.key < firstUnbegun) { if (round(a.value ?? -1, track.currency) !== round(b.value ?? -1, track.currency)) changed.lived = true; return }
    if (a.authored) { if (round(a.derived ?? -1, track.currency) !== round(b.derived ?? -1, track.currency)) held.push(a); return }
    if (round(a.value ?? -1, track.currency) !== round(b.value ?? -1, track.currency)) changed.push({ ...a, before: b.value })
  })
  if (changed.lived) return { refusal: 'changes-lived-weeks' }
  if (changed.length === 0) return { refusal: 'no-change' }
  const touched = new Set(changed.map((c) => c.key))
  const warnings = riseWarnings(after, touched, track.currency)
  const digest = JSON.stringify([track.id, edit, firstUnbegun, track.segments])
  return { edit: { ...edit }, track, summary, changed, held, warnings, digest, segsAfter: segs }
}

const REFUSALS = {
  'week-lived': 'Den uka har begynt eller er over. Ukene du har trent står som de ble.',
  'week-outside-plan': 'Den uka er ikke i planen.',
  'changes-lived-weeks': 'Det ville endre en uke du allerede har trent. Ukene du har trent står som de ble.',
  'no-change': 'Det er det planen allerede sier. Ingenting å endre.',
  'segment-not-found': 'Det startnivået er ikke lenger en del av planen.',
  'earliest': 'Sesongstarten kan endres, men ikke fjernes.',
  'preview-stale': 'Planen har endret seg siden forhåndsvisningen: uke 46 har begynt. Ingenting er lagret.',
}

function headline(p) {
  const t = p.track, u = WEEKLY[t.currency], w = isoWeek(p.edit.week)
  const n = p.changed.length, weeks = n === 1 ? '1 uke får nytt mål' : `${n} uker får nytt mål`
  const v = (x) => x == null ? 'ingen' : fig(x, t.currency).replace(' ' + UNIT[t.currency], '')
  if (p.summary.kind === 'add') return `${t.name} fra uke ${w}: nytt startnivå ${v(p.edit.value)} ${u}, og stigningen starter på nytt der. ${weeks}.`
  if (p.summary.kind === 'edit-existing') return `${t.name}: startnivået fra uke ${w} endres fra ${v(p.summary.before)} til ${v(p.edit.value)} ${u}. Uka hadde allerede et startnivå, så det endres i stedet for å legge til et nytt. ${weeks}.`
  if (p.summary.kind === 'set') return `${t.name}: startnivået fra uke ${w} endres fra ${v(p.summary.before)} til ${v(p.edit.value)} ${u}. ${weeks}.`
  return `${t.name}: startnivået fra uke ${w} (${v(p.summary.before)} ${u}) fjernes, og ukene regnes fra startnivået før. ${weeks}.`
}
function heldSentence(p, plan) {
  const parts = ['fasene', 'ukene før uke ' + isoWeek(state.firstUnbegun)]
  if (plan.tracks.length > 1) parts.push('de andre sporene')
  if (p.held.length) parts.push('ukene du har satt selv')
  const list = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(', ') + ' og ' + parts.at(-1)
  return list.charAt(0).toUpperCase() + list.slice(1) + ' står som før.'
}

// ───────── state ─────────
let state
function fresh(dataKey) {
  const plan = DATA[dataKey]()
  plan.weeksList = weeksOf(plan)
  return { dataKey, plan, firstUnbegun: plan.firstUnbegun, begunSim: false, advOpen: false, editOpen: {}, form: null, preview: null, refusal: null, confirmError: null, openHow: new Set(), toast: null }
}
const firstUnbegunNow = () => state.begunSim ? addWeeks(state.plan.firstUnbegun, 1) : state.plan.firstUnbegun
const endurance = () => state.plan.tracks
const trackById = (id) => state.plan.tracks.find((t) => t.id === id)

/** The form a lead link opens on (`?edit=season-anchor&trackId=…`): the act that will not be refused. */
function defaultForm(trackId) {
  const t = trackById(trackId)
  const fu = state.firstUnbegun
  const seg = segmentAt(t.segments, fu)
  const rows = targets(state.plan, t, t.segments)
  const now = rows.find((r) => r.key === fu)
  // The segment in force began before the first unbegun week: changing its value would rewrite lived weeks,
  // so the edit opens on a fresh start from the first unbegun week, pre-filled with that week's own target.
  if (!seg || seg.from < fu) return { trackId, action: 'add', week: fu, value: now && now.value != null ? fmtField(now.value, t.currency) : '' , setWeek: firstSettable(t), removeWeek: firstRemovable(t) }
  return { trackId, action: 'set', week: fu, value: fmtField(seg.value, t.currency), setWeek: seg.from, removeWeek: firstRemovable(t) }
}
const fmtField = (v, c) => String(round(v, c)).replace('.', ',')
const firstSettable = (t) => (t.segments.find((s) => !s.outside && s.from >= state.firstUnbegun) || t.segments[0]).from
function removable(t) { const sorted = t.segments.filter((s) => !s.outside).sort((a, b) => a.from < b.from ? -1 : 1); return t.segments.filter((s) => s !== sorted[0]).sort((a, b) => a.from < b.from ? -1 : 1) }
const firstRemovable = (t) => { const r = removable(t).find((s) => s.outside || s.from >= state.firstUnbegun); return r ? r.from : (removable(t)[0] || {}).from }

// ───────── render ─────────
const icon = {
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  cal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>',
  adj: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h6M14 18h6M4 6h10M18 6h2M14 4v4M10 16v4"/></svg>',
}

function curve(plan, track) {
  const rows = targets(plan, track, track.segments)
  const vals = rows.map((r) => r.value ?? 0)
  const max = Math.max(...vals, 1)
  const W = 320, H = 64, step = W / (rows.length - 1)
  const pts = rows.map((r, i) => `${(i * step).toFixed(1)},${(H - 4 - (vals[i] / max) * (H - 12)).toFixed(1)}`)
  const ni = rows.findIndex((r) => r.key >= state.firstUnbegun) - 1
  const [nx, ny] = pts[Math.max(ni, 0)].split(',')
  return `<svg class="lead-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Sesongen som kurve, denne uka markert">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--track-${track.ink})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <line x1="${nx}" x2="${nx}" y1="0" y2="${H}" stroke="var(--primary)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"/>
  </svg>`
}

function leadVolume() {
  const rows = endurance().filter((t) => t.segments.some((s) => !s.outside))
  if (rows.length === 0) return ''
  return `<div class="vol stack-1" data-lead-volume>
    <h2 class="t-overline muted" id="lead-volume">Ukevolum</h2>
    <ul role="list" aria-labelledby="lead-volume" style="list-style:none;margin:0;padding:0">
    ${rows.map((t) => {
      const r = targets(state.plan, t, t.segments).find((x) => x.key === state.firstUnbegun)
      return `<li class="vol-row">
        <span class="dot dot-${t.ink}" aria-hidden="true"></span>
        <span class="what"><span class="track ink-${t.ink}">${esc(t.name)}</span>
          <span class="t-footnote muted num" style="display:block">${r && r.value != null ? `Uke ${isoWeek(state.firstUnbegun)}: <span style="white-space:nowrap">${fig(r.value, t.currency)}</span>${r.authored ? ' · satt selv' : ''}` : 'Uke ' + isoWeek(state.firstUnbegun) + ': utilgjengelig'}</span></span>
        <a class="pill" href="?edit=season-anchor&trackId=${t.id}#season-edit-season-anchor" data-open-anchor="${t.id}" aria-label="Endre volumet for ${esc(t.name.toLowerCase())}">${icon.adj}Endre volumet</a>
      </li>`
    }).join('')}
    </ul>
    ${state.plan.strength ? `<p class="t-footnote muted">Styrke planlegges i blokker under Avansert.</p>` : ''}
  </div>`
}

function lead() {
  const p = state.plan, run = p.tracks[0]
  const total = p.weeksList.length
  // the next easy week from the first unbegun one
  const rows = targets(p, run, run.segments)
  const easy = rows.find((r) => r.key >= state.firstUnbegun && r.role === 'recovery')
  return `<section class="narrow" aria-labelledby="plan-name" data-plan-lead>
    <div class="card stack-4">
      <header class="stack-1">
        <h1 id="plan-name" class="t-title wrap" style="text-wrap:balance">${esc(p.planName)}</h1>
        <p class="t-footnote muted">Fagnavn: ${esc(p.family)}</p>
        <p class="t-footnote muted num wrap">Mot <a href="#" style="color:var(--foreground);font-weight:600;text-decoration:none">${esc(p.event.name)}</a> · ${fullDate(p.event.date)} · ${total} uker fra ${fullDate(p.startKey)}</p>
      </header>
      ${curve(p, run)}
      ${easy ? `<p class="t-callout">Neste lette uke er uke ${isoWeek(easy.key)}, fra ${fullDate(easy.key)}.</p>` : ''}
      ${leadVolume()}

  </section>`
}

function anchorEdit() {

  const segLabel = (s) => s.outside ? `Utenfor planen · ${fig(s.value, t.currency)}` : `Fra uke ${isoWeek(s.from)} · ${fig(s.value, t.currency)}`
  const sorted = t.segments.filter((s) => !s.outside).sort((a, b) => a.from < b.from ? -1 : 1)
  const earliest = sorted[0]
  const rem = removable(t)

  const nowRow = rows.find((r) => r.key === f.week)

        : nowRow ? `Nå: ${nowRow.value == null ? 'utilgjengelig' : fig(nowRow.value, t.currency)}${nowRow.authored ? ' (satt selv)' : ''}, regnet fra startnivået ${inForce ? fig(inForce.value, t.currency) + ' fra uke ' + isoWeek(inForce.from) : '–'}.` : ''}</p></div>
      <div><label class="label" for="a-value">Starter på, ${WEEKLY[t.currency]}</label>
      <input class="field num" id="a-value" name="value" inputmode="decimal" autocomplete="off" value="${esc(f.value)}" ${fieldErr ? 'aria-invalid="true" aria-describedby="a-value-err"' : ''}>
      ${fieldErr ? `<p class="err" id="a-value-err">${fieldErr}</p>` : ''}</div>
      <p class="t-footnote muted">Stigningen starter på nytt her: uka du velger er dette tallet, og de harde ukene etter stiger fra det.</p>`
  } else if (f.action === 'set') {
    fields = `<div><label class="label" for="s-week">Startnivå</label>
      <select class="field" id="s-week" name="week">${t.segments.map((s) => `<option value="${s.from}" ${s.from === f.setWeek ? 'selected' : ''}>${segLabel(s)}${s === earliest ? ' · sesongstart' : ''}</option>`).join('')}</select></div>
      <div><label class="label" for="s-value">Nytt tall, ${WEEKLY[t.currency]}</label>
      <input class="field num" id="s-value" name="value" inputmode="decimal" autocomplete="off" value="${esc(f.value)}" ${fieldErr ? 'aria-invalid="true" aria-describedby="s-value-err"' : ''}>
      ${fieldErr ? `<p class="err" id="s-value-err">${fieldErr}</p>` : ''}</div>
      <p class="t-footnote muted">Endrer hver uke startnivået gjelder for, fram til neste startnivå.</p>`
  } else {
    fields = `<div><label class="label" for="r-week">Startnivå</label>
      <select class="field" id="r-week" name="week">${rem.map((s) => `<option value="${s.from}" ${s.from === f.removeWeek ? 'selected' : ''}>${segLabel(s)}</option>`).join('')}</select>
      <p class="t-footnote muted" style="margin-top:6px">Sesongstarten (${segLabel(earliest)}) kan endres, men ikke fjernes, så den står ikke her.</p></div>`
  }
  return `<div class="section" id="season-edit-season-anchor" data-season-edit="season-anchor" style="scroll-margin-top:16px">
    <button class="row-btn" aria-expanded="${open}" aria-controls="sa-panel" data-toggle-edit="season-anchor">
      <span style="min-width:0;flex:1"><span class="t-callout" style="display:block">Endre startnivået</span><span class="t-footnote muted" style="display:block">Tallet hver uke regnes fra</span></span>${icon.chev}
    </button>
    <div class="collapse" id="sa-panel" ${open ? 'data-open' : ''}><div class="inner"><div class="stack-4" style="padding:8px 0 8px">
      <form class="stack-4" data-anchor-form novalidate aria-label="Endre startnivået">
        ${tracks.length > 1 ? `<div><label class="label" for="a-track">Spor</label><select class="field" id="a-track" name="trackId">${tracks.map((x) => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)} (${WEEKLY[x.currency]})</option>`).join('')}</select></div>` : ''}
        <fieldset class="choices"><legend>Hva vil du gjøre?</legend>
          ${choice('add', 'Start på nytt fra en uke', 'Ukene fra den uka regnes fra et nytt tall. Ukene før står.')}
          ${choice('set', 'Endre tallet i et startnivå', 'Hver uke det gjelder for, får nytt mål.')}
          ${rem.length ? choice('remove', 'Fjern et nytt startnivå', 'Ukene regnes fra startnivået før igjen.') : ''}

    const fromW = isoWeek(r.segFrom), lastLived = isoWeek(addWeeks(state.firstUnbegun, -1))

// ───────── behaviour ─────────
const stage = document.getElementById('stage')
function render() {
  const y = window.scrollY
  const active = document.activeElement && document.activeElement.id
  stage.innerHTML = app()
  window.scrollTo(0, y)
  if (active) document.getElementById(active)?.focus({ preventScroll: true })
}
function readForm() {
  const form = stage.querySelector('[data-anchor-form]')
  if (!form) return
  const fd = new FormData(form)
  const f = state.form
  if (fd.get('trackId') && fd.get('trackId') !== f.trackId) { state.form = defaultForm(fd.get('trackId')); return 'track' }
  f.action = fd.get('action') || f.action
  const week = fd.get('week')
  if (week) { if (f.action === 'add') f.week = week; else if (f.action === 'set') f.setWeek = week; else f.removeWeek = week }
  if (fd.has('value')) f.value = fd.get('value')
}
function editOf(f) {
  const t = trackById(f.trackId)
  if (f.action === 'remove') return { action: 'remove', week: f.removeWeek }
  const parsed = parseNb(f.value)
  if (parsed.error) return { error: parsed.error }
  return { action: f.action, week: f.action === 'add' ? f.week : f.setWeek, value: round(parsed.value, t.currency) }
}
/** A preview whose form has changed since is hidden (ADR 0084 §1). */
function previewStillShown() {
  if (!state.preview) return
  const e = editOf(state.form)
  if (e.error || JSON.stringify(e) !== JSON.stringify(state.preview.edit) || state.form.trackId !== state.preview.track.id) { state.preview = null; state.confirmError = null }
}
function askPreview() {
  state.fieldError = null; state.refusal = null; state.confirmError = null; state.openHow = new Set()
  const e = editOf(state.form)
  if (e.error) { state.fieldError = e.error; state.preview = null; return }
  const r = previewAnchorEdit(state.plan, trackById(state.form.trackId), e, state.firstUnbegun)
  if (r.refusal) { state.refusal = r; state.preview = null } else state.preview = r
}
function openFromLead(trackId) {
  state.form = defaultForm(trackId)
  state.preview = null; state.refusal = null; state.fieldError = null
  state.advOpen = true; state.editOpen['season-anchor'] = true
  render()
  // `motion-collapse` 200 ms and a frame, then the edit to the top — unless the reader moved the page meanwhile.
  let cancelled = false
  const cancel = () => { cancelled = true }
  ;['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach((t) => window.addEventListener(t, cancel, { once: true, passive: true }))
  setTimeout(() => {
    if (!cancelled) document.getElementById('season-edit-season-anchor')?.scrollIntoView({ block: 'start' })
    document.querySelector('[data-anchor-form] input[name=action]:checked')?.focus({ preventScroll: true })
  }, 250)
}
function confirmEdit() {
  const p = state.preview
  // the apply recomputes the preview and refuses when its digest no longer matches (preview-stale)
  const live = firstUnbegunNow()
  const again = previewAnchorEdit(state.plan, p.track, p.edit, live)
  if (again.refusal || again.digest !== p.digest) { state.confirmError = 'preview-stale'; return }
  const t = p.track
  const text = headline(p) + ' ' + heldSentence(p, state.plan)
  t.segments = p.segsAfter
  state.preview = null; state.refusal = null
  state.form = defaultForm(t.id)
  state.toast = { text }
  clearTimeout(state.toastTimer)
  state.toastTimer = setTimeout(() => { if (state.toast) { state.toast.leaving = true; render(); setTimeout(() => { state.toast = null; render() }, 200) } }, 5000)
}

stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-open-anchor],[data-toggle-adv],[data-toggle-edit],[data-how],[data-offer-readd],[data-repreview]')
  if (!el) { if (e.target.closest('a[href="#"]')) e.preventDefault(); return }
  e.preventDefault()
  if (el.dataset.openAnchor) return openFromLead(el.dataset.openAnchor)
  if ('toggleAdv' in el.dataset) { state.advOpen = !state.advOpen; return render() }
  if (el.dataset.toggleEdit) { state.editOpen[el.dataset.toggleEdit] = !state.editOpen[el.dataset.toggleEdit]; return render() }
  if (el.dataset.how) { const k = el.dataset.how; state.openHow.has(k) ? state.openHow.delete(k) : state.openHow.add(k); const exp = state.openHow.has(k); el.setAttribute('aria-expanded', exp); document.getElementById('how-' + k).toggleAttribute('data-open', exp); return }
  if ('offerReadd' in el.dataset) { const v = state.refusal.value; const t = trackById(state.form.trackId); state.form.action = 'add'; state.form.week = state.firstUnbegun; state.form.value = fmtField(v, t.currency); askPreview(); render(); document.querySelector('[data-season-edit-preview]')?.scrollIntoView({ block: 'nearest' }); return }
  if ('repreview' in el.dataset) { state.firstUnbegun = firstUnbegunNow(); state.form = { ...state.form, week: state.form.week < state.firstUnbegun ? state.firstUnbegun : state.form.week }; askPreview(); render(); return }
})
stage.addEventListener('change', (e) => {
  if (!e.target.closest('[data-anchor-form]')) return
  const what = readForm()
  if (e.target.name === 'action' || e.target.name === 'week' || what === 'track') {
    state.refusal = null; state.fieldError = null
    if (e.target.name === 'action' && state.form.action === 'set') { const t = trackById(state.form.trackId); const s = t.segments.find((x) => x.from === state.form.setWeek); if (s) state.form.value = fmtField(s.value, t.currency) }
    if (e.target.name === 'week' && state.form.action === 'set') { const t = trackById(state.form.trackId); const s = t.segments.find((x) => x.from === state.form.setWeek); if (s) state.form.value = fmtField(s.value, t.currency) }
    if (e.target.name === 'week' && state.form.action === 'add') { const t = trackById(state.form.trackId); const r = targets(state.plan, t, t.segments).find((x) => x.key === state.form.week); const s = t.segments.find((x) => x.from === state.form.week); state.form.value = s ? fmtField(s.value, t.currency) : r && r.value != null ? fmtField(r.value, t.currency) : '' }
    previewStillShown(); render()
  }
})
stage.addEventListener('input', (e) => {
  if (!e.target.closest('[data-anchor-form]')) return
  readForm()
  const had = !!state.preview
  previewStillShown()
  if (had && !state.preview) render()
})
stage.addEventListener('submit', (e) => {
  e.preventDefault()
  if (e.target.matches('[data-anchor-form]')) { readForm(); askPreview(); render(); if (state.preview) document.querySelector('[data-season-edit-preview]')?.scrollIntoView({ block: 'nearest' }) }
  if (e.target.matches('[data-confirm]')) { confirmEdit(); render() }
})

// ───────── harness: PICKER.md reference wiring (one variant) + break-ui toggle ─────────
const params = new URLSearchParams(location.search)
let dataKey = params.get('data') === 'worst' ? 'worst' : 'demo'
const variants = [() => { state = fresh(dataKey); state.form = defaultForm(state.plan.tracks[0].id); return app() }]
const picker = document.querySelector('.proto-picker')
const highlight = picker.querySelector('.proto-picker-highlight')
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')]
const replay = picker.querySelector('.proto-picker-replay')
let current = 0
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)` }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); afterMount() }) }
function setActive(i) {
  if (i < 0 || i >= variants.length) return
  current = i
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current') })
  moveHighlight()
  try { const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url) } catch {}
  mount(i)
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)))
replay?.addEventListener('click', () => mount(current))
window.addEventListener('resize', moveHighlight)
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const num = parseInt(e.key, 10)
  if (num >= 1 && num <= variants.length) setActive(num - 1)
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length)
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length)
  else if (e.key === 'r' || e.key === 'R') mount(current)
})
const toggle = document.querySelector('.data-toggle')
function syncToggle() { toggle.querySelectorAll('[data-data]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.data === dataKey))) }
toggle.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.data) { dataKey = b.dataset.data; try { const url = new URL(location); url.searchParams.set('data', dataKey); history.replaceState(null, '', url) } catch {} syncToggle(); mount(current) }
  if (b.dataset.sim) { state.begunSim = !state.begunSim; b.setAttribute('aria-pressed', String(state.begunSim)) }
})
syncToggle()
// screenshot hooks: ?shot=1 hides the chrome; ?flow=… drives the prototype to a state
function afterMount() {
  toggle.querySelector("[data-sim]").setAttribute("aria-pressed", "false")
  if (params.get('shot')) document.body.dataset.shot = '1'
  window.__proto = { state: () => state, openFromLead, render }
}
setActive((parseInt(params.get('v'), 10) || 1) - 1)
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')))
</script>
